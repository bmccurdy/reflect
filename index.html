<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflect — FirstWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;700;900&family=Fraunces:opsz,wght,SOFT@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   REFLECT — clickable prototype
   Staff surfaces: strict FirstWatch design.md tokens.
   Patient surface: scoped extension tokens (see docs/design-extensions.md)
   ============================================================ */

:root{
  /* ---- design.md semantic tokens (light) ---- */
  --background:#FFFFFF; --foreground:#171717;
  --card:#FFFFFF; --card-foreground:#171717;
  --popover:#FFFFFF; --popover-foreground:#171717;
  --primary:#0284C7; --primary-hover:#0369A1; --primary-foreground:#FFFFFF;
  --secondary:#F5F5F5; --secondary-foreground:#525252;
  --muted:#F5F5F5; --muted-foreground:#737373;
  --accent:#F0F9FF; --accent-foreground:#0369A1;
  --destructive:#DC2626; --destructive-hover:#B91C1C; --destructive-foreground:#FFFFFF;
  --border:#D4D4D4; --input:#D4D4D4; --ring:#2563EB;

  /* ---- EXTENSION: status taxonomy (pending canonization) ---- */
  --status-critical:#DC2626;      /* = destructive */
  --status-critical-wash:#FEF2F2;
  --status-elevated:#B45309;      /* 4.9:1 on white */
  --status-elevated-wash:#FFFBEB;
  --status-resolved:#15803D;      /* 4.8:1 on white */
  --status-resolved-wash:#F0FDF4;
  --status-normal:#737373;        /* = muted-foreground, no chroma spent */
  --status-inactive:#A3A3A3;

  /* ---- radii / spacing (design.md) ---- */
  --r-sm:2px; --r-default:4px; --r-md:6px; --r-lg:8px; --r-xl:12px; --r-full:9999px;

  /* ---- EXTENSION: motion tokens ---- */
  --dur-micro:160ms; --dur-layout:260ms; --dur-page:320ms;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-spring:cubic-bezier(.34,1.36,.64,1);
  --stagger:50ms;

  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.05);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.06);

  --font:'Lato',-apple-system,'Segoe UI',sans-serif;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-mono:Menlo,ui-monospace,monospace;
}

html[data-theme="dark"]{
  --background:#171717; --foreground:#FFFFFF;
  --card:#171717; --card-foreground:#FFFFFF;
  --popover:#171717; --popover-foreground:#FFFFFF;
  --primary:#0EA5E9; --primary-hover:#38BDF8; --primary-foreground:#262626;
  --secondary:#262626; --secondary-foreground:#D4D4D4;
  --muted:#262626; --muted-foreground:#D4D4D4;
  --accent:#0369A1; --accent-foreground:#E0F2FE;
  --destructive:#EF4444; --destructive-hover:#F45B5B; --destructive-foreground:#171717;
  --border:#404040; --input:#404040; --ring:#2563EB;
  --status-critical:#EF4444; --status-critical-wash:#2A1A1A;
  --status-elevated:#FBBF24; --status-elevated-wash:#2A2318;
  --status-resolved:#4ADE80; --status-resolved-wash:#16251B;
  --status-normal:#D4D4D4; --status-inactive:#737373;
  --shadow-md:0 1px 3px rgba(0,0,0,.5);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.6);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,.7);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  font-size:16px;line-height:24px;
  background:var(--background);color:var(--foreground);
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
/* Lato weight mapping — never synthesize (design.md) */
.w-medium{font-weight:400}.w-semibold{font-weight:700}.w-extrabold{font-weight:900}

button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
:focus:not(:focus-visible){outline:none}
a{color:var(--primary);text-decoration:none}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}

/* ---------- type scale (design.md) ---------- */
.t-h1{font-size:48px;line-height:48px;font-weight:900;letter-spacing:-.012em}
.t-h2{font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.0075em}
.t-h3{font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.006em}
.t-h4{font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.005em}
.t-lead{font-size:20px;line-height:28px;font-weight:400}
.t-p{font-size:16px;line-height:28px}
.t-pui{font-size:16px;line-height:24px}
.t-body{font-size:14px;line-height:24px}
.t-subtle{font-size:14px;line-height:20px}
.t-small{font-size:14px;line-height:14px;font-weight:400}
.t-detail{font-size:12px;line-height:20px;font-weight:400;letter-spacing:.01em}
.dim{color:var(--muted-foreground)}

/* ---------- controls ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:40px;padding:8px 16px;border-radius:var(--r-md);
  font-size:14px;line-height:14px;font-weight:700;
  border:1px solid transparent;cursor:pointer;white-space:nowrap;
  transition:background-color var(--dur-micro) var(--ease-out),
             border-color var(--dur-micro) var(--ease-out),
             transform var(--dur-micro) var(--ease-spring),
             box-shadow var(--dur-micro) var(--ease-out);
}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover:not([disabled]){background:var(--primary-hover)}
.btn-secondary{background:var(--secondary);color:var(--secondary-foreground)}
.btn-secondary:hover{background:color-mix(in srgb,var(--secondary) 80%,transparent)}
.btn-outline{background:var(--background);color:var(--foreground);border-color:var(--border)}
.btn-outline:hover{background:var(--accent);color:var(--accent-foreground)}
.btn-ghost{background:transparent;color:var(--foreground)}
.btn-ghost:hover{background:var(--accent);color:var(--accent-foreground)}
.btn-destructive{background:var(--destructive);color:var(--destructive-foreground)}
.btn-destructive:hover{background:var(--destructive-hover)}
.btn-sm{height:36px;padding:6px 12px}
.btn-lg{height:44px;padding:10px 32px}
.btn-icon{width:40px;height:40px;padding:0}

.input{
  width:100%;height:40px;padding:8px 12px;
  background:var(--background);color:var(--foreground);
  border:1px solid var(--input);border-radius:var(--r-md);
  font-size:14px;line-height:20px;
  transition:border-color var(--dur-micro) var(--ease-out);
}
.input:hover{border-color:var(--muted-foreground)}
textarea.input{height:auto;min-height:88px;padding:12px;resize:vertical;line-height:24px}

.badge{
  display:inline-flex;align-items:center;gap:4px;
  height:24px;padding:2px 10px;border-radius:var(--r-full);
  font-size:12px;line-height:20px;font-weight:700;white-space:nowrap;
}
.badge-outline{border:1px solid var(--border);color:var(--foreground)}
.badge-secondary{background:var(--secondary);color:var(--secondary-foreground)}
.badge-critical{background:var(--status-critical);color:#fff}
.badge-elevated{background:var(--status-elevated-wash);color:var(--status-elevated);border:1px solid currentColor}
.badge-resolved{background:var(--status-resolved-wash);color:var(--status-resolved);border:1px solid currentColor}
.badge-normal{background:var(--secondary);color:var(--status-normal)}

.card{
  background:var(--card);color:var(--card-foreground);
  border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;
}
.card-tight{padding:16px}

/* ---------- app shell ---------- */
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  height:56px;flex:0 0 auto;display:flex;align-items:center;gap:16px;
  padding:0 24px;border-bottom:1px solid var(--border);background:var(--card);
  position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.01em;font-size:16px}
.brand-mark{
  width:24px;height:24px;border-radius:var(--r-default);
  background:var(--primary);color:#fff;display:grid;place-items:center;
  font-size:12px;font-weight:900;
}
.brand-sub{color:var(--muted-foreground);font-weight:400;font-size:14px}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{
  display:flex;align-items:center;height:32px;padding:0 12px;
  border-radius:var(--r-sm);font-size:14px;font-weight:700;
  color:var(--muted-foreground);
  transition:background-color var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out);
}
.nav a:hover{background:var(--accent);color:var(--accent-foreground)}
.nav a[aria-current="page"]{background:var(--secondary);color:var(--foreground)}
.nav .count{
  margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-full);
  background:var(--status-critical);color:#fff;font-size:11px;line-height:18px;
  text-align:center;font-weight:700;
}
.spacer{flex:1}

/* demo-only affordance — see docs/decisions.md #1 */
.demo-switch{display:flex;align-items:center;gap:8px}
.demo-tag{
  font-size:10px;line-height:14px;font-weight:900;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted-foreground);
  border:1px dashed var(--border);border-radius:var(--r-sm);padding:1px 5px;
}
.seg{display:flex;background:var(--muted);border-radius:var(--r-md);padding:4px;gap:2px}
.seg button{
  height:28px;padding:0 10px;border:0;background:transparent;border-radius:var(--r-sm);
  font-size:13px;font-weight:700;color:var(--muted-foreground);cursor:pointer;
  transition:all var(--dur-micro) var(--ease-out);
}
.seg button[aria-pressed="true"]{background:var(--background);color:var(--foreground);box-shadow:var(--shadow-sm)}

.main{flex:1;padding:32px 24px 96px;max-width:1280px;width:100%;margin:0 auto}
.page-head{margin-bottom:24px}
.crumbs{display:flex;gap:8px;align-items:center;font-size:14px;line-height:20px;color:var(--muted-foreground);margin-bottom:8px}
.crumbs .sep{opacity:.5}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.sec{margin-top:24px}

/* stale banner */
.stale{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;border:1px solid var(--border);border-radius:var(--r-lg);
  background:var(--muted);color:var(--muted-foreground);
  font-size:14px;line-height:20px;margin-bottom:16px;
}
.dot{width:8px;height:8px;border-radius:var(--r-full);background:var(--status-elevated);flex:0 0 auto}

/* stat tiles */
.stat{padding:16px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card)}
.stat .k{font-size:12px;line-height:20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground)}
.stat .v{font-size:30px;line-height:36px;font-weight:900;letter-spacing:-.0075em;margin-top:4px}
.stat .m{font-size:14px;line-height:20px;color:var(--muted-foreground);margin-top:4px}

/* queue table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{
  text-align:left;padding:12px 16px;height:48px;
  font-size:16px;line-height:24px;font-weight:400;color:var(--muted-foreground);
  border-bottom:1px solid var(--border);white-space:nowrap;
}
.tbl td{padding:12px 16px;font-size:16px;line-height:24px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tbody tr{transition:background-color var(--dur-micro) var(--ease-out)}
.tbl tbody tr:hover{background:var(--accent)}
.tbl tbody tr.clickable{cursor:pointer}
.tbl .fav{width:52px;padding-left:12px;padding-right:0;vertical-align:middle}
.tbl .morecol{width:52px;padding-left:8px;padding-right:12px;text-align:right;vertical-align:middle}
.star-btn{color:var(--muted-foreground)}
.star-btn:hover{color:var(--status-elevated)}
.star-btn[aria-pressed="true"]{color:var(--status-elevated)}

.menu-catch{position:fixed;inset:0;z-index:28}
.menu-wrap{position:relative;display:inline-flex}
.menu-wrap.open{z-index:31}
.tbl .morecol:has(.menu-wrap.open){position:relative;z-index:31}
.menu{
  position:absolute;right:0;top:calc(100% + 4px);
  min-width:196px;padding:6px;z-index:32;
  background:var(--popover);color:var(--popover-foreground);
  border:1px solid var(--border);border-radius:var(--r-xl);
  box-shadow:var(--shadow-lg);
}
.menu button{
  display:flex;align-items:center;gap:10px;width:100%;
  height:36px;padding:0 10px;border:0;background:transparent;
  border-radius:var(--r-md);cursor:pointer;text-align:left;
  font-size:14px;line-height:20px;font-weight:400;color:inherit;
}
.menu button:hover{background:var(--muted)}
.menu button.danger{color:var(--destructive)}
.menu button.danger:hover{background:var(--status-critical-wash)}
.menu-sep{height:1px;background:var(--border);margin:6px 4px}
.tbl tbody tr.resolving{animation:resolveOut var(--dur-layout) var(--ease-out) forwards}
@keyframes resolveOut{to{opacity:0;transform:translateX(12px)}}
.snip{color:var(--muted-foreground);font-size:14px;line-height:20px;max-width:420px}
.mono{font-family:var(--font-mono);font-size:14px;font-weight:700}

.ans{padding:12px 0;border-bottom:1px solid var(--border)}
.ans:last-child{border-bottom:0}
.num-link{color:var(--primary);font-weight:700;text-decoration:none}
.num-link:hover{text-decoration:underline}

.empty{padding:64px 24px;text-align:center}
.empty .t{font-size:20px;line-height:28px;font-weight:700}
.empty .s{color:var(--muted-foreground);margin-top:8px}

/* drawer */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:50;
  animation:fade var(--dur-layout) var(--ease-out);
}
@keyframes fade{from{opacity:0}}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);z-index:51;
  background:var(--card);border-left:1px solid var(--border);
  box-shadow:var(--shadow-xl);overflow-y:auto;
  animation:slideIn var(--dur-layout) var(--ease-out);
}
@keyframes slideIn{from{transform:translateX(24px);opacity:.6}}
.drawer-head{
  position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);
  padding:20px 24px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;
}
.drawer-body{padding:24px}

.dialog-wrap{
  position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:24px;
}
.dialog{
  width:min(440px,100%);
  background:var(--card);color:var(--card-foreground);
  border:1px solid var(--border);border-radius:var(--r-xl);
  box-shadow:var(--shadow-xl);padding:24px;
  animation:rise var(--dur-layout) var(--ease-out);
}
.dialog-icon{
  width:40px;height:40px;border-radius:var(--r-lg);
  display:grid;place-items:center;
  background:var(--status-critical-wash);color:var(--destructive);
  margin-bottom:16px;
}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;flex-wrap:wrap}
.btn-ghost-destructive{background:transparent;color:var(--destructive)}
.btn-ghost-destructive:hover{background:var(--status-critical-wash);color:var(--destructive-hover)}
.kv{display:grid;grid-template-columns:132px 1fr;gap:8px 16px;font-size:14px;line-height:20px}
.kv dt{color:var(--muted-foreground)}
.kv dd{margin:0}
.quote{
  border-left:3px solid var(--primary);padding:4px 0 4px 16px;margin:16px 0;
  font-size:16px;line-height:28px;
}
.log{border-top:1px solid var(--border);margin-top:24px;padding-top:16px}
.log li{padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;line-height:20px}
.log li:last-child{border-bottom:0}

/* builder */
.split{display:grid;grid-template-columns:1fr 400px;gap:24px;align-items:start}
.preview-col{align-self:stretch}
.preview-sticky{
  position:sticky;top:72px;z-index:20;
  background:var(--background);
}
.qcard{
  border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);
  color:var(--card-foreground);
  padding:16px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;
  transition:border-color var(--dur-micro) var(--ease-out),box-shadow var(--dur-micro) var(--ease-out);
}
.qcard:hover{border-color:var(--muted-foreground);box-shadow:var(--shadow-sm)}
.qcard.locked{background:var(--muted)}
.qcard-select{cursor:pointer}
.qcard-select.selected{
  border-color:var(--primary);
  box-shadow:0 0 0 1px var(--primary);
  background:var(--accent);
}
.qcard-select.locked.selected{
  background:color-mix(in srgb,var(--accent) 55%,var(--muted));
}
.grip{color:var(--muted-foreground);cursor:grab;line-height:1;padding-top:2px}
.qmeta{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.qbtns{display:flex;gap:4px;margin-left:auto}
.iconbtn{
  width:32px;height:32px;border:0;background:transparent;border-radius:var(--r-sm);
  color:var(--muted-foreground);cursor:pointer;display:grid;place-items:center;
  transition:background-color var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out);
}
.iconbtn:hover{background:var(--accent);color:var(--accent-foreground)}
.iconbtn[disabled]{opacity:.5;cursor:not-allowed}
.phone-frame{
  border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden;
  background:#6E6C68;
}
.phone-frame .cap{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;font-size:12px;line-height:20px;color:var(--muted-foreground);
  border-bottom:1px solid var(--border);background:var(--card);
}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.preview-overlay{
  position:fixed;inset:0;z-index:56;
  display:flex;flex-direction:column;
  background:#6E6C68;
  animation:fade var(--dur-layout) var(--ease-out);
}
html[data-theme="dark"] .preview-overlay{background:#121417}
.preview-bar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:10px 16px;background:var(--card);color:var(--card-foreground);
  border-bottom:1px solid var(--border);
}
.preview-bar .t{font-size:14px;line-height:20px;font-weight:700}
.preview-bar .s{font-size:13px;line-height:20px;font-weight:400;color:var(--muted-foreground)}
.preview-stage{flex:1;overflow-y:auto}
.preview-stage .patient{min-height:100%;padding-top:32px}

/* leadership */
.bars{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.bar-row{display:grid;grid-template-columns:180px 1fr 56px;gap:12px;align-items:center;font-size:14px;line-height:20px}
.bar{height:8px;border-radius:var(--r-full);background:var(--muted);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--r-full);background:var(--primary);
  animation:grow var(--dur-page) var(--ease-out) both}
@keyframes grow{from{transform:scaleX(0);transform-origin:left}}
.gap-flag{color:var(--status-elevated);font-weight:700}

/* stagger entrance */
.stagger>*{animation:rise var(--dur-page) var(--ease-out) both;animation-delay:calc(var(--i,0)*var(--stagger))}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* ============================================================
   PATIENT SURFACE — scoped extension tokens
   Derivation: the lit interior of an ambulance seen from the
   gurney — dim warm surround, one bright card, amber dome light.
   ============================================================ */
.patient{
  --p-surround:#6E6C68;
  --p-card:#FDFCFA;
  --p-ink:#1A1D22;
  --p-ink-soft:#585D66;
  --p-amber:#E0A458;
  --p-amber-deep:#9A6520;
  --p-on-amber:#FFFFFF;
  --p-line:#E5E0D8;
  --p-rule:#98907E;
  --p-face:#FFFFFF;
  --p-face-hover:#FFFDF8;
  --p-face-on:#FFF8EC;
  --p-note-bg:#FBF7F0;
  --p-mute:#8A9099;
  --p-chrome:#E8E5E0;
  --p-placeholder:#9AA0A8;
  --p-cta:#1A1D22;
  --p-cta-ink:#FFFFFF;
  --p-cta-hover:#2C3039;
  min-height:100vh;background:var(--p-surround);color:var(--p-ink);
  display:flex;flex-direction:column;align-items:center;
  padding:24px 16px 48px;
}
html[data-theme="dark"] .patient{
  --p-surround:#121417;
  --p-card:#1C1F26;
  --p-ink:#F2EFE8;
  --p-ink-soft:#B0AAA0;
  --p-amber-deep:#D4A05A;
  --p-on-amber:#1A1D22;
  --p-line:#3A3D44;
  --p-rule:#5E5C56;
  --p-face:#262A32;
  --p-face-hover:#2E333C;
  --p-face-on:#3A3228;
  --p-note-bg:#2A261F;
  --p-placeholder:#7A7F88;
  --p-chrome:#8A9099;
  --p-cta:#F2EFE8;
  --p-cta-ink:#1A1D22;
  --p-cta-hover:#E5E0D8;
}
html[data-theme="dark"] .phone-frame{background:#121417}
.p-wrap{width:100%;max-width:520px}
.p-lock{
  display:flex;align-items:center;gap:8px;justify-content:center;
  color:var(--p-chrome);font-size:12px;line-height:20px;margin-bottom:16px;
}
.p-card{
  background:var(--p-card);border-radius:16px;padding:32px 28px;
  box-shadow:0 24px 48px -12px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.2);
  position:relative;overflow:hidden;
}
/* signature element: the dome-light wash across the top of the card */
.p-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--p-amber),transparent);
}
.p-display{
  font-family:var(--font-display);font-weight:600;
  font-size:32px;line-height:38px;letter-spacing:-.015em;
  font-variation-settings:"SOFT" 40,"opsz" 40;
}
.p-lede{font-size:17px;line-height:28px;color:var(--p-ink-soft);margin-top:12px}
.p-q{
  font-family:var(--font-display);font-weight:600;
  font-size:26px;line-height:34px;letter-spacing:-.01em;
  font-variation-settings:"SOFT" 40,"opsz" 30;
}
.p-help{font-size:15px;line-height:24px;color:var(--p-ink-soft);margin-top:8px}
.p-progress{display:flex;gap:6px;margin-bottom:24px}
.p-progress i{
  height:4px;flex:1;border-radius:var(--r-full);background:var(--p-line);
  transition:background-color var(--dur-layout) var(--ease-out);
}
.p-progress i.done{background:var(--p-amber-deep)}
.p-progress i.now{background:var(--p-ink)}
.p-step{font-size:13px;line-height:20px;color:var(--p-ink-soft);letter-spacing:.02em}

.p-opts{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.p-opt{
  display:flex;align-items:center;gap:12px;width:100%;min-height:56px;
  padding:14px 18px;text-align:left;cursor:pointer;
  background:var(--p-face);border:1px solid var(--p-rule);border-radius:12px;
  font-size:17px;line-height:24px;color:var(--p-ink);
  transition:border-color var(--dur-micro) var(--ease-out),
             background-color var(--dur-micro) var(--ease-out),
             transform var(--dur-micro) var(--ease-spring);
}
.p-opt:hover{border-color:var(--p-amber-deep);background:var(--p-face-hover)}
.p-opt:active{transform:scale(.99)}
.p-opt[aria-pressed="true"]{border-color:var(--p-amber-deep);background:var(--p-face-on);font-weight:700}
.p-tick{
  width:22px;height:22px;border-radius:var(--r-full);flex:0 0 auto;
  border:1.5px solid var(--p-rule);display:grid;place-items:center;
  transition:all var(--dur-micro) var(--ease-out);
}
.p-opt[aria-pressed="true"] .p-tick{background:var(--p-amber-deep);border-color:var(--p-amber-deep)}
.p-tick svg{opacity:0;transition:opacity var(--dur-micro) var(--ease-out)}
.p-opt[aria-pressed="true"] .p-tick svg{opacity:1}

/* rating scale */
.p-scale{display:flex;gap:8px;margin-top:24px}
.p-scale button{
  flex:1;min-height:64px;border-radius:12px;cursor:pointer;
  border:1px solid var(--p-rule);background:var(--p-face);color:var(--p-ink);
  font-size:20px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:all var(--dur-micro) var(--ease-out);
}
.p-scale button span{font-size:11px;font-weight:400;color:var(--p-ink-soft);letter-spacing:.02em}
.p-scale button:hover{border-color:var(--p-amber-deep)}
.p-scale button[aria-pressed="true"]{background:var(--p-amber-deep);border-color:var(--p-amber-deep);color:var(--p-on-amber)}
.p-scale button[aria-pressed="true"] span{color:color-mix(in srgb,var(--p-on-amber) 85%,transparent)}

.p-text{
  width:100%;margin-top:24px;padding:16px;min-height:132px;resize:vertical;
  border:1px solid var(--p-rule);border-radius:12px;background:var(--p-face);
  font-size:17px;line-height:28px;color:var(--p-ink);
}
.p-text::placeholder{color:var(--p-placeholder)}
.p-count{font-size:13px;line-height:20px;color:var(--p-ink-soft);margin-top:8px;text-align:right}

.p-actions{display:flex;gap:12px;align-items:center;margin-top:28px}
.p-next{
  flex:1;min-height:56px;border:0;border-radius:12px;cursor:pointer;
  background:var(--p-cta);color:var(--p-cta-ink);font-size:17px;font-weight:700;
  transition:background-color var(--dur-micro) var(--ease-out),transform var(--dur-micro) var(--ease-spring);
}
.p-next:hover{background:var(--p-cta-hover)}
.p-next:active{transform:translateY(1px)}
.p-next[disabled]{opacity:.4;cursor:not-allowed}
.p-skip{
  min-height:56px;padding:0 18px;border:0;background:transparent;cursor:pointer;
  color:var(--p-ink-soft);font-size:16px;text-decoration:underline;text-underline-offset:3px;
}
.p-back{
  margin-top:20px;background:transparent;border:0;cursor:pointer;padding:8px 0;
  color:var(--p-mute);font-size:14px;
}
.p-note{
  margin-top:24px;padding:16px;border-radius:12px;
  background:var(--p-note-bg);border:1px solid var(--p-line);
  font-size:15px;line-height:24px;color:var(--p-ink-soft);
}
.p-optional{
  display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--r-full);
  background:var(--p-face-on);color:var(--p-amber-deep);font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
}
.p-fieldset{border:0;padding:0;margin:20px 0 0}
.p-fieldset legend{font-size:15px;font-weight:700;padding:0;margin-bottom:8px}
.p-select{
  width:100%;min-height:52px;padding:12px 14px;border-radius:12px;
  border:1px solid var(--p-rule);background:var(--p-face);color:var(--p-ink);font-size:16px;
}
.p-foot{
  margin-top:24px;text-align:center;color:var(--p-chrome);
  font-size:12px;line-height:20px;
}
.p-view{animation:pageTurn var(--dur-page) var(--ease-out) both}
@keyframes pageTurn{from{opacity:0;transform:translateY(8px)}}
.p-done .p-display{font-size:34px;line-height:42px}
.p-seal{
  width:56px;height:56px;border-radius:var(--r-full);margin:0 auto 20px;
  display:grid;place-items:center;background:var(--p-face-on);border:1px solid var(--p-amber);
  animation:seal 520ms var(--ease-spring) both 120ms;
}
@keyframes seal{from{opacity:0;transform:scale(.7)}}

/* utility */
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:1080px){
  .split{grid-template-columns:1fr}
  .preview-col,.preview-sticky{position:static;align-self:auto;z-index:auto}
  .g-4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .main{padding:24px 16px 80px}
  .topbar{padding:0 16px;gap:8px}
  .nav{display:none}
  .g-4,.g-3,.g-2{grid-template-columns:1fr}
  .t-h1{font-size:34px;line-height:38px}
  .bar-row{grid-template-columns:120px 1fr 48px}
  .brand-sub{display:none}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:80ms !important;animation-delay:0ms !important;
    transition-duration:80ms !important;
  }
  .stagger>*,.p-view,.p-seal,.bar i{animation-name:fadeOnly !important}
  @keyframes fadeOnly{from{opacity:0}}
  .tbl tbody tr.resolving{animation-name:fadeOnly !important;animation-direction:reverse !important}
}

<script>
const GATE_KEY = "reflect-gate";
const GATE_HASH = "8c04d88f20cf01cb9d8e48dc75ef6e1d36d810d2b74dbe690603f9cefe370c6e";
async function gateHash(s){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function unlockGate(){ document.body.classList.remove("is-locked"); }
if(sessionStorage.getItem(GATE_KEY)==="ok") unlockGate();
document.getElementById("gate-form").addEventListener("submit", async e=>{
  e.preventDefault();
  const err = document.getElementById("gate-err");
  err.textContent = "";
  const ok = await gateHash(document.getElementById("gate-pass").value) === GATE_HASH;
  if(!ok){ err.textContent = "That password doesn't match."; return; }
  sessionStorage.setItem(GATE_KEY, "ok");
  unlockGate();
});
</script>

let queueFilter = "open";
function setFilter(f){ queueFilter = f; render(); }

function viewAlerts(){

function drawer(id){
  const a = state.alerts.find(x=>x.id===id);
  if(!a) return "";
  const sc = (k,v) => `
    <div class="row" style="gap:8px">
      <span style="width:76px" class="dim t-subtle">${k}</span>
      <span class="row" style="gap:3px">${[1,2,3,4,5].map(n=>`
        <span style="width:14px;height:14px;border-radius:var(--r-sm);
          background:${n<=v?(v<=2?"var(--status-critical)":v===3?"var(--status-elevated)":"var(--primary)"):"var(--muted)"}"></span>`).join("")}</span>
      <span class="t-subtle" style="font-weight:700">${v} of 5</span>
    </div>`;
  return `
  <div class="scrim" onclick="closeAlert()"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Alert ${a.id}">

      <div>
        ${statusBadge(a.status)}
        <h2 class="t-h4 mt8">${esc(a.reason)}</h2>

        <dt>Unit / crew</dt><dd><span class="mono">${a.unit}</span> — ${esc(a.crew)}</dd>

        <dt>Area</dt><dd>${esc(a.zone)}</dd>
        <dt>Age band</dt><dd>${a.band}</dd>
        <dt>Language</dt><dd>${a.lang}</dd>
        <dt>Assigned</dt><dd>${esc(a.assigned)}</dd>
      </dl>
      ${a.lang!=="English"?`<div class="stale mt16" style="margin-bottom:0">
        ${I.users(16)} Patient prefers ${a.lang}. Use the interpreter line for the callback.</div>`:""}

      ${a.status!=="resolved"?`
      <div class="mt24">
        <label class="t-subtle" style="font-weight:700;display:block;margin-bottom:8px" for="note-${a.id}">

          <button class="btn btn-ghost" onclick="claim('${a.id}')"
            ${a.assigned!=="Unassigned"?"disabled":""}>${I.userPlus(16)} Assign to me</button>
        </div>
      </div>`:`
      <div class="stale mt24" style="background:var(--status-resolved-wash);color:var(--status-resolved);
           border-color:currentColor;margin-bottom:0">
        ${I.checkCircle(16)} Followed up by ${esc(a.assigned)}.
      </div>`}

      <div class="log">
        <h3 class="t-subtle" style="font-weight:700;margin-bottom:4px">Activity</h3>
        ${a.log.length?`<ul>${a.log.map(l=>`<li>
            <div style="font-weight:700">${esc(l.who)} <span class="dim" style="font-weight:400">· ${ago(l.at)}</span></div>
            <div class="dim">${esc(l.text)}</div></li>`).join("")}</ul>`
          :`<p class="t-subtle dim">Nothing logged yet.</p>`}
      </div>
    </div>
  </aside>`;
}
</script>
<script>
/* ============================================================
   6. SURVEY BUILDER
   ============================================================ */
const TYPE_LABEL = { yesno:"Yes / no", scale:"Rating 1–5", choice:"Multiple choice", text:"Written answer" };

function surveyIdFromHash(){
  const m = (location.hash||"").match(/^#\/surveys\/([^/]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}
function currentSurvey(){ return state.surveys.find(s=>s.id===surveyIdFromHash())||null; }
function qList(){
  const patient = location.hash.startsWith("#/s/") && !location.hash.startsWith("#/surveys");
  const id = patient ? "sv_post" : (surveyIdFromHash() || "sv_post");
  if(!state.surveyQuestions[id]) state.surveyQuestions[id] = [];
  return state.surveyQuestions[id];
}
function syncQuestionCount(id){
  const s = state.surveys.find(x=>x.id===id);
  if(s) s.questions = (state.surveyQuestions[id]||[]).length;
}
function previewQIndex(){
  const qs = qList();
  if(!qs.length) return -1;
  const i = qs.findIndex(q=>q.id===state.previewQId);
  return i>=0 ? i : 0;
}
function selectPreviewQ(id){
  if(state.previewQId===id) return;
  state.previewQId = id;
  render();
}
function previewQKey(e,id){
  if(e.target!==e.currentTarget) return;
  if(e.key!=="Enter" && e.key!==" ") return;
  e.preventDefault();
  selectPreviewQ(id);
}

function surveyStatusBadge(s){
  return `<span class="badge ${s.status==="Live"?"badge-resolved":"badge-secondary"}">${
    s.status==="Live"?I.checkCircle(12):I.pencil(12)}${s.status}</span>`;
}
function responseCountLink(s){
  if(s.status!=="Live") return `<span class="dim">—</span>`;
  const n = s.responses;
  const label = n===1 ? "1 response" : n+" responses";
  return `<a class="num-link" href="#/surveys/${s.id}/responses" aria-label="${label}">${n}</a>`;
}
function responsesFor(id){ return state.responses[id] || []; }
function isResponsesRoute(h){ return /^#\/surveys\/[^/]+\/responses/.test(h || location.hash || ""); }

function viewSurveysIndex(){
  const live = state.surveys.filter(s=>s.status==="Live").length;
  const drafts = state.surveys.filter(s=>s.status==="Draft").length;
  return `
  <div class="page-head">
    <div class="crumbs"><a href="#/">Reflect</a><span class="sep">/</span><span>Surveys</span></div>
    <div class="between">
      <div>
        <h1 class="t-h2">Surveys</h1>
        <p class="t-p dim">${live} live · ${drafts} draft</p>
      </div>
      <button class="btn btn-primary" onclick="newSurvey()">${I.plus(16)} New survey</button>
    </div>
  </div>
  ${state.surveys.length?`<div class="card" style="padding:0">
    <table class="tbl">
      <thead><tr>
        <th class="fav"><span class="sr">Favorite</span></th>
        <th>Survey</th><th>Status</th><th>Responses</th><th>Rate</th><th>Updated</th>
        <th class="morecol"><span class="sr">Actions</span></th>
      </tr></thead>
      <tbody>
        ${state.surveys.map(s=>`
          <tr class="clickable" onclick="go('#/surveys/${s.id}')">
            <td class="fav" onclick="event.stopPropagation()">
              <button class="iconbtn star-btn" aria-pressed="${!!s.starred}"
                aria-label="${s.starred?"Remove from favorites":"Add to favorites"}"
                onclick="toggleStar('${s.id}')">${s.starred?I.starFill(18):I.star(18)}</button>
            </td>
            <td style="font-weight:700">${esc(s.name)}<div class="t-subtle dim">${s.questions} questions</div></td>
            <td>${surveyStatusBadge(s)}</td>
            <td onclick="event.stopPropagation()">${responseCountLink(s)}</td>
            <td>${s.rate?s.rate+"%":"—"}</td>
            <td class="dim">${ago(s.updated)}</td>
            <td class="morecol">${surveyRowMenu(s)}</td>
          </tr>`).join("")}
      </tbody>
    </table>
  </div>`:`
    <div class="card empty">
      <div class="dim" style="display:flex;justify-content:center;margin-bottom:12px">${I.inbox(32)}</div>
      <div class="t">No surveys yet.</div>
      <div class="s t-p">Create one to start collecting feedback.</div>
    </div>`}`;
}

function viewSurveys(){
  const s = currentSurvey();
  if(!s) return viewSurveysIndex();
  const qs = qList();
  const locked = qs.filter(q=>q.locked).length;
  const previewIdx = previewQIndex();
  const meta = s.status==="Live"
    ? `${qs.length} questions · live · ${s.responses} responses so far`
    : `${qs.length} questions · draft · not sent yet`;
  return `
  <div class="page-head">
    <div class="crumbs"><a href="#/">Reflect</a><span class="sep">/</span><a href="#/surveys">Surveys</a>
      <span class="sep">/</span><span>${esc(s.name)}</span></div>
    <div class="between">
      <div>
        <h1 class="t-h2">${esc(s.name)}</h1>
        <p class="t-p dim">${meta}</p>
      </div>
      <div class="row" style="gap:8px">
        ${s.status==="Live"?`<a class="btn btn-outline" href="#/surveys/${s.id}/responses">${I.inbox(16)} Responses</a>`:""}
        <button class="btn btn-outline" onclick="openSurveyPreview()">
          ${I.eye(16)} Preview</button>
        <button class="btn btn-primary" onclick="toast('${s.status==="Live"?"Published. New invitations use this version.":"Published. This survey is now live."}')">${s.status==="Live"?"Publish changes":"Publish"}</button>
      </div>
    </div>
  </div>
  <div class="split">
    <div>
      <div class="card">
        <div class="between" style="margin-bottom:16px">
          <div>
            <h2 class="t-h4">Questions</h2>
            <p class="t-subtle dim mt8">Drag to reorder. Benchmark questions can't be edited.</p>
          </div>
          <span class="badge badge-outline">${qs.filter(q=>q.required).length} required</span>
        </div>
        ${qs.length?qs.map((q,i)=>`
          <div class="qcard qcard-select ${q.locked?"locked":""} ${i===previewIdx?"selected":""}"
            tabindex="0" aria-current="${i===previewIdx?"true":"false"}"
            onclick="selectPreviewQ('${q.id}')" onkeydown="previewQKey(event,'${q.id}')">
            <span class="grip" aria-hidden="true">${q.locked?I.lock(16):I.grip(16)}</span>
            <div style="flex:1;min-width:0">
              <div class="t-pui" style="font-weight:700">${esc(q.text)}</div>
              <div class="qmeta">
                <span class="badge badge-secondary">${TYPE_LABEL[q.type]}</span>
                ${q.required?`<span class="badge badge-outline">Required</span>`:`<span class="t-detail dim">Optional</span>`}
                ${q.locked?`<span class="badge badge-elevated">${I.lock(12)}Benchmark</span>`:""}
              </div>
              ${q.locked?`<p class="t-subtle dim mt8">${esc(q.lockNote)}</p>`:""}
              ${q.help?`<p class="t-subtle dim mt8">${esc(q.help)}</p>`:""}
            </div>
            <div class="qbtns" onclick="event.stopPropagation()">
              <button class="iconbtn" aria-label="Move up"   ${i===0?"disabled":""} onclick="moveQ(${i},-1)">${I.up(16)}</button>
              <button class="iconbtn" aria-label="Move down" ${i===qs.length-1?"disabled":""} onclick="moveQ(${i},1)">${I.down(16)}</button>
              <button class="iconbtn" aria-label="Edit"   ${q.locked?"disabled":""}
                onclick="${q.locked?"":`selectPreviewQ('${q.id}');toast('Editing isn\\'t wired up in this prototype')`}">${I.pencil(16)}</button>
              <button class="iconbtn" aria-label="Remove" ${q.locked?"disabled":""} onclick="removeQ('${q.id}')">${I.trash(16)}</button>
            </div>
          </div>`).join("") : `<p class="t-subtle dim" style="margin-bottom:16px">No questions yet. Add one, or pick from the library.</p>`}
        <div class="addrow">
          <button class="btn btn-outline btn-sm" onclick="addQ('yesno')">${I.plus(16)} Yes / no</button>
          <button class="btn btn-outline btn-sm" onclick="addQ('scale')">${I.plus(16)} Rating</button>
          <button class="btn btn-outline btn-sm" onclick="addQ('choice')">${I.plus(16)} Multiple choice</button>
          <button class="btn btn-outline btn-sm" onclick="addQ('text')">${I.plus(16)} Written answer</button>
        </div>
      </div>

      <div class="card sec">
        <h2 class="t-h4">Question library</h2>
        <p class="t-subtle dim mt8">Wording other agencies have already tested.</p>
        <div class="mt16">
          ${LIBRARY.map((l,i)=>`
            <div class="qcard">
              <div style="flex:1">
                <div class="t-pui">${esc(l.text)}</div>
                <div class="qmeta"><span class="badge badge-secondary">${TYPE_LABEL[l.type]}</span></div>
              </div>
              <button class="btn btn-secondary btn-sm" onclick="addFromLib(${i})">Add</button>
            </div>`).join("")}
        </div>
      </div>

      <div class="card sec" style="background:var(--muted)">
        <div class="row" style="align-items:flex-start;gap:12px">
          <span class="dim" style="padding-top:2px">${I.shield(18)}</span>
          <div>
            <h2 class="t-h4">Benchmarking</h2>
            <p class="t-body dim mt8">${locked
              ? `${locked===1?"One question":"Two questions"} in this survey use shared wording so results can be compared
              across participating agencies. You keep your own questions alongside them. Leaving the benchmark
              means ${locked===1?"that question becomes":"those questions become"} editable and your agency drops out of comparison.`
              : "This survey isn't in the benchmark. Add the shared questions if you want results compared across agencies."}</p>
            <button class="btn btn-outline btn-sm mt16" onclick="toast('Benchmark settings aren\'t wired up in this prototype')">
              Benchmark settings</button>
          </div>
        </div>
      </div>

      <div class="card sec" style="border-color:color-mix(in srgb,var(--destructive) 35%,var(--border))">
        <h2 class="t-h4">Delete this survey</h2>
        <p class="t-subtle dim mt8">${s.status==="Live" && s.responses
          ? `This survey is live with ${s.responses} response${s.responses===1?"":"s"}. Deleting it stops invitations and removes those responses from Reflect.`
          : s.status==="Live"
          ? "This survey is live. Deleting it stops invitations and removes it from Reflect."
          : "This draft hasn't been sent yet. Deleting it removes the survey and its questions."} This can't be undone.</p>
        <button class="btn btn-ghost-destructive btn-sm mt16" onclick="askDeleteSurvey('${s.id}')">
          ${I.trash(16)} Delete survey</button>
      </div>
    </div>

    <div class="preview-col">
      <div class="preview-sticky">
        <div class="phone-frame">
          <div class="cap">${I.radio(16)} ${previewIdx>=0
            ? `Question ${previewIdx+1} of ${qs.length} — what the patient sees`
            : "Live preview — what the patient sees"}</div>
          <div style="max-height:640px;overflow-y:auto">${patientPreview()}</div>
        </div>
        <p class="t-subtle dim mt16">Preview reflects unsaved changes. Publish to send this version.</p>
      </div>
    </div>
  </div>`;
}

function responseSummary(r, qs){
  const texts = qs.filter(q=>q.type==="text").map(q=>r.answers[q.id]).filter(v=>v);
  if(texts.length) return texts[0];
  const first = qs.find(q=>r.answers[q.id]);
  return first ? r.answers[first.id] : "No answers";
}

function viewSurveyResponses(){
  const s = currentSurvey();
  if(!s) return viewSurveysIndex();
  const qs = qList();
  const rows = responsesFor(s.id).slice().sort((a,b)=>b.at-a.at);
  const shown = rows.length;
  const total = s.responses;
  return `
  <div class="page-head">
    <div class="crumbs"><a href="#/">Reflect</a><span class="sep">/</span><a href="#/surveys">Surveys</a>
      <span class="sep">/</span><a href="#/surveys/${s.id}">${esc(s.name)}</a>
      <span class="sep">/</span><span>Responses</span></div>
    <div class="between">
      <div>
        <h1 class="t-h2">Responses</h1>
        <p class="t-p dim">${total
          ? (shown<total
            ? `Showing ${shown} most recent of ${total}`
            : `${total} collected`)
          : "None collected yet"} · ${esc(s.name)}</p>
      </div>
      <a class="btn btn-outline" href="#/surveys/${s.id}">${I.pencil(16)} Edit survey</a>
    </div>
  </div>
  ${rows.length?`<div class="card" style="padding:0">
    <table class="tbl">
      <thead><tr><th>When</th><th>What they said</th><th>Area</th><th>Language</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr class="clickable" onclick="openResponse('${s.id}','${r.id}')">
            <td class="dim" style="white-space:nowrap">${ago(r.at)}</td>
            <td>
              <div class="snip">${esc(responseSummary(r, qs))}</div>
              ${r.alert?`<div class="mt8">${statusBadge(state.alerts.find(a=>a.id===r.alert)?.status || "elevated")}
                <span class="t-detail dim">Alert ${r.alert}</span></div>`:""}
            </td>
            <td>${esc(r.zone||"—")}<div class="t-detail dim">${esc(r.band||"")}</div></td>
            <td class="dim">${esc(r.lang||"—")}</td>
            <td class="mono dim">${r.id}</td>
          </tr>`).join("")}
      </tbody>
    </table>
  </div>`:`
    <div class="card empty">
      <div class="dim" style="display:flex;justify-content:center;margin-bottom:12px">${I.inbox(32)}</div>
      <div class="t">No responses yet.</div>
      <div class="s t-p">${s.status==="Draft"
        ? "This draft hasn't been sent, so nothing has come in."
        : "Invitations are out. New answers will show up here."}</div>
    </div>`}`;
}

function responseDrawer(ref){
  const s = state.surveys.find(x=>x.id===ref.surveyId);
  const r = responsesFor(ref.surveyId).find(x=>x.id===ref.id);
  if(!s || !r) return "";
  const qs = state.surveyQuestions[ref.surveyId] || [];
  const alert = r.alert && state.alerts.find(a=>a.id===r.alert);
  return `
  <div class="scrim" onclick="closeResponse()"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Response ${r.id}">
    <div class="drawer-head">
      <div>
        ${alert?statusBadge(alert.status):`<span class="badge badge-outline">Response</span>`}
        <h2 class="t-h4 mt8">${esc(s.name)}</h2>
        <p class="t-subtle dim">Response <span class="mono">${r.id}</span> · ${ago(r.at)} · ${esc(r.zone||"")} · ${esc(r.band||"")}</p>
      </div>
      <button class="iconbtn" onclick="closeResponse()" aria-label="Close">${I.x(18)}</button>
    </div>
    <div class="drawer-body">
      ${alert?`<div class="stale" style="margin-bottom:16px">
        ${I.flag(16)} Flagged as ${alert.status==="resolved"?"followed up":alert.status}.
        <button class="btn btn-ghost btn-sm" style="margin-left:8px" onclick="openAlertFromResponse('${alert.id}')">Open alert</button>
      </div>`:""}
      <dl class="kv">
        <dt>Language</dt><dd>${esc(r.lang||"—")}</dd>
        <dt>Area</dt><dd>${esc(r.zone||"—")}</dd>
        <dt>Age band</dt><dd>${esc(r.band||"—")}</dd>
      </dl>
      <div class="mt24">
        ${qs.map(q=>{
          const v = r.answers[q.id];
          const empty = v===undefined || v==="";
          return `<div class="ans">
            <div class="t-subtle dim">${esc(q.text)}</div>
            <div class="t-pui" style="font-weight:700;margin-top:4px">${empty?`<span class="dim">Skipped</span>`:esc(String(v))}</div>
          </div>`;
        }).join("")}
      </div>
    </div>
  </aside>`;
}
function openResponse(surveyId, id){
  state.openResponse = { surveyId, id };
  render();
}
function closeResponse(){ state.openResponse = null; render(); }
function openAlertFromResponse(id){
  state.openResponse = null;
  state.openAlert = id;
  render();
}

/* ============================================================
   7. LEADERSHIP INSIGHTS
   ============================================================ */
function viewInsights(){
  const worst = EQUITY.reduce((a,b)=>a.score<b.score?a:b);
  return `
  <div class="page-head">
    <div class="crumbs"><a href="#/">Reflect</a><span class="sep">/</span><span>Insights</span></div>
    <h1 class="t-h2">Insights</h1>
    <p class="t-p dim">84 responses, ${day(mins(43200))} to today. Agency average is 4.2 of 5.</p>
  </div>

  <div class="card" style="border-left:3px solid var(--status-elevated)">
    <div class="row" style="align-items:flex-start;gap:12px">
      <span style="color:var(--status-elevated);padding-top:2px">${I.flag(20)}</span>
      <div>
        <h2 class="t-h4">${esc(worst.label)} rate their experience
          ${(worst.base-worst.score).toFixed(1)} points below the agency average</h2>
        <p class="t-body dim mt8">${worst.n} responses. The gap is widest on the listening question.
          This is a signal to look into, not a conclusion — sample sizes this small move easily.</p>
      </div>
    </div>
  </div>

  <div class="grid g-2 sec" style="align-items:start">
    <section class="card">
      <h2 class="t-h4">By demographic</h2>
      <p class="t-subtle dim mt8">Average score. Optional questions, so not every respondent is counted.</p>
      <div class="bars">
        ${EQUITY.map((e,i)=>{
          const gap = e.base - e.score;
          return `<div class="bar-row">
            <span>${esc(e.label)} <span class="dim">(${e.n})</span></span>
            <span class="bar"><i style="width:${(e.score/5*100).toFixed(0)}%;animation-delay:${i*50}ms;
              background:${gap>=.4?"var(--status-elevated)":"var(--primary)"}"></i></span>
            <span style="text-align:right" class="${gap>=.4?"gap-flag":""}">${e.score.toFixed(1)}</span>
          </div>`;}).join("")}
      </div>
      <p class="t-detail dim mt16">Groups with fewer than 10 responses are hidden to protect anonymity.</p>
    </section>

    <section class="card">
      <h2 class="t-h4">By area</h2>
      <p class="t-subtle dim mt8">Average score by response zone.</p>
      <div class="bars">
        ${ZONES.map((z,i)=>`<div class="bar-row">
          <span>${esc(z.label)} <span class="dim">(${z.n})</span></span>
          <span class="bar"><i style="width:${(z.score/5*100).toFixed(0)}%;animation-delay:${i*50}ms;
            background:${z.score<4?"var(--status-elevated)":"var(--primary)"}"></i></span>
          <span style="text-align:right" class="${z.score<4?"gap-flag":""}">${z.score.toFixed(1)}</span>
        </div>`).join("")}
      </div>
      <div class="mt24">
        <h3 class="t-subtle" style="font-weight:700">Alerts by unit</h3>
        <table class="tbl mt8">
          <thead><tr><th>Unit</th><th>Open</th><th>Followed up</th></tr></thead>
          <tbody>
            ${["M-12","E-7","M-3","M-8","E-2"].map(u=>{
              const o = state.alerts.filter(a=>a.unit===u&&a.status!=="resolved").length;
              const r = state.alerts.filter(a=>a.unit===u&&a.status==="resolved").length;
              return `<tr><td><span class="mono">${u}</span></td>
                <td>${o?`<span style="color:var(--status-elevated);font-weight:700">${o}</span>`:`<span class="dim">0</span>`}</td>
                <td class="dim">${r}</td></tr>`;}).join("")}
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <section class="card sec">
    <h2 class="t-h4">What people wrote</h2>
    <p class="t-subtle dim mt8">Unedited. Written answers go to supervisors, not crews.</p>
    <div class="mt16" style="display:flex;flex-direction:column;gap:12px">
      ${state.alerts.slice(0,5).map(a=>`
        <div style="border-left:3px solid ${STATUS[a.status].color};padding-left:16px">
          <p class="t-p">${esc(a.quote)}</p>
          <p class="t-detail dim">${a.band} · ${esc(a.zone)} · ${esc(a.call)} · ${ago(a.at)}</p>
        </div>`).join("")}
    </div>
  </section>`;
}

/* ============================================================
   8. PATIENT SURVEY
   ============================================================ */
function patientPreview(){
  const qs = qList();
  const idx = previewQIndex();
  const q = idx>=0 ? qs[idx] : null;
  if(!q){
    return `<div class="patient" style="min-height:0;padding:20px 16px 28px">
      <div class="p-wrap">
        <div class="p-card" style="padding:24px 20px;box-shadow:none">
          <p class="p-help">Add a question to see the patient preview.</p>
        </div>
      </div>
    </div>`;
  }
  return `<div class="patient" style="min-height:0;padding:20px 16px 28px">
    <div class="p-wrap">
      <div class="p-card" style="padding:24px 20px;box-shadow:none">
        <div class="p-progress">${qs.map((_,i)=>`<i class="${i<idx?"done":i===idx?"now":""}"></i>`).join("")}</div>
        <div class="p-step">Question ${idx+1} of ${qs.length}${q.required?"":" · optional"}</div>
        <h1 class="p-q mt8" style="font-size:21px;line-height:28px">${esc(q.text)}</h1>
        ${q.type==="yesno"?`<div class="p-opts">
          ${["Yes","No"].map(o=>`<div class="p-opt" style="min-height:48px;font-size:16px">
            <span class="p-tick"></span>${o}</div>`).join("")}</div>`:""}
        ${q.type==="scale"?`<div class="p-scale">${[1,2,3,4,5].map(n=>`
          <div style="flex:1;min-height:52px;border:1px solid var(--p-rule);border-radius:12px;background:var(--p-face);
            display:grid;place-items:center;font-weight:700">${n}</div>`).join("")}</div>`:""}
        ${q.type==="text"?`<div class="p-text" style="min-height:90px;color:var(--p-placeholder);font-size:16px">Type your answer…</div>`:""}
        ${q.type==="choice"?`<div class="p-opts">${(q.options||[]).map(o=>`
          <div class="p-opt" style="min-height:48px;font-size:16px"><span class="p-tick"></span>${esc(o)}</div>`).join("")}</div>`:""}
      </div>
    </div>
  </div>`;
}

function viewPatient(){
  const S = state.survey, qs = qList();
  const total = qs.length;

  /* intro */
  if(S.step === -1 || S.step === undefined) S.step = -1;
  if(S.step === -1){
    return `<div class="patient"><div class="p-wrap">
      <div class="p-lock">${I.lock(12)} Private — only ${AGENCY.name} sees this</div>
      <div class="p-card">
        <div class="p-view">
        <h1 class="p-display">A few questions about your ride with ${AGENCY.name}.</h1>
        <p class="p-lede">${total} questions, about a minute. Skip anything you'd rather not answer,
          and stop whenever you want.</p>
        <div class="p-note">
          Your answers go to a supervisor, not to the crew who treated you.
          Nothing here changes your bill or your care.
        </div>
        <div class="p-actions">
          <button class="p-next" onclick="pStart()">Start</button>
        </div>
        </div>
      </div>
      <p class="p-foot">Reflect · ${AGENCY.name} · reference ${"9F3C1A"}</p>
    </div></div>`;
  }

  /* demographics */
  if(S.step === total){
    return `<div class="patient"><div class="p-wrap">
      <div class="p-lock">${I.lock(12)} Private — only ${AGENCY.name} sees this</div>
      <div class="p-card">
        <div class="p-view">
        <div class="p-progress">${qs.map(()=>`<i class="done"></i>`).join("")}</div>
        <div class="row" style="gap:8px;margin-bottom:8px">
          <span class="p-optional">Optional</span>
        </div>
        <h1 class="p-q">Three questions about you — only if you want.</h1>
        <p class="p-help">We ask so we can check whether some people get a worse experience than others.
          You can send your answers without filling any of this in.</p>

        <fieldset class="p-fieldset">
          <legend>Your age</legend>
          <select class="p-select" onchange="pDemo('age',this.value)">
            <option value="">Prefer not to say</option>
            ${["18–24","25–34","35–44","45–54","55–64","65–74","75 or older"].map(o=>
              `<option ${S.demo.age===o?"selected":""}>${o}</option>`).join("")}
          </select>
        </fieldset>
        <fieldset class="p-fieldset">
          <legend>The language you're most comfortable in</legend>
          <select class="p-select" onchange="pDemo('lang',this.value)">
            <option value="">Prefer not to say</option>
            ${["English","Spanish","Vietnamese","Tagalog","Arabic","Another language"].map(o=>
              `<option ${S.demo.lang===o?"selected":""}>${o}</option>`).join("")}
          </select>
        </fieldset>
        <fieldset class="p-fieldset">
          <legend>How you describe your race or ethnicity</legend>
          <select class="p-select" onchange="pDemo('eth',this.value)">
            <option value="">Prefer not to say</option>
            ${["American Indian or Alaska Native","Asian","Black or African American",
               "Hispanic or Latino","Middle Eastern or North African",
               "Native Hawaiian or Pacific Islander","White","More than one"].map(o=>
              `<option ${S.demo.eth===o?"selected":""}>${o}</option>`).join("")}
          </select>
        </fieldset>

        <div class="p-actions">
          <button class="p-next" onclick="pFinish()">Send my answers</button>
        </div>
        <button class="p-back" onclick="pBack()">Back</button>
        </div>
      </div>
      <p class="p-foot">Reflect · ${AGENCY.name}</p>
    </div></div>`;
  }

  /* done */
  if(S.step === total+1){
    const low = Object.entries(S.answers).some(([k,v])=>{
      if(k==="q1") return v==="Poor" || v==="Unacceptable";
      if(k==="q2") return v==="Not Likely" || v==="Definitely Not Likely";
      if(k==="q3" || k==="q4") return v==="No";
      return false;
    });
    return `<div class="patient"><div class="p-wrap p-done">
      <div class="p-card" style="text-align:center">
        <div class="p-view">
        <div class="p-seal" style="color:var(--p-amber-deep)">${I.check(26)}</div>
        <h1 class="p-display">Thank you — that's genuinely useful.</h1>
        <p class="p-lede">Someone at ${AGENCY.name} will read this. You don't need to do anything else.</p>
        ${low?`<div class="p-note" style="text-align:left">
          You told us something went wrong. A supervisor will see this today and may call you
          if you left a number. We can't promise a particular outcome, but this doesn't disappear
          into a spreadsheet — a person reads it.
        </div>`:`<div class="p-note" style="text-align:left">
          If you think of something later, the link in your message stays open for 14 days.
        </div>`}
        </div>
      </div>
      <p class="p-foot">You can close this page.</p>
    </div></div>`;
  }

  /* questions */
  const q = qs[S.step];
  const val = S.answers[q.id];
  const answered = val !== undefined && val !== "";
  const body =
    q.type==="yesno" ? `<div class="p-opts">
        ${["Yes","No"].map(o=>`<button class="p-opt" aria-pressed="${val===o}" onclick="pAnswer('${q.id}','${o}',this)">
          <span class="p-tick">${I.check(13)}</span>${o}</button>`).join("")}</div>`
    : q.type==="choice" ? `<div class="p-opts">
        ${(q.options||[]).map(o=>`<button class="p-opt" aria-pressed="${val===o}"
          onclick="pAnswer('${q.id}',${esc(JSON.stringify(o))},this)">
          <span class="p-tick">${I.check(13)}</span>${esc(o)}</button>`).join("")}</div>`
    : q.type==="scale" ? `<div class="p-scale" role="group" aria-label="${esc(q.text)}">
        ${[1,2,3,4,5].map(n=>`<button aria-pressed="${Number(val)===n}" onclick="pAnswer('${q.id}',${n},this)">
          ${n}<span>${(q.labels&&q.labels[n-1])||""}</span></button>`).join("")}</div>`
    : `<textarea class="p-text" id="ptext" maxlength="600"
         placeholder="Whatever you want to say. It's read by a person."
         oninput="pText('${q.id}',this.value)">${val?esc(val):""}</textarea>
       <div class="p-count">${(val||"").length} of 600</div>`;

  return `<div class="patient"><div class="p-wrap">
    <div class="p-lock">${I.lock(12)} Private — only ${AGENCY.name} sees this</div>
    <div class="p-card">
      <div class="p-view">
      <div class="p-progress">
        ${qs.map((_,i)=>`<i class="${i<S.step?"done":i===S.step?"now":""}"></i>`).join("")}
      </div>
      <div class="p-step">Question ${S.step+1} of ${total}${q.required?"":" · optional"}</div>
      <h1 class="p-q mt8">${esc(q.text)}</h1>
      ${q.help?`<p class="p-help">${esc(q.help)}</p>`:""}
      ${body}
      <div class="p-actions">
        <button class="p-next" ${q.required&&!answered?"disabled":""} onclick="pNext()">
          ${S.step===total-1?"Almost done":"Next"}</button>
        ${q.required?"":`<button class="p-skip" onclick="pSkip()">Skip</button>`}
      </div>
      ${q.required&&!answered?`<p class="p-help" data-need-answer style="margin-top:12px">Pick an answer to keep going,
        or close the page if you'd rather not.</p>`:""}
      ${S.step>0?`<button class="p-back" onclick="pBack()">Back</button>`:""}
      </div>
    </div>
    <p class="p-foot">Reflect · ${AGENCY.name}</p>
  </div></div>`;
}
</script>
<script>
/* ============================================================
   9. ACTIONS
   ============================================================ */
function go(h){ location.hash = h; }
function setRole(r){ state.role = r; render(); }
function toggleTheme(){
  state.theme = state.theme==="light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", state.theme);
  render();
}
let toastTimer;
function toast(msg){
  state.toast = msg; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ state.toast=null; render(); }, 2600);
}

function openAlert(id){ state.openAlert = id; render(); }
function closeAlert(){ state.openAlert = null; render(); }

function noteFor(id){
  const el = document.getElementById("note-"+id);
  return el ? el.value.trim() : "";
}
function logOnly(id){
  const a = state.alerts.find(x=>x.id===id);
  const t = noteFor(id);
  if(!t){ toast("Add a note first, then log it."); return; }
  a.log.unshift({ who:"You", at:NOW, text:t });
  render(); toast("Logged.");
}
function logAndResolve(id){
  const a = state.alerts.find(x=>x.id===id);
  const t = noteFor(id);
  if(!t){ toast("Add a note before closing this out."); return; }
  a.log.unshift({ who:"You", at:NOW, text:t });
  a.status = "resolved";
  if(a.assigned==="Unassigned") a.assigned = "You";
  state.openAlert = null;
  const row = document.getElementById("row-"+id);
  if(row && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    row.classList.add("resolving");
    setTimeout(()=>{ render(); toast("Marked followed up."); }, 240);
  } else { render(); toast("Marked followed up."); }
}
function claim(id){
  const a = state.alerts.find(x=>x.id===id);
  a.assigned = "You"; render(); toast("Assigned to you.");
}

function moveQ(i,d){
  const q = qList(), j = i+d;
  if(j<0||j>=q.length) return;
  [q[i],q[j]] = [q[j],q[i]];
  state.previewQId = q[j].id;
  render();
}
function removeQ(id){
  const sid = surveyIdFromHash() || "sv_post";
  const qs = qList();
  const i = qs.findIndex(q=>q.id===id);
  state.surveyQuestions[sid] = qs.filter(q=>q.id!==id);
  syncQuestionCount(sid);
  if(state.previewQId===id){
    const next = qs[i+1] || qs[i-1];
    state.previewQId = next ? next.id : null;
  }
  render(); toast("Question removed.");
}
let qn = 100;
function addQ(type){
  const id = "q"+(++qn);
  qList().push({
    id, type, required:false, locked:false,
    text:"New question — click the pencil to write it",
    options: type==="choice" ? ["Option one","Option two"] : undefined,
    labels:  type==="scale"  ? ["Poor","","","","Excellent"] : undefined
  });
  state.previewQId = id;
  syncQuestionCount(surveyIdFromHash() || "sv_post");
  render(); toast("Question added.");
}
function addFromLib(i){
  const l = LIBRARY[i];
  const id = "q"+(++qn);
  qList().push({ id, text:l.text, type:l.type, required:false, locked:false,
    labels: l.type==="scale" ? ["Poor","","","","Excellent"] : undefined });
  state.previewQId = id;
  syncQuestionCount(surveyIdFromHash() || "sv_post");
  render(); toast("Added from library.");
}

let sn = 100;
function newSurvey(){
  const id = "sv_"+ (++sn);
  state.surveys.unshift({ id, name:"Untitled survey", status:"Draft", questions:0, responses:0, rate:0, sent:0, starred:false, updated:NOW });
  state.surveyQuestions[id] = [];
  state.responses[id] = [];
  go("#/surveys/"+id);
  toast("Draft created.");
}
function duplicateSurvey(id){
  const s = state.surveys.find(x=>x.id===id);
  if(!s) return;
  const nid = "sv_"+ (++sn);
  const copy = (state.surveyQuestions[id]||[]).map(q=>({
    ...q, id:"q"+(++qn),
    options: q.options ? [...q.options] : undefined,
    labels: q.labels ? [...q.labels] : undefined
  }));
  state.surveys.unshift({ ...s, id:nid, name:s.name+" (copy)", status:"Draft", responses:0, rate:0, sent:0, starred:false, updated:NOW, questions:copy.length });
  state.surveyQuestions[nid] = copy;
  state.responses[nid] = [];
  state.surveyMenu = null;
  go("#/surveys/"+nid);
  toast("Duplicated as a draft.");
}

function surveyRowMenu(s){
  const open = state.surveyMenu===s.id;
  return `<div class="menu-wrap${open?" open":""}" onclick="event.stopPropagation()">
    <button class="iconbtn" aria-label="More actions" aria-haspopup="menu" aria-expanded="${open}"
      onclick="toggleSurveyMenu('${s.id}')">${I.more(18)}</button>
    ${open?`<div class="menu" role="menu">
      <button type="button" role="menuitem" onclick="toggleStar('${s.id}')">${I.star(16)} ${s.starred?"Unstar":"Star"}</button>
      <div class="menu-sep"></div>
      <button type="button" role="menuitem" onclick="askRenameSurvey('${s.id}')">${I.pencil(16)} Rename</button>
      ${s.status==="Live"?`<button type="button" role="menuitem" onclick="go('#/surveys/${s.id}/responses')">${I.inbox(16)} View responses</button>`:""}
      <button type="button" role="menuitem" onclick="duplicateSurvey('${s.id}')">${I.copy(16)} Duplicate</button>
      <button type="button" role="menuitem" class="danger" onclick="askDeleteSurvey('${s.id}')">${I.trash(16)} Delete</button>
    </div>`:""}
  </div>`;
}
function toggleSurveyMenu(id){
  state.surveyMenu = state.surveyMenu===id ? null : id;
  render();
}
function closeSurveyMenu(){ state.surveyMenu = null; render(); }
function toggleStar(id){
  const s = state.surveys.find(x=>x.id===id);
  if(!s) return;
  s.starred = !s.starred;
  state.surveyMenu = null;
  render();
}

function renameDialog(id){
  const s = state.surveys.find(x=>x.id===id);
  if(!s) return "";
  return `
  <div class="scrim" style="z-index:54"></div>
  <div class="dialog-wrap" onclick="closeRenameSurvey()">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ren-title"
      onclick="event.stopPropagation()">
      <h2 class="t-h4" id="ren-title">Rename survey</h2>
      <label class="t-subtle" style="font-weight:700;display:block;margin:16px 0 8px" for="rename-input">Name</label>
      <input class="input" id="rename-input" value="${esc(s.name)}"
        onkeydown="if(event.key==='Enter'){event.preventDefault();confirmRenameSurvey()}">
      <div class="dialog-actions">
        <button class="btn btn-outline" onclick="closeRenameSurvey()">Cancel</button>
        <button class="btn btn-primary" onclick="confirmRenameSurvey()">Save name</button>
      </div>
    </div>
  </div>`;
}
function askRenameSurvey(id){
  if(!state.surveys.find(x=>x.id===id)) return;
  state.surveyMenu = null;
  state.renameSurvey = id;
  render();
  const input = document.getElementById("rename-input");
  if(input){ input.focus(); input.select(); }
}
function closeRenameSurvey(){ state.renameSurvey = null; render(); }
function confirmRenameSurvey(){
  const id = state.renameSurvey;
  const input = document.getElementById("rename-input");
  const name = input && input.value.trim();
  if(!id) return;
  if(!name){ toast("Give the survey a name."); return; }
  const s = state.surveys.find(x=>x.id===id);
  if(s){ s.name = name; s.updated = NOW; }
  state.renameSurvey = null;
  render();
  toast("Renamed.");
}

function deleteConfirm(id){
  const s = state.surveys.find(x=>x.id===id);
  if(!s) return "";
  const live = s.status==="Live";
  const consequence = live && s.responses
    ? `Stops invitations and permanently removes ${s.responses} response${s.responses===1?"":"s"} collected so far.`
    : live
    ? "Stops invitations and removes this survey from Reflect."
    : "Removes this draft and its questions. It hasn't been sent yet.";
  return `
  <div class="scrim" style="z-index:54"></div>
  <div class="dialog-wrap" onclick="closeDeleteSurvey()">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="del-title" aria-describedby="del-desc"
      onclick="event.stopPropagation()">
      <div class="dialog-icon" aria-hidden="true">${I.trash(20)}</div>
      <h2 class="t-h4" id="del-title">Delete “${esc(s.name)}”?</h2>
      <p class="t-body dim mt8" id="del-desc">${consequence} This can't be undone.</p>
      <div class="dialog-actions">
        <button class="btn btn-outline" onclick="closeDeleteSurvey()">Keep survey</button>
        <button class="btn btn-destructive" onclick="confirmDeleteSurvey()">${I.trash(16)} Delete survey</button>
      </div>
    </div>
  </div>`;
}
function askDeleteSurvey(id){
  if(!state.surveys.find(x=>x.id===id)) return;
  state.surveyMenu = null;
  state.deleteSurvey = id;
  render();
}
function closeDeleteSurvey(){ state.deleteSurvey = null; render(); }
function confirmDeleteSurvey(){
  const id = state.deleteSurvey;
  if(!id) return;
  const s = state.surveys.find(x=>x.id===id);
  const name = s ? s.name : "Survey";
  state.surveys = state.surveys.filter(x=>x.id!==id);
  delete state.surveyQuestions[id];
  delete state.responses[id];
  state.deleteSurvey = null;
  go("#/surveys");
  toast(name+" deleted.");
}

/* patient survey */
function pStart(){ state.survey.step = 0; render(); scrollTop(); }
function pAnswer(id,v,el){
  state.survey.answers[id] = v;
  const group = el && el.closest(".p-opts, .p-scale");
  if(group){
    group.querySelectorAll("[aria-pressed]").forEach(b=>b.setAttribute("aria-pressed","false"));
    el.setAttribute("aria-pressed","true");
  }
  const next = document.querySelector(".p-card .p-next");
  if(next) next.disabled = false;
  const hint = document.querySelector("[data-need-answer]");
  if(hint) hint.remove();
}
function pText(id,v){ state.survey.answers[id] = v;
  const c = document.querySelector(".p-count"); if(c) c.textContent = v.length + " of 600"; }
function pNext(){ state.survey.step++; render(); scrollTop(); }
function pSkip(){ state.survey.step++; render(); scrollTop(); }
function pBack(){ state.survey.step = Math.max(-1, state.survey.step-1); render(); scrollTop(); }
function pDemo(k,v){ state.survey.demo[k] = v; }
function pFinish(){ state.survey.step = qList().length+1; render(); scrollTop(); }
function scrollTop(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const stage = document.querySelector(".preview-stage");
  const opts = {top:0, behavior: reduce?"auto":"smooth"};
  if(stage) stage.scrollTo(opts);
  else window.scrollTo(opts);
}

function surveyPreview(){
  const s = currentSurvey();
  const name = s ? s.name : "Survey";
  return `
  <div class="preview-overlay" role="dialog" aria-modal="true" aria-labelledby="preview-title">
    <div class="preview-bar">
      <div>
        <div class="t" id="preview-title">Patient preview</div>
        <div class="s">${esc(name)} · answers aren't stored</div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="closeSurveyPreview()">${I.x(16)} Close</button>
    </div>
    <div class="preview-stage">${viewPatient()}</div>
  </div>`;
}
function openSurveyPreview(){
  if(!qList().length){ toast("Add a question first."); return; }
  state.survey = { step:-1, answers:{}, showDemo:false, demo:{} };
  state.previewSurvey = true;
  render();
}
function closeSurveyPreview(){
  state.previewSurvey = false;
  state.survey = { step:-1, answers:{}, showDemo:false, demo:{} };
  render();
}

/* ============================================================
   10. ROUTER
   ============================================================ */
function isPatientRoute(h){ return h.startsWith("#/s/") && !h.startsWith("#/surveys"); }

function render(){
  const h = location.hash || "#/";
  state.route = h;
  const root = document.getElementById("root");

  if(isPatientRoute(h)){
    if(state.survey.step === undefined) state.survey.step = -1;
    root.innerHTML = viewPatient();
    return;
  }
  let body;
  if(h==="#/alerts") body = viewAlerts();
  else if(h==="#/surveys") body = viewSurveysIndex();
  else if(isResponsesRoute(h)) body = viewSurveyResponses();
  else if(h.startsWith("#/surveys/")) body = viewSurveys();
  else if(h==="#/insights") body = viewInsights();
  else body = viewOverview();
  root.innerHTML = shell(body);
}

window.addEventListener("hashchange", ()=>{
  if(!isPatientRoute(location.hash||"")) state.openAlert = null;
  state.deleteSurvey = null;
  state.renameSurvey = null;
  state.surveyMenu = null;
  state.previewSurvey = false;
  state.openResponse = null;
  render();
  if(!isPatientRoute(location.hash||"")) window.scrollTo({top:0});
});
window.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  if(state.previewSurvey){ closeSurveyPreview(); return; }
  if(state.renameSurvey){ closeRenameSurvey(); return; }
  if(state.surveyMenu){ closeSurveyMenu(); return; }
  if(state.deleteSurvey){ closeDeleteSurvey(); return; }
  if(state.openResponse){ closeResponse(); return; }
  if(state.openAlert){ closeAlert(); }
});
state.survey.step = -1;
render();
</script>

  data-key="7346157c-7e68-44b2-b76d-556d1e1f76e9"
  defer></script>
</body>
