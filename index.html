          ? `type="button" aria-pressed="${on}" onclick="pAnswer('${q.id}',${n},this)"`
          : "";
        const label = (q.labels && q.labels[n-1]) ? `<span>${esc(q.labels[n-1])}</span>` : "";
        return `<${tag} class="p-scale-btn" ${attrs}>${n}${label}</${tag}>`;
      }).join("")}
    </div>`;
  }
  return `<div class="p-fields">
    <textarea class="fw-input fw-textarea"${interactive?` id="ptext" maxlength="600" oninput="pText('${q.id}',this.value)"`:` readonly tabindex="-1"`} placeholder="Type your answer…">${interactive&&val?esc(val):""}</textarea>
    ${interactive?`<p class="t-detail dim p-count">${(val||"").length} of 600</p>`:""}
  </div>`;
}

function patientPreview(){
  const qs = qList();
  const idx = previewQIndex();
  const q = idx>=0 ? qs[idx] : null;
  if(!q){
    return `<div class="patient patient--embed">
      <div class="p-wrap">
        <div class="p-card">
          <p class="t-body dim">Add a question to see the patient preview.</p>
        </div>
      </div>
    </div>`;
  }
  return `<div class="patient patient--embed">
    <div class="p-wrap">
      <div class="p-card">
        ${pQuestionHead(q, idx, qs.length)}
        ${pQuestionFields(q)}
      </div>
    </div>
  </div>`;
}

function viewPatient(){
  const S = state.survey, qs = qList();
  const total = qs.length;

  /* intro */
  if(S.step === -1 || S.step === undefined) S.step = -1;
  if(S.step === -1){
    return `<div class="patient"><div class="p-wrap">
      ${pDemoBar()}
      <div class="p-lock">${I.lock(12)} Private — only ${AGENCY.name} sees this</div>
      <div class="p-card">
        ${pViewTag()}
        <h1 class="t-h2">A few questions about your ride with ${AGENCY.name}.</h1>
        <p class="t-body dim mt16">${total} questions, about a minute. Skip anything you'd rather not answer,
          and stop whenever you want.</p>
        <div class="fw-alert fw-alert--info mt16">
          <span class="fw-alert__icon">${I.shield(20)}</span>
          <p class="fw-alert__desc">Your answers go to a supervisor, not to the crew who treated you.
            Nothing here changes your bill or your care.</p>
        </div>
        <div class="p-actions">
          <div class="p-cta">
            <button class="fw-btn fw-btn--primary fw-btn--lg p-next" onclick="pStart()">Start</button>
          </div>
        </div>
        </div>
      </div>
      <p class="p-foot">Reflect · ${AGENCY.name} · reference ${"9F3C1A"}</p>
    </div></div>`;
  }

  /* demographics */
  if(S.step === total){
    return `<div class="patient"><div class="p-wrap">
      ${pDemoBar()}
      <div class="p-lock">${I.lock(12)} Private — only ${AGENCY.name} sees this</div>
      <div class="p-card">
        ${pViewTag()}
        ${pProgress(total, total)}
        <div class="p-step">
          <span class="fw-badge fw-badge--secondary">Optional</span>
        </div>
        <h1 class="t-h3 mt8">Three questions about you — only if you want.</h1>
        <p class="t-body dim mt8">We ask so we can check whether some people get a worse experience than others.
          You can send your answers without filling any of this in.</p>

        ${pSelectField("age")}
        ${pSelectField("lang")}
        ${pSelectField("eth")}

        <div class="p-actions">
          <div class="p-cta">
            <button class="fw-btn fw-btn--primary fw-btn--lg p-next" onclick="pFinish()">Send my answers</button>
            <button class="fw-btn fw-btn--link p-back" onclick="pBack()">Back</button>
          </div>
        </div>
        </div>
      </div>
      <p class="p-foot">Reflect · ${AGENCY.name}</p>
    </div></div>`;
  }

  /* done */
  if(S.step === total+1){
    const low = Object.entries(S.answers).some(([k,v])=>{
      if(k==="q1") return v==="Poor" || v==="Unacceptable";
      if(k==="q2") return v==="Not likely" || v==="Definitely not likely";
      if(k==="q3" || k==="q4") return v==="No";
      return false;
    });
    return `<div class="patient"><div class="p-wrap">
      ${pDemoBar()}
      <div class="p-card p-done">
        ${pViewTag()}
        <div class="p-seal">${I.check(22)}</div>
        <h1 class="t-h2">Thank you — that's genuinely useful.</h1>
        <p class="t-body dim mt16">Someone at ${AGENCY.name} will read this. You don't need to do anything else.</p>
        ${low?`<div class="fw-alert fw-alert--warning mt16" style="text-align:left">
          <span class="fw-alert__icon">${I.info(20)}</span>
          <p class="fw-alert__desc">You told us something went wrong. A supervisor will see this today and may call you
            if you left a number. We can't promise a particular outcome, but this doesn't disappear
            into a spreadsheet — a person reads it.</p>
        </div>`:`<div class="fw-alert fw-alert--info mt16" style="text-align:left">
          <span class="fw-alert__icon">${I.info(20)}</span>
          <p class="fw-alert__desc">If you think of something later, the link in your message stays open for 14 days.</p>
        </div>`}
        </div>
      </div>
      <p class="p-foot">You can close this page.</p>
    </div></div>`;
  }

  /* questions */
  const q = qs[S.step];
  const val = S.answers[q.id];
  const answered = val !== undefined && val !== "";

  return `<div class="patient"><div class="p-wrap">
    ${pDemoBar()}
    <div class="p-lock">${I.lock(12)} Private — only ${AGENCY.name} sees this</div>
    <div class="p-card">
      ${pViewTag()}
      ${pQuestionHead(q, S.step, total)}
      ${pQuestionFields(q, {interactive:true, val})}
      <div class="p-actions">
        <div class="p-cta">
          <button class="fw-btn fw-btn--primary fw-btn--lg p-next" ${q.required&&!answered?"disabled":""} onclick="pNext()">
            ${S.step===total-1?"Almost done":"Next"}</button>
          ${S.step>0?`<button class="fw-btn fw-btn--link p-back" onclick="pBack()">Back</button>`:""}
        </div>
        ${q.required?"":`<button class="fw-btn fw-btn--ghost" onclick="pSkip()">Skip</button>`}
      </div>
      ${q.required&&!answered?`<p class="t-body dim mt16" data-need-answer>Pick an answer to keep going,
        or close the page if you'd rather not.</p>`:""}
      </div>
    </div>
    <p class="p-foot">Reflect · ${AGENCY.name}</p>
  </div></div>`;
}
</script>
<script>
/* ============================================================
   9. ACTIONS
   ============================================================ */
function go(h){ location.hash = h; }
function prefersReduce(){
  return matchMedia("(prefers-reduced-motion: reduce)").matches;
}
function drawerKey(){
  if(state.openResponse) return `r:${state.openResponse.surveyId}:${state.openResponse.id}`;
  if(state.openAlert) return `a:${state.openAlert}`;
  return null;
}
function isResponsePaging(){
  const prev = state.drawerKey;
  const key = drawerKey();
  return !!(prev && key && prev.startsWith("r:") && key.startsWith("r:") &&
    prev.split(":")[1]===key.split(":")[1] && prev!==key);
}
function armDrawer(){
  const el = document.querySelector(".drawer");
  const key = drawerKey();
  if(!el || !key){
    state.drawerKey = null;
    return;
  }
  const prev = state.drawerKey;
  const same = prev === key;
  const paging = isResponsePaging();
  state.drawerKey = key;
  if(same || prefersReduce() || paging){
    el.classList.toggle("is-paging", !!paging);
    el.classList.add("is-open");
    return;
  }
  el.classList.remove("is-paging");
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const live = document.querySelector(".drawer");
      if(live) live.classList.add("is-open");
    });
  });
}
function withViewTransition(fn){
  if(typeof document.startViewTransition==="function" && !prefersReduce()){
    document.startViewTransition(fn);
  } else fn();
}
function withFlip(sel, mutate){
  if(prefersReduce()){ mutate(); return; }
  const first = new Map();
  document.querySelectorAll(sel).forEach(el=>{
    first.set(el.getAttribute("data-qid"), el.getBoundingClientRect());
  });
  mutate();
  document.querySelectorAll(sel).forEach(el=>{
    const id = el.getAttribute("data-qid");
    const prev = first.get(id);
    const last = el.getBoundingClientRect();
    if(!prev){ el.classList.add("qcard-in"); return; }
    const dy = prev.top - last.top;
    if(Math.abs(dy)<1) return;
    el.animate(
      [{transform:`translateY(${dy}px)`},{transform:"translateY(0)"}],
      {duration:180, easing:"cubic-bezier(.16,1,.3,1)"}
    );
  });
}
function dismissStale(){ state.hideStale = true; render(); }
function syncNavDom(){
  const open = !!state.navOpen;
  document.body.classList.toggle("nav-open", open);
  const drawer = document.getElementById("app-nav");
  const scrim = document.querySelector(".nav-scrim");
  const btn = document.querySelector(".nav-toggle");
  if(drawer){
    drawer.classList.toggle("is-open", open);
    drawer.setAttribute("aria-hidden", open ? "false" : "true");
    if(open) drawer.removeAttribute("inert");
    else drawer.setAttribute("inert", "");
  }
  if(scrim) scrim.classList.toggle("is-open", open);
  if(btn){
    btn.setAttribute("aria-expanded", String(open));
    btn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    btn.innerHTML = open ? I.x(20) : I.menu(20);
  }
}
function toggleNav(){
  state.navOpen = !state.navOpen;
  syncNavDom();
}
function closeNav(){
  if(!state.navOpen) return;
  state.navOpen = false;
  syncNavDom();
}
function onNavLink(h){
  const cur = location.hash || "#/";
  const same = h==="#/surveys" ? cur.startsWith("#/surveys") : cur===h;
  closeNav();
  if(same) return;
}
function setRole(r){
  if(r!=="supervisor" && r!=="leadership") return;
  state.role = r;
  render();
}
function toggleTheme(){
  state.theme = state.theme==="light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", state.theme);
  withViewTransition(()=>render());
}
let toastTimer;
function toast(msg, alreadyRendered){
  state.toast = msg;
  if(!alreadyRendered) render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    state.toast=null;
    render();
    state.scrollPreserve = null;
  }, 2600);
}

/* Keep the Question library in view after a full re-render inserts a card above it. */
function captureLibScroll(libId){
  const el = document.querySelector(`[data-lib-id="${libId}"]`);
  const list = document.querySelector(".lib-list");
  const anchor = el || list;
  state.scrollPreserve = {
    libId,
    anchorTop: anchor ? anchor.getBoundingClientRect().top : null,
    libScroll: list ? list.scrollTop : 0
  };
}
function restoreLibScroll(){
  const sp = state.scrollPreserve;
  if(!sp || sp.anchorTop == null) return;
  const apply = ()=>{
    if(state.scrollPreserve !== sp) return;
    const el = document.querySelector(`[data-lib-id="${sp.libId}"]`) || document.querySelector(".lib-list");
    if(!el) return;
    const delta = el.getBoundingClientRect().top - sp.anchorTop;
    if(Math.abs(delta) > 0.5) window.scrollBy(0, delta);
    const list = document.querySelector(".lib-list");
    if(list) list.scrollTop = sp.libScroll;
  };
  apply();
  requestAnimationFrame(apply);
}

function blinkSend(id){
  state.blinkSent[id] = true;
  toast("Sent to Blink feed.");
}

function openAlert(id){ state.openAlert = id; render(); }
function closeAlert(){ state.openAlert = null; render(); }

function noteFor(id){
  const el = document.getElementById("note-"+id);
  return el ? el.value.trim() : "";
}
function logOnly(id){
  const a = state.alerts.find(x=>x.id===id);
  const t = noteFor(id);
  if(!t){ toast("Add a note first, then log it."); return; }
  a.log.unshift({ who:"You", at:NOW, text:t });
  render(); toast("Logged.");
}
function logAndResolve(id){
  const a = state.alerts.find(x=>x.id===id);
  const t = noteFor(id);
  if(!t){ toast("Add a note before closing this out."); return; }
  a.log.unshift({ who:"You", at:NOW, text:t });
  a.status = "resolved";
  if(a.assigned==="Unassigned") a.assigned = "You";
  state.openAlert = null;
  const row = document.getElementById("row-"+id);
  if(row && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    row.classList.add("resolving");
    setTimeout(()=>{ render(); toast("Marked followed up."); }, 180);
  } else { render(); toast("Marked followed up."); }
}
function claim(id){
  const a = state.alerts.find(x=>x.id===id);
  a.assigned = "You"; render(); toast("Assigned to you.");
}

function moveQTo(from, to){
  const q = qList();
  if(from===to || from<0 || to<0 || from>=q.length || to>=q.length) return;
  withFlip("[data-qid]", ()=>{
    const [item] = q.splice(from, 1);
    q.splice(to, 0, item);
    state.previewQId = item.id;
    render();
  });
}
function moveQ(i,d){ moveQTo(i, i+d); }
function qClearDropHints(except){
  document.querySelectorAll(".qcard.drop-before,.qcard.drop-after").forEach(el=>{
    if(el!==except) el.classList.remove("drop-before","drop-after");
  });
}
function qDragStart(e){
  const card = e.currentTarget.closest(".qcard");
  if(!card){ e.preventDefault(); return; }
  const id = card.getAttribute("data-qid");
  const dt = e.dataTransfer;
  if(dt){
    dt.setData("text/plain", id);
    dt.effectAllowed = "move";
    try{ dt.setDragImage(card, 24, 24); }catch(_){}
  }
  card.classList.add("is-dragging");
  state.dragQId = id;
}
function qDragEnter(e){ e.preventDefault(); }
function qDragOver(e){
  e.preventDefault();
  if(e.dataTransfer) e.dataTransfer.dropEffect = "move";
  const over = e.currentTarget;
  qClearDropHints(over);
  if(over.getAttribute("data-qid")===state.dragQId){
    over.classList.remove("drop-before","drop-after");
    return;
  }
  const mid = over.getBoundingClientRect();
  const after = e.clientY > mid.top + mid.height/2;
  over.classList.toggle("drop-after", after);
  over.classList.toggle("drop-before", !after);
}
function qDrop(e){
  e.preventDefault();
  const fromId = (e.dataTransfer && e.dataTransfer.getData("text/plain")) || state.dragQId;
  const over = e.currentTarget;
  const q = qList();
  const from = q.findIndex(x=>x.id===fromId);
  let to = q.findIndex(x=>x.id===over.getAttribute("data-qid"));
  if(from<0 || to<0) return;
  const box = over.getBoundingClientRect();
  if(e.clientY > box.top + box.height/2) to += 1;
  if(from < to) to -= 1;
  state.suppressQClick = true;
  moveQTo(from, to);
  requestAnimationFrame(()=>{ state.suppressQClick = false; });
}
function qDragEnd(){
  state.dragQId = null;
  document.querySelectorAll(".qcard").forEach(el=>{
    el.classList.remove("is-dragging","drop-before","drop-after");
  });
}
function removeQ(id){
  const apply = ()=>{
    const sid = surveyIdFromHash() || "sv_post";
    const qs = qList();
    const i = qs.findIndex(q=>q.id===id);
    if(i<0) return;
    if(qs[i].locked){ toast("Benchmark questions can't be removed."); return; }
    state.surveyQuestions[sid] = qs.filter(q=>q.id!==id);
    syncQuestionCount(sid);
    if(state.previewQId===id){
      const next = qs[i+1] || qs[i-1];
      state.previewQId = next ? next.id : null;
    }
    toast("Question removed.", true);
    withFlip("[data-qid]", render);
  };
  const card = document.querySelector(`[data-qid="${id}"]`);
  if(card && !prefersReduce() && !card.classList.contains("qcard-out")){
    card.classList.add("qcard-out");
    setTimeout(apply, 180);
  } else apply();
}
let qn = 100;
function addQ(type){
  const id = "q"+(++qn);
  qList().push({
    id, type, required:false, locked:false,
    text:"New question — click the pencil to write it",
    options: type==="choice" ? ["Option one","Option two"] : undefined,
    labels:  type==="scale"  ? ["Poor","","","","Excellent"] : undefined
  });
  state.previewQId = id;
  syncQuestionCount(surveyIdFromHash() || "sv_post");
  toast("Question added.", true);
  withFlip("[data-qid]", render);
}
function addFromLib(id){
  const l = LIBRARY.find(x=>x.id===id);
  if(!l) return;
  const already = qList().some(q=>q.text.trim().toLowerCase()===l.text.trim().toLowerCase());
  if(already){ toast("That question is already in this survey."); return; }
  captureLibScroll(id);
  const qid = "q"+(++qn);
  qList().push({
    id: qid,
    text: l.text,
    type: l.type,
    required: !!l.benchmark,
    locked: !!l.benchmark,
    lockNote: l.benchmark ? "Benchmark question — shared wording across participating agencies" : undefined,
    options: l.options ? [...l.options] : undefined,
    labels: l.type==="scale" ? ["Poor","","","","Excellent"] : undefined
  });
  state.previewQId = qid;
  syncQuestionCount(surveyIdFromHash() || "sv_post");
  toast("Added from library.", true);
  withFlip("[data-qid]", render);
}
function setLibraryFilter(f){
  state.libraryFilter = f;
  render();
}

let sn = 100;
function newSurvey(){
  const id = "sv_"+ (++sn);
  state.surveys.unshift({ id, name:"Untitled survey", status:"Draft", questions:0, responses:0, rate:0, sent:0, starred:false, updated:NOW });
  state.surveyQuestions[id] = [];
  state.responses[id] = [];
  go("#/surveys/"+id);
  toast("Draft created.");
}
function duplicateSurvey(id){
  const s = state.surveys.find(x=>x.id===id);
  if(!s) return;
  const nid = "sv_"+ (++sn);
  const copy = (state.surveyQuestions[id]||[]).map(q=>({
    ...q, id:"q"+(++qn),
    options: q.options ? [...q.options] : undefined,
    labels: q.labels ? [...q.labels] : undefined
  }));
  state.surveys.unshift({ ...s, id:nid, name:s.name+" (copy)", status:"Draft", responses:0, rate:0, sent:0, starred:false, updated:NOW, questions:copy.length });
  state.surveyQuestions[nid] = copy;
  state.responses[nid] = [];
  state.surveyMenu = null;
  go("#/surveys/"+nid);
  toast("Duplicated as a draft.");
}

function surveyRowMenu(s){
  const open = state.surveyMenu===s.id;
  return `<div class="menu-wrap${open?" open":""}" onclick="event.stopPropagation()">
    <button class="iconbtn" aria-label="More actions" aria-haspopup="menu" aria-expanded="${open}"
      onclick="toggleSurveyMenu('${s.id}')">${I.more(18)}</button>
    ${open?`<div class="menu" role="menu">
      <button type="button" role="menuitem" onclick="toggleStar('${s.id}')">${I.star(16)} ${s.starred?"Unstar":"Star"}</button>
      <div class="menu-sep"></div>
      <button type="button" role="menuitem" onclick="askRenameSurvey('${s.id}')">${I.pencil(16)} Rename</button>
      ${s.status==="Live"?`<button type="button" role="menuitem" onclick="go('#/surveys/${s.id}/responses')">${I.inbox(16)} View responses</button>`:""}
      <button type="button" role="menuitem" onclick="duplicateSurvey('${s.id}')">${I.copy(16)} Duplicate</button>
      <button type="button" role="menuitem" class="danger" onclick="askDeleteSurvey('${s.id}')">${I.trash(16)} Delete</button>
    </div>`:""}
  </div>`;
}
function toggleSurveyMenu(id){
  state.surveyMenu = state.surveyMenu===id ? null : id;
  render();
}
function closeSurveyMenu(){ state.surveyMenu = null; render(); }
function toggleStar(id){
  const s = state.surveys.find(x=>x.id===id);
  if(!s) return;
  s.starred = !s.starred;
  state.surveyMenu = null;
  render();
}

function renameDialog(id){
  const s = state.surveys.find(x=>x.id===id);
  if(!s) return "";
  return `
  <div class="scrim" style="z-index:54"></div>
  <div class="dialog-wrap" onclick="closeRenameSurvey()">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ren-title"
      onclick="event.stopPropagation()">
      <h2 class="t-h4" id="ren-title">Rename survey</h2>
      <label class="t-subtle" style="font-weight:700;display:block;margin:16px 0 8px" for="rename-input">Name</label>
      <input class="fw-input" id="rename-input" value="${esc(s.name)}"
        onkeydown="if(event.key==='Enter'){event.preventDefault();confirmRenameSurvey()}">
      <div class="dialog-actions">
        <button class="fw-btn fw-btn--outline" onclick="closeRenameSurvey()">Cancel</button>
        <button class="fw-btn fw-btn--primary" onclick="confirmRenameSurvey()">Save name</button>
      </div>
    </div>
  </div>`;
}
function applySurveyName(id, raw){
  const name = (raw || "").trim();
  if(!name){ toast("Give the survey a name."); return {ok:false, changed:false}; }
  const s = state.surveys.find(x=>x.id===id);
  if(!s) return {ok:false, changed:false};
  const changed = s.name !== name;
  if(changed){ s.name = name; s.updated = NOW; }
  return {ok:true, changed};
}
function askRenameSurvey(id){
  if(!state.surveys.find(x=>x.id===id)) return;
  state.surveyMenu = null;
  state.renameSurvey = id;
  render();
  const input = document.getElementById("rename-input");
  if(input){ input.focus(); input.select(); }
}
function closeRenameSurvey(){ state.renameSurvey = null; render(); }
function confirmRenameSurvey(){
  const id = state.renameSurvey;
  const input = document.getElementById("rename-input");
  if(!id) return;
  const result = applySurveyName(id, input && input.value);
  if(!result.ok) return;
  state.renameSurvey = null;
  render();
  if(result.changed) toast("Renamed.");
}

let skipSurveyNameBlur = false;
function startInlineRename(id){
  if(!state.surveys.find(x=>x.id===id)) return;
  state.editingSurveyName = id;
  render();
  const input = document.getElementById("survey-name-input");
  if(input){ input.focus(); input.select(); }
}
function cancelInlineRename(){
  if(!state.editingSurveyName) return;
  skipSurveyNameBlur = true;
  state.editingSurveyName = null;
  render();
}
function confirmInlineRename(){
  const id = state.editingSurveyName;
  if(!id) return;
  const input = document.getElementById("survey-name-input");
  skipSurveyNameBlur = true;
  const result = applySurveyName(id, input && input.value);
  if(!result.ok){
    const el = document.getElementById("survey-name-input");
    if(el) el.focus();
    skipSurveyNameBlur = false;
    return;
  }
  state.editingSurveyName = null;
  render();
  skipSurveyNameBlur = false;
  if(result.changed) toast("Renamed.");
}
function onSurveyNameBlur(){
  if(skipSurveyNameBlur){ skipSurveyNameBlur = false; return; }
  confirmInlineRename();
}
function surveyNameKey(e){
  if(e.key==="Enter"){ e.preventDefault(); confirmInlineRename(); }
  if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); cancelInlineRename(); }
}

function deleteConfirm(id){
  const s = state.surveys.find(x=>x.id===id);
  if(!s) return "";
  const live = s.status==="Live";
  const consequence = live && s.responses
    ? `Stops invitations and permanently removes ${s.responses} response${s.responses===1?"":"s"} collected so far.`
    : live
    ? "Stops invitations and removes this survey from Reflect."
    : "Removes this draft and its questions. It hasn't been sent yet.";
  return `
  <div class="scrim" style="z-index:54"></div>
  <div class="dialog-wrap" onclick="closeDeleteSurvey()">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="del-title" aria-describedby="del-desc"
      onclick="event.stopPropagation()">
      <div class="dialog-icon" aria-hidden="true">${I.trash(20)}</div>
      <h2 class="t-h4" id="del-title">Delete “${esc(s.name)}”?</h2>
      <p class="t-body dim mt8" id="del-desc">${consequence} This can't be undone.</p>
      <div class="dialog-actions">
        <button class="fw-btn fw-btn--outline" onclick="closeDeleteSurvey()">Keep survey</button>
        <button class="fw-btn fw-btn--destructive" onclick="confirmDeleteSurvey()">${I.trash(16)} Delete survey</button>
      </div>
    </div>
  </div>`;
}
function askDeleteSurvey(id){
  if(!state.surveys.find(x=>x.id===id)) return;
  state.surveyMenu = null;
  state.deleteSurvey = id;
  render();
}
function closeDeleteSurvey(){ state.deleteSurvey = null; render(); }
function confirmDeleteSurvey(){
  const id = state.deleteSurvey;
  if(!id) return;
  const s = state.surveys.find(x=>x.id===id);
  const name = s ? s.name : "Survey";
  state.surveys = state.surveys.filter(x=>x.id!==id);
  delete state.surveyQuestions[id];
  delete state.responses[id];
  state.deleteSurvey = null;
  go("#/surveys");
  toast(name+" deleted.");
}

/* patient survey */
function pTurn(dir, mutate){
  if(state.pBusy) return;
  const view = document.querySelector(".p-view");
  const jump = ()=>{
    const stage = document.querySelector(".preview-stage");
    if(stage) stage.scrollTop = 0;
    else window.scrollTo(0, 0);
  };
  const apply = ()=>{
    mutate();
    state.pSlide = dir;
    state.pSelectOpen = null;
    render();
    jump();
    state.pBusy = false;
  };
  if(prefersReduce() || !view){ apply(); return; }
  state.pBusy = true;
  let done = false;
  const finish = ()=>{
    if(done) return;
    done = true;
    apply();
  };
  view.classList.remove("p-view--in-fwd","p-view--in-back");
  view.classList.add(dir==="back" ? "p-view--out-back" : "p-view--out-fwd");
  view.addEventListener("animationend", e=>{ if(e.target===view) finish(); });
  setTimeout(finish, 220);
}
function pStart(){ pTurn("fwd", ()=>{ state.survey.step = 0; }); }
function pAnswer(id,v,el){
  state.survey.answers[id] = v;
  const group = el && el.closest(".p-opts, .p-scale");
  if(group){
    group.querySelectorAll("[aria-pressed]").forEach(b=>b.setAttribute("aria-pressed","false"));
    el.setAttribute("aria-pressed","true");
  }
  const next = document.querySelector(".p-card .p-next");
  if(next) next.disabled = false;
  const hint = document.querySelector("[data-need-answer]");
  if(hint) hint.remove();
}
function pText(id,v){ state.survey.answers[id] = v;
  const c = document.querySelector(".p-count"); if(c) c.textContent = v.length + " of 600"; }
function pNext(){ pTurn("fwd", ()=>{ state.survey.step++; }); }
function pSkip(){ pTurn("fwd", ()=>{ state.survey.step++; }); }
function pBack(){ pTurn("back", ()=>{ state.survey.step = Math.max(-1, state.survey.step-1); }); }
function pDemo(k,v){ state.survey.demo[k] = v; }
function pSelectPaint(focusKey){
  Object.keys(P_DEMO).forEach(k=>{
    const btn = document.getElementById(P_DEMO[k].id);
    const field = btn && btn.closest(".fw-field");
    if(!field) return;
    const tpl = document.createElement("template");
    tpl.innerHTML = pSelectField(k).trim();
    field.replaceWith(tpl.content.firstElementChild);
  });
  if(focusKey) document.getElementById(P_DEMO[focusKey].id)?.focus();
  if(state.pSelectOpen) document.querySelector(".fw-select__opt[data-active]")?.scrollIntoView({block:"nearest"});
}
function pSelectToggle(key, e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  state.pSelectOpen = state.pSelectOpen===key ? null : key;
  if(state.pSelectOpen){
    const values = pSelectValues(key);
    const val = state.survey.demo[key] || "";
    const i = values.indexOf(val);
    state.pSelectActive = i<0 ? 0 : i;
  }
  pSelectPaint(key);
}
function pSelectPick(key, el){
  pDemo(key, el.getAttribute("data-value") || "");
  state.pSelectOpen = null;
  pSelectPaint(key);
}
function pSelectKey(key, e){
  const open = state.pSelectOpen===key;
  const values = pSelectValues(key);
  if(e.key==="Escape"){
    if(open){ e.preventDefault(); state.pSelectOpen = null; pSelectPaint(key); }
    return;
  }
  if(e.key==="ArrowDown" || e.key==="ArrowUp"){
    e.preventDefault();
    if(!open){ pSelectToggle(key, e); return; }
    const delta = e.key==="ArrowDown" ? 1 : -1;
    state.pSelectActive = (state.pSelectActive + delta + values.length) % values.length;
    pSelectPaint(key);
    return;
  }
  if(e.key==="Home" || e.key==="End"){
    if(!open) return;
    e.preventDefault();
    state.pSelectActive = e.key==="Home" ? 0 : values.length-1;
    pSelectPaint(key);
    return;
  }
  if((e.key==="Enter" || e.key===" ") && open){
    e.preventDefault();
    pDemo(key, values[state.pSelectActive] || "");
    state.pSelectOpen = null;
    pSelectPaint(key);
  }
}
function pFinish(){ pTurn("fwd", ()=>{ state.survey.step = qList().length+1; }); }
function scrollTop(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const stage = document.querySelector(".preview-stage");
  const opts = {top:0, behavior: reduce?"auto":"smooth"};
  if(stage) stage.scrollTo(opts);
  else window.scrollTo(opts);
}

function surveyPreview(){
  const s = currentSurvey();
  const name = s ? s.name : "Survey";
  return `
  <div class="preview-overlay" role="dialog" aria-modal="true" aria-labelledby="preview-title">
    <div class="preview-bar">
      <div>
        <div class="t" id="preview-title">Patient preview</div>
        <div class="s">${esc(name)} · answers aren't stored</div>
      </div>
      <button class="fw-btn fw-btn--outline fw-btn--sm" onclick="closeSurveyPreview()">${I.x(16)} Close</button>
    </div>
    <div class="preview-stage">${viewPatient()}</div>
  </div>`;
}
function openSurveyPreview(){
  if(!qList().length){ toast("Add a question first."); return; }
  state.survey = { step:-1, answers:{}, showDemo:false, demo:{} };
  state.previewSurvey = true;
  render();
}
function closeSurveyPreview(){
  state.previewSurvey = false;
  state.survey = { step:-1, answers:{}, showDemo:false, demo:{} };
  render();
}

/* ============================================================
   10. ROUTER
   ============================================================ */
function isPatientRoute(h){ return h.startsWith("#/s/") && !h.startsWith("#/surveys"); }

function render(){
  const h = location.hash || "#/";
  state.route = h;
  const root = document.getElementById("root");
  const enter = !!state.routeEnter;
  state.routeEnter = false;
  document.documentElement.classList.toggle("is-route-enter", enter);

  if(isPatientRoute(h)){
    if(state.role==="patient") state.role = "supervisor";
    go("#/surveys");
    return;
  }
  let body;
  if(h==="#/alerts") body = viewAlerts();
  else if(h==="#/triggers") body = viewTriggers();
  else if(h==="#/scorecard") body = viewScorecard();
  else if(h==="#/blink") body = viewBlink();
  else if(h==="#/surveys") body = viewSurveysIndex();
  else if(isResponsesRoute(h)) body = viewSurveyResponses();
  else if(h.startsWith("#/surveys/")) body = viewSurveys();
  else body = viewOverview();
  root.innerHTML = shell(body);
  document.body.classList.toggle("nav-open", !!state.navOpen);
  document.body.classList.toggle("drawer-open", !!(state.openAlert||state.openResponse));
  restoreLibScroll();
  armDrawer();
  if(enter) requestAnimationFrame(()=>document.documentElement.classList.remove("is-route-enter"));
}

window.addEventListener("hashchange", ()=>{
  if(!isPatientRoute(location.hash||"")){
    state.openAlert = null;
    if(state.role==="patient") state.role = "supervisor";
  }
  state.deleteSurvey = null;
  state.renameSurvey = null;
  state.editingSurveyName = null;
  state.surveyMenu = null;
  state.previewSurvey = false;
  state.openResponse = null;
  state.responseFilter = "all";
  state.responseLimit = RESPONSE_PAGE;
  state.navOpen = false;
  state.scrollPreserve = null;
  state.routeEnter = true;
  withViewTransition(()=>{
    render();
    if(!isPatientRoute(location.hash||"")) window.scrollTo({top:0});
  });
});
window.addEventListener("keydown", e=>{
  if(state.openResponse && (e.key==="ArrowLeft" || e.key==="ArrowRight") && !e.metaKey && !e.ctrlKey && !e.altKey){
    const tag = ((e.target && e.target.tagName) || "").toLowerCase();
    if(tag!=="input" && tag!=="textarea" && tag!=="select"){
      e.preventDefault();
      openResponseNeighbor(e.key==="ArrowRight"?"next":"prev");
      return;
    }
  }
  if(e.key!=="Escape") return;
  if(state.pSelectOpen){ state.pSelectOpen = null; pSelectPaint(); return; }
  if(state.navOpen){ closeNav(); return; }
  if(state.previewSurvey){ closeSurveyPreview(); return; }
  if(state.renameSurvey){ closeRenameSurvey(); return; }
  if(state.editingSurveyName){ cancelInlineRename(); return; }
  if(state.surveyMenu){ closeSurveyMenu(); return; }
  if(state.deleteSurvey){ closeDeleteSurvey(); return; }
  if(state.openResponse){ closeResponse(); return; }
  if(state.openAlert){ closeAlert(); }
});
window.addEventListener("mousedown", e=>{
  if(!state.pSelectOpen) return;
  if(e.target.closest(".fw-select")) return;
  state.pSelectOpen = null;
  pSelectPaint();
});
window.matchMedia("(max-width: 1199px)").addEventListener("change", ev=>{
  if(!ev.matches) state.navOpen = false;
  if(!isPatientRoute(location.hash||"#/")) render();
});
state.survey.step = -1;
render();
</script>
