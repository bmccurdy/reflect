function scheduleDurationOptions(sch){
  const days = Math.max(1, Number(sch.durationDays)||30);
  const presets = [14,30,90];
  const rows = presets.map(d=>({ value:String(d), label:`${d} days`, days:d }));
  if(!presets.includes(days)){
    rows.push({ value:String(days), label:`${days} days`, days });
  }
  return rows;
}
function scheduleDurationSelect(s){
  const sch = s.schedule || defaultSchedule();
  const open = !!state.scheduleDurationOpen;
  const rows = scheduleDurationOptions(sch);
  const days = Math.max(1, Number(sch.durationDays)||30);
  const selectedIdx = Math.max(0, rows.findIndex(r=>Number(r.days)===days));
  const active = Math.min(rows.length-1, Math.max(0, state.scheduleDurationActive|0));
  const shown = rows[selectedIdx] ? rows[selectedIdx].label : `${days} days`;
  return `<div class="fw-field">
    <label class="fw-label" id="sched-duration-label" for="sched-duration-trigger">Run for</label>
    <div class="fw-select schedule-duration-select${open?" is-open":""}">
      <button type="button" class="fw-select__trigger" id="sched-duration-trigger"
        aria-haspopup="listbox" aria-expanded="${open}"
        aria-labelledby="sched-duration-label sched-duration-trigger"
        aria-controls="sched-duration-list"
        ${open?`aria-activedescendant="sched-duration-opt-${active}"`:""}
        onclick="scheduleDurationToggle(event)"
        onkeydown="scheduleDurationKey(event)">${esc(shown)}</button>
      <span class="fw-select__chevron" aria-hidden="true">${I.down(16)}</span>
      ${open?`<div class="fw-select__menu" id="sched-duration-list" role="listbox" aria-labelledby="sched-duration-label">
        ${rows.map((r,i)=>{
          const on = Number(r.days)===days;
          return `<div class="fw-select__opt" role="option" id="sched-duration-opt-${i}"
            aria-selected="${on}"${i===active?" data-active":""}
            onmousedown="event.preventDefault()"
            onclick="scheduleDurationPick('${esc(r.value)}')">${esc(r.label)}${on?I.check(16):""}</div>`;
        }).join("")}
      </div>`:""}
    </div>
  </div>`;
}
function scheduleDurationPaint(focus){
  const wrap = document.querySelector(".schedule-duration-select");
  if(!wrap) return;
  const s = currentSurvey();
  if(!s) return;
  const field = wrap.closest(".fw-field");
  const host = field || wrap;
  const tpl = document.createElement("template");
  tpl.innerHTML = scheduleDurationSelect(s).trim();
  host.replaceWith(tpl.content.firstElementChild);
  if(focus!==false) document.getElementById("sched-duration-trigger")?.focus();
  if(state.scheduleDurationOpen){
    document.querySelector("#sched-duration-list .fw-select__opt[data-active]")?.scrollIntoView({block:"nearest"});
  }
}
function scheduleDurationToggle(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  if(isSurveyLocked(currentSurvey())) return;
  state.scheduleDurationOpen = !state.scheduleDurationOpen;
  if(state.scheduleDurationOpen){
    const s = currentSurvey();
    const sch = s?.schedule || defaultSchedule();
    const rows = scheduleDurationOptions(sch);
    const days = Math.max(1, Number(sch.durationDays)||30);
    const idx = rows.findIndex(r=>Number(r.days)===days);
    state.scheduleDurationActive = idx>=0 ? idx : 0;
  }
  scheduleDurationPaint();
}
function scheduleDurationPick(value){
  state.scheduleDurationOpen = false;
  const s = currentSurvey();
  if(!s) return;
  setSurveyDurationDays(s.id, value);
}
function scheduleDurationKey(e){
  const open = !!state.scheduleDurationOpen;
  const s = currentSurvey();
  const rows = scheduleDurationOptions(s?.schedule || defaultSchedule());
  const n = rows.length;
  if(e.key==="Escape"){
    if(open){ e.preventDefault(); state.scheduleDurationOpen = false; scheduleDurationPaint(); }
    return;
  }
  if(e.key==="ArrowDown" || e.key==="ArrowUp"){
    e.preventDefault();
    if(!open){ scheduleDurationToggle(e); return; }
    const delta = e.key==="ArrowDown" ? 1 : -1;
    state.scheduleDurationActive = (state.scheduleDurationActive + delta + n) % n;
    scheduleDurationPaint();
    return;
  }
  if(e.key==="Home" || e.key==="End"){
    if(!open) return;
    e.preventDefault();
    state.scheduleDurationActive = e.key==="Home" ? 0 : n-1;
    scheduleDurationPaint();
    return;
  }
  if((e.key==="Enter" || e.key===" ") && open){
    e.preventDefault();
    scheduleDurationPick(rows[state.scheduleDurationActive].value);
  }
}
function surveyLockBanner(s){
  if(!isSurveyLocked(s)) return "";
  if(s.status==="Stopped") return "";
  if(s.status==="Live"){
    return `
    <div class="fw-alert fw-alert--info survey-lock-banner" role="status">
      <span class="fw-alert__icon">${I.lock(20)}</span>
      <div>
        <p class="fw-alert__desc"><strong>Live — editing locked.</strong> This survey is collecting responses. Questions, trigger, and schedule can’t change on this version.</p>
      </div>
    </div>`;
  }
  return `
  <div class="fw-alert fw-alert--warning survey-lock-banner" role="status">
    <span class="fw-alert__icon">${I.lock(20)}</span>
    <div>
      <p class="fw-alert__desc"><strong>Completed — read only.</strong> ${esc(formatScheduleSummary(s))}. ${surveyActiveTriggerId(s)?"":surveyPriorTriggerId(s)?"Trigger freed for a new draft.":"No trigger was linked."}</p>
      <div class="fw-alert__actions">
        <button type="button" class="fw-btn fw-btn--primary fw-btn--sm" onclick="duplicateAndEdit('${s.id}')">${I.copy(14)} Duplicate &amp; edit</button>
        ${s.clonedFromId?`<a class="fw-btn fw-btn--outline fw-btn--sm" href="#/surveys/${s.clonedFromId}">View prior version</a>`:""}
      </div>
    </div>
  </div>`;
}
function triggerSelectPaint(focusSearch){
  const wrap = document.querySelector(".trigger-select");
  if(!wrap) return;
  const s = currentSurvey();
  if(!s) return;
  const field = wrap.closest(".fw-field");
  const host = field || wrap;
  const tpl = document.createElement("template");
  tpl.innerHTML = triggerSelect(s).trim();
  host.replaceWith(tpl.content.firstElementChild);
  if(focusSearch!==false && state.triggerSelectOpen){
    const input = document.getElementById("trigger-select-search");
    if(input){
      input.focus();
      const len = input.value.length;
      try{ input.setSelectionRange(len, len); }catch(_){}
    } else {
      document.getElementById("trigger-select-trigger")?.focus();
    }
  } else if(focusSearch!==false){
    document.getElementById("trigger-select-trigger")?.focus();
  }
  if(state.triggerSelectOpen){
    document.querySelector(".trigger-select-opt[data-active]")?.scrollIntoView({block:"nearest"});
  }
}
/* Update options/footer only — keep the search input mounted so typing doesn't glitch. */
function triggerSelectPaintList(){
  const menu = document.querySelector(".trigger-select .fw-select__menu");
  const list = document.querySelector(".trigger-select-list");
  const triggerBtn = document.getElementById("trigger-select-trigger");
  if(!menu || !list || !state.triggerSelectOpen) return;
  const s = currentSurvey();
  const selected = findTriggerDef(s?.triggerId);
  const model = triggerSelectModel(s?.id);
  const rows = model.rows;
  const active = rows.length
    ? Math.min(Math.max(0, rows.length-1), Math.max(0, state.triggerSelectActive|0))
    : 0;
  state.triggerSelectActive = active;
  list.innerHTML = triggerSelectOptHtml(model, selected, active, s?.id);

  const hintHtml = triggerSelectHintHtml(model);
  let hint = menu.querySelector(".trigger-select-hint");
  if(hintHtml){
    if(hint) hint.outerHTML = hintHtml;
    else list.insertAdjacentHTML("beforebegin", hintHtml);
  } else if(hint){
    hint.remove();
  }

  const footHtml = triggerSelectFootHtml(model);
  let foot = menu.querySelector(".trigger-select-foot");
  if(footHtml){
    if(foot) foot.outerHTML = footHtml;
    else menu.insertAdjacentHTML("beforeend", footHtml);
  } else if(foot){
    foot.remove();
  }

  if(triggerBtn){
    if(rows.length) triggerBtn.setAttribute("aria-activedescendant", `trigger-select-opt-${active}`);
    else triggerBtn.removeAttribute("aria-activedescendant");
  }
  document.querySelector(".trigger-select-opt[data-active]")?.scrollIntoView({block:"nearest"});
}
function triggerSelectToggle(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  if(isSurveyLocked(currentSurvey())) return;
  state.triggerSelectOpen = !state.triggerSelectOpen;
  if(state.triggerSelectOpen){
    state.triggerSelectQuery = "";
    state.triggerSelectShowUsed = false;
    const rows = triggerSelectFiltered();
    const sel = findTriggerDef(currentSurvey()?.triggerId);
    const idx = sel ? rows.findIndex(t=>t.id===sel.id) : 0;
    state.triggerSelectActive = idx>=0 ? idx : 0;
  } else {
    state.triggerSelectQuery = "";
    state.triggerSelectShowUsed = false;
  }
  triggerSelectPaint();
}
function onTriggerSelectInput(val){
  state.triggerSelectQuery = val;
  state.triggerSelectActive = 0;
  triggerSelectPaintList();
}
function toggleTriggerSelectShowUsed(){
  state.triggerSelectShowUsed = !state.triggerSelectShowUsed;
  state.triggerSelectActive = 0;
  triggerSelectPaintList();
  document.getElementById("trigger-select-search")?.focus();
}
function goToTriggerOwner(surveyId){
  if(!surveyId) return;
  state.triggerSelectOpen = false;
  state.triggerSelectQuery = "";
  state.triggerSelectShowUsed = false;
  go("#/surveys/"+surveyId);
}
function triggerSelectTaken(id){
  const owner = triggerOwner(id, currentSurvey()?.id);
  toast(owner
    ? `Already linked to ${owner.name}. Clear or change that survey first.`
    : "That trigger is already in use.");
}
function triggerSelectPick(id){
  const s = currentSurvey();
  if(!s) return;
  if(isSurveyLocked(s)){ toast("This version is locked."); return; }
  const next = String(id||"").replace(/^#/,"");
  const def = findTriggerDef(next);
  if(!def || def.patientSurvey===false){
    toast("That trigger isn’t available for patient surveys.");
    return;
  }
  const owner = triggerOwner(next, s.id);
  if(owner){
    triggerSelectTaken(next);
    return;
  }
  s.triggerId = next;
  s.updated = NOW;
  state.triggerSelectOpen = false;
  state.triggerSelectQuery = "";
  state.triggerSelectShowUsed = false;
  toast("Trigger linked.", true);
  render();
}
function clearSurveyTrigger(id){
  const s = state.surveys.find(x=>x.id===id) || currentSurvey();
  if(!s || isSurveyLocked(s)) return;
  s.triggerId = null;
  s.updated = NOW;
  state.triggerSelectOpen = false;
  state.triggerSelectShowUsed = false;
  render();
}
function triggerSelectSearchKey(e){
  if(e.key==="Escape"){
    e.preventDefault();
    e.stopPropagation();
    state.triggerSelectOpen = false;
    state.triggerSelectShowUsed = false;
    triggerSelectPaint();
    return;
  }
  if(e.key==="ArrowDown" || e.key==="ArrowUp" || e.key==="Home" || e.key==="End" || e.key==="Enter"){
    triggerSelectKey(e);
  }
}
function triggerSelectKey(e){
  const open = !!state.triggerSelectOpen;
  const rows = triggerSelectFiltered();
  const n = rows.length;
  if(e.key==="Escape"){
    if(open){
      e.preventDefault();
      state.triggerSelectOpen = false;
      state.triggerSelectShowUsed = false;
      triggerSelectPaint();
    }
    return;
  }
  if(e.key==="ArrowDown" || e.key==="ArrowUp"){
    e.preventDefault();
    if(!open){ triggerSelectToggle(e); return; }
    if(!n) return;
    const delta = e.key==="ArrowDown" ? 1 : -1;
    state.triggerSelectActive = (state.triggerSelectActive + delta + n) % n;
    triggerSelectPaintList();
    return;
  }
  if(e.key==="Home" || e.key==="End"){
    if(!open || !n) return;
    e.preventDefault();
    state.triggerSelectActive = e.key==="Home" ? 0 : n-1;
    triggerSelectPaintList();
    return;
  }
  if((e.key==="Enter" || e.key===" ") && open){
    e.preventDefault();
    if(!n) return;
    const row = rows[state.triggerSelectActive];
    if(!row) return;
    if(triggerOwner(row.id, currentSurvey()?.id)) triggerSelectTaken(row.id);
    else triggerSelectPick(row.id);
  }
}
function publishSurvey(id){
  const s = state.surveys.find(x=>x.id===id);
  if(!s) return;
  if(isSurveyLocked(s)){
    toast("This version is locked. Duplicate & edit to make changes.");
    return;
  }
  if(!s.triggerId || !findTriggerDef(s.triggerId)){
    toast("Choose a trigger before publishing.");
    state.triggerSelectOpen = true;
    state.triggerSelectQuery = "";
    state.triggerSelectShowUsed = false;
    state.triggerSelectActive = 0;
    render();
    requestAnimationFrame(()=>{
      document.getElementById("trigger-select-search")?.focus()
        || document.getElementById("trigger-select-trigger")?.focus();
      document.querySelector(".trigger-assoc")?.scrollIntoView({block:"nearest", behavior:"smooth"});
    });
    return;
  }
  const owner = triggerOwner(s.triggerId, s.id);
  if(owner){
    toast(`Trigger already linked to ${owner.name}.`);
    return;
  }
  const sch = s.schedule || defaultSchedule();
  if(sch.mode==="duration" && !(Number(sch.durationDays)>0)){
    toast("Enter how many days this survey should run.");
    return;
  }
  if(sch.mode==="range"){
    if(!sch.endAt){
      toast("Choose an end date before publishing.");
      return;
    }
    const start = sch.startAt || NOW;
    if(sch.endAt.getTime() <= start.getTime()){
      toast("End date must be after the start date.");
      return;
    }
  }
  s.publishedAt = NOW;
  s.endsAt = resolveEndsAt(sch, s.publishedAt);
  s.stoppedAt = null;
  s.status = "Live";
  s.updated = NOW;
  state.triggerSelectOpen = false;
  state.triggerSelectShowUsed = false;
  toast(s.endsAt
    ? `Published. Collecting through ${day(s.endsAt)}.`
    : "Published. This survey is now live.", true);
  render();
}
function setSurveyScheduleMode(id, mode){
  const s = state.surveys.find(x=>x.id===id);
  if(!s || isSurveyLocked(s)) return;
  if(!s.schedule) s.schedule = defaultSchedule();
  s.schedule.mode = mode==="duration"||mode==="range" ? mode : "ongoing";
  if(s.schedule.mode==="range" && !s.schedule.startAt){
    s.schedule.startAt = localToday();
  }
  s.updated = NOW;
  state.scheduleDurationOpen = false;
  render();
}
function setSurveyDurationDays(id, value){
  const s = state.surveys.find(x=>x.id===id);
  if(!s || isSurveyLocked(s)) return;
  if(!s.schedule) s.schedule = defaultSchedule();
  state.scheduleDurationOpen = false;
  s.schedule.durationDays = Math.max(1, parseInt(value,10)||30);
  s.updated = NOW;
  render();
}
function setSurveyScheduleDate(id, field, value){
  const s = state.surveys.find(x=>x.id===id);
  if(!s || isSurveyLocked(s)) return;
  if(!s.schedule) s.schedule = defaultSchedule();
  s.schedule[field] = parseDateInput(value);
  s.updated = NOW;
  render();
}

function confirmStopSurvey(andClone){
  const id = state.stopSurvey;
  if(!id) return;
  const s = state.surveys.find(x=>x.id===id);
  if(!s || s.status!=="Live"){ closeStopSurvey(); return; }
  const freedTrigger = releaseSurveyTrigger(s);
  s.status = "Stopped";
  s.stoppedAt = NOW;
  s.updated = NOW;

  }

  render();
}

const RESPONSE_PAGE = 11;

function questionLabel(q){
  const t = q.text || "";
  if(/call you/i.test(t)) return "Wants a call";
  if(/recommend/i.test(t)) return "Recommend us";
  if(/how well did we do/i.test(t)) return "Care quality";
  if(/listen(?:ed)? to why you didn/i.test(t)) return "Listened about staying";
  if(/feel listened/i.test(t)) return "Felt listened to";
  if(/cared for/i.test(t)) return "Felt cared for";
  if(/do well|did well/i.test(t)) return "What we did well";
  if(/done better|do better/i.test(t)) return "What we could do better";
  if(/if you stayed/i.test(t)) return "Explained staying risks";
  if(/how safe/i.test(t)) return "Feel safe calling 911";
  if(/trust our crews/i.test(t)) return "Trust crews to be respectful";
  if(/when to call 911/i.test(t)) return "Know when to call 911";
  if(/used our service/i.test(t)) return "Used us in the last year";
  if(/language a barrier/i.test(t)) return "Language is a barrier";
  if(/community'?s EMS do well/i.test(t)) return "What EMS does well";
  if(/should we do better/i.test(t)) return "What we should do better";
  if(t.length<=56) return t;
  const cut = t.lastIndexOf(" ", 53);
  return t.slice(0, cut>20?cut:53) + "…";
}
function responseWantsCall(r, qs){
  const q = qs.find(x=>x.type==="yesno" && /call you/i.test(x.text));
  return !!(q && String(r.answers[q.id]||"").toLowerCase()==="yes");
}
function isNegativeAnswer(q, v){
  if(v===undefined || v==="") return false;
  const s = String(v).toLowerCase();
  if(q.type==="yesno"){
    if(/call you/i.test(q.text)) return false;
    if(/barrier|unsafe/i.test(q.text)) return s==="yes";
    return s==="no";
  }
  if(q.type==="choice"){
    const opts = q.options || [];
    const idx = opts.findIndex(o=>o===v);
    if(idx<0) return /poor|unacceptable|not likely|definitely not|unsafe/i.test(s);
    if(opts.length>=5) return idx>=opts.length-2;
    if(opts.length>=4) return idx>=opts.length-1;
    return false;
  }
  return false;
}
function responseQuote(r, qs){
  const texts = qs.filter(q=>q.type==="text" && r.answers[q.id]);
  const better = texts.find(q=>/better/i.test(q.text));
  if(better) return String(r.answers[better.id]);
  const other = texts.find(q=>!/do well|did well/i.test(q.text));
  if(other) return String(r.answers[other.id]);
  return texts[0] ? String(r.answers[texts[0].id]) : "";
}
function responseExcerpt(r, qs){
  const quote = responseQuote(r, qs);
  if(quote) return quote;
  const negatives = qs.filter(q=>isNegativeAnswer(q, r.answers[q.id]));
  if(negatives.length){
    return negatives.map(q=>`${questionLabel(q)}: ${r.answers[q.id]}`).join(" · ");
  }
  if(responseWantsCall(r, qs)) return "Asked for a call";
  const first = qs.find(q=>r.answers[q.id]);
  if(first) return `${questionLabel(first)}: ${r.answers[first.id]}`;
  return "No answers";
}
function responseTitle(r, qs, alert){
  if(alert) return alert.reason;
  if(responseWantsCall(r, qs)) return "Asked for a call";
  return "Survey response";
}
function loadedResponses(id){
  return responsesFor(id).slice().sort((a,b)=>b.at-a.at);
}
function filteredResponses(id, qs){
  const loaded = loadedResponses(id);
  if(state.responseFilter==="flagged") return loaded.filter(r=>r.alert);
  if(state.responseFilter==="callback") return loaded.filter(r=>responseWantsCall(r, qs));
  return loaded;
}
function setResponseFilter(f){
  state.responseFilter = f;
  state.responseLimit = RESPONSE_PAGE;
  render();
}
function showOlderResponses(){
  state.responseLimit += RESPONSE_PAGE;
  render();
}
function responseNeighbors(ref){
  const qs = state.surveyQuestions[ref.surveyId] || [];
  const list = filteredResponses(ref.surveyId, qs).slice(0, state.responseLimit);
  const i = list.findIndex(x=>x.id===ref.id);
  return {
    prev: i>0 ? list[i-1] : null,
    next: i>=0 && i<list.length-1 ? list[i+1] : null,
    index: i,
    total: list.length
  };
}
function focusResponseDrawer(){
  const drawer = document.querySelector(".drawer--response");
  if(!drawer) return;
  const back = drawer.querySelector(".drawer-back");
  const close = drawer.querySelector(".drawer-x");
  if(back && getComputedStyle(back).display!=="none") back.focus();
  else if(close) close.focus();
}

function viewSurveyResponses(){
  const s = currentSurvey();
  if(!s) return viewSurveysIndex();
  const qs = qList();
  const loaded = loadedResponses(s.id);
  const flaggedN = loaded.filter(r=>r.alert).length;
  const callN = loaded.filter(r=>responseWantsCall(r, qs)).length;
  const filtered = filteredResponses(s.id, qs);
  const visible = filtered.slice(0, state.responseLimit);
  const total = s.responses;
  const hasMoreLoaded = filtered.length > visible.length;
  const hasMoreProduct = state.responseFilter==="all" && loaded.length < total;
  const filter = state.responseFilter;
  const subtitle = !total ? "None collected yet"
    : filter==="flagged" ? `${filtered.length} flagged`
    : filter==="callback" ? `${filtered.length} asked for a call`
    : (visible.length<total ? `${visible.length} of ${total}` : `${total} collected`);
  const tabs = [
    ["all","All", loaded.length],
    ["flagged","Flagged", flaggedN],
    ["callback","Call", callN]
  ];
  const emptyFilter = loaded.length && !visible.length;
  return `
  <div class="page-head">
    <div class="crumbs"><a href="#/">Overview</a><span class="sep">/</span><a href="#/surveys">Surveys</a>
      <span class="sep">/</span><a href="#/surveys/${s.id}">${esc(s.name)}</a>
      <span class="sep">/</span><span>Responses</span></div>
    <a class="page-back" href="#/surveys/${s.id}">${I.chevronLeft(16)} ${esc(s.name)}</a>
    <div class="between">
      <div>
        <h1 class="t-h2">Responses</h1>
        ${total?`<p class="t-p dim">${subtitle}</p>`:""}
      </div>
    </div>
    ${loaded.length?`<div class="seg rs-filters" role="group" aria-label="Filter responses">
      ${tabs.map(([k,l,n])=>`<button aria-pressed="${filter===k}" aria-label="${k==="callback"?"Wants a call":l}, ${n}" onclick="setResponseFilter('${k}')">${l} (${n})</button>`).join("")}
    </div>`:""}
  </div>
  ${visible.length?`<div class="fw-card fw-card-flush">
    <div class="tbl-inset">
    <table class="tbl tbl--stack tbl--responses">
      <thead><tr><th>What they said</th><th>Status</th><th>When</th><th>Area</th><th>Language</th></tr></thead>
      <tbody>
        ${visible.map(r=>{
          const excerpt = responseExcerpt(r, qs);
          const call = responseWantsCall(r, qs);
          const alert = r.alert && state.alerts.find(a=>a.id===r.alert);
          const meta = [ago(r.at), r.zone, r.band, r.lang].filter(Boolean).join(" · ");
          return `
          <tr id="row-${r.id}">
            <td class="rs-quote">
              <a class="rs-excerpt" href="#/surveys/${esc(s.id)}/responses"
                onclick="event.preventDefault(); openResponse('${esc(s.id)}','${esc(r.id)}')">${esc(excerpt)}</a>
              ${call && excerpt!=="Asked for a call"?`<div class="rs-call t-detail">${I.phone(12)} Asked for a call</div>`:""}
            </td>
            <td class="rs-flags">${alert?statusBadge(alert.status):""}</td>
            <td class="dim rs-when" style="white-space:nowrap">${ago(r.at)}</td>
            <td class="rs-area">${esc(r.zone||"—")}<div class="t-detail dim">${esc(r.band||"")}</div></td>
            <td class="dim rs-lang">${esc(r.lang||"—")}</td>
            <td class="rs-meta">${esc(meta)}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
    </div>
    ${hasMoreLoaded?`<div class="rs-more">
      <button class="fw-btn fw-btn--outline" type="button" onclick="showOlderResponses()">Show older</button>
    </div>`: hasMoreProduct?`<p class="t-detail dim rs-more">Showing the ${visible.length} most recent. Older responses aren't in this prototype.</p>`:""}
  </div>`: emptyFilter?`<div class="fw-card empty">
      <div class="dim" style="display:flex;justify-content:center;margin-bottom:12px">${I.inbox(32)}</div>
      <div class="t">No matches.</div>
      <div class="s t-p">${filter==="flagged"
        ? "Nothing in this set is flagged."
        : "Nobody in this set asked for a call."}</div>
    </div>`:`
    <div class="fw-card empty">
      <div class="dim" style="display:flex;justify-content:center;margin-bottom:12px">${I.inbox(32)}</div>
      <div class="t">No responses yet.</div>
      <div class="s t-p">${s.status==="Draft"

function responseDrawer(ref){
  const s = state.surveys.find(x=>x.id===ref.surveyId);
  const r = responsesFor(ref.surveyId).find(x=>x.id===ref.id);
  if(!s || !r) return "";
  const qs = state.surveyQuestions[ref.surveyId] || [];
  const alert = r.alert && state.alerts.find(a=>a.id===r.alert);
  const call = responseWantsCall(r, qs);
  const quote = responseQuote(r, qs);
  const title = responseTitle(r, qs, alert);
  const meta = [ago(r.at), r.zone, r.band, r.lang].filter(Boolean).join(" · ");
  const badge = alert
    ? statusBadge(alert.status)
    : (call
      ? `<span class="fw-badge fw-badge--outline">${I.phone(12)} Asked for a call</span>`
      : `<span class="fw-badge fw-badge--outline">Response</span>`);
  const nav = responseNeighbors(ref);
  return `
  <div class="scrim" onclick="closeResponse()"></div>
  <aside class="drawer drawer--response${isResponsePaging()?" is-open is-paging":""}" role="dialog" aria-modal="true" aria-labelledby="response-title">
    <div class="drawer-head">
      <div>
        <button type="button" class="drawer-back" onclick="closeResponse()">${I.chevronLeft(16)} Responses</button>
        ${badge}
        <h2 class="t-h4 mt8" id="response-title">${esc(title)}</h2>
        <p class="t-subtle dim">${esc(meta)}</p>
      </div>
      <button class="iconbtn drawer-x" onclick="closeResponse()" aria-label="Close">${I.x(18)}</button>
    </div>
    <div class="drawer-body">
      ${alert?`<div class="stale">
        ${I.flag(16)} Flagged as ${alert.status==="resolved"?"followed up":alert.status}.${call?" They asked for a call.":""}
        <button class="fw-btn fw-btn--primary fw-btn--sm stale__action" type="button" onclick="openAlertFromResponse('${alert.id}')">Open alert</button>
      </div>`: call?`<div class="stale">${I.phone(16)} They asked for a call.</div>`:""}
      ${quote?`<div class="quote">“${esc(quote)}”</div>`:""}
      <div class="${quote||alert||call?"mt24":""}">
        ${qs.filter(q=>!(quote && String(r.answers[q.id]||"")===quote)).map(q=>{
          const v = r.answers[q.id];
          const empty = v===undefined || v==="";
          return `<div class="ans">
            <div class="t-subtle dim">${esc(questionLabel(q))}</div>
            <div class="t-pui" style="font-weight:700;margin-top:4px">${empty?`<span class="dim">Skipped</span>`:esc(String(v))}</div>
          </div>`;
        }).join("")}
      </div>
    </div>
    ${nav.total>1?`<div class="drawer-foot">
      <button class="fw-btn fw-btn--outline drawer-prev" type="button" ${nav.prev?"":"disabled"}
        onclick="openResponseNeighbor('prev')">${I.chevronLeft(16)} Previous</button>
      <span class="drawer-pos" aria-live="polite">${nav.index+1} of ${nav.total}</span>
      <button class="fw-btn fw-btn--outline drawer-next" type="button" ${nav.next?"":"disabled"}
        onclick="openResponseNeighbor('next')">Next ${I.chevronRight(16)}</button>
    </div>`:""}
  </aside>`;
}
function openResponse(surveyId, id){
  state.openResponse = { surveyId, id };
  render();
  requestAnimationFrame(focusResponseDrawer);
}
function openResponseNeighbor(dir){
  const ref = state.openResponse;
  if(!ref) return;
  const nav = responseNeighbors(ref);
  const target = dir==="next" ? nav.next : nav.prev;
  if(!target) return;
  state.openResponse = { surveyId: ref.surveyId, id: target.id };
  render();
  requestAnimationFrame(()=>{
    const body = document.querySelector(".drawer--response .drawer-body");
    if(body) body.scrollTop = 0;
    const sel = dir==="next" ? ".drawer-next" : ".drawer-prev";
    const btn = document.querySelector(sel);
    if(btn && !btn.disabled) btn.focus();
    else focusResponseDrawer();
  });
}
function closeResponse(){
  const id = state.openResponse && state.openResponse.id;
  state.openResponse = null;
  render();
  requestAnimationFrame(()=>{
    const link = id && document.querySelector("#row-"+CSS.escape(id)+" .rs-excerpt");
    if(link) link.focus();
  });
}
function openAlertFromResponse(id){
  state.openResponse = null;
  state.openAlert = id;
  render();
}

  const pack = P_UI[pLocale()] || P_UI.en;
  let s = pack[key] ?? P_UI.en[key] ?? key;
  if(vars){
    Object.keys(vars).forEach(k=>{
      s = s.replace(new RegExp("\\{"+k+"\\}","g"), String(vars[k]));

  }
  return s;
}

  if(!text) return text;

  return (P_TEXT_I18N[loc] && P_TEXT_I18N[loc][text]) || text;
}

  if(opt==null || opt==="") return opt;

  return (P_OPT_I18N[loc] && P_OPT_I18N[loc][opt]) || opt;

  const val = state.survey.demo[key] || "";
  const open = state.pSelectOpen===key;
  const active = Math.min(values.length-1, Math.max(0, state.pSelectActive|0));
  const blank = pT("preferNot");
  const shown = val ? pTo(val) : blank;
  const label = pT(spec.labelKey);
  return `<div class="fw-field p-fieldset">
    <span class="fw-label" id="${spec.id}-label">${esc(label)}</span>
    <div class="fw-select${open?" is-open":""}">
      <button type="button" class="fw-select__trigger" id="${spec.id}"
        aria-haspopup="listbox" aria-expanded="${open}"
        aria-labelledby="${spec.id}-label ${spec.id}"
        aria-controls="${spec.id}-list"
        ${open?`aria-activedescendant="${spec.id}-opt-${active}"`:""}
        onclick="pSelectToggle('${key}',event)"
        onkeydown="pSelectKey('${key}',event)">${esc(shown)}</button>
      <span class="fw-select__chevron">${I.down(16)}</span>
      ${open?`<div class="fw-select__menu" id="${spec.id}-list" role="listbox" aria-labelledby="${spec.id}-label">
        ${values.map((o,i)=>{
          const selected = val===o;
          const labelOpt = o ? pTo(o) : blank;
          return `<div class="fw-select__opt" role="option" id="${spec.id}-opt-${i}"
            data-value="${esc(o)}" aria-selected="${selected}"${i===active?" data-active":""}
            onmousedown="event.preventDefault()"
            onclick="pSelectPick('${key}',this)">${esc(labelOpt)}${selected?I.check(16):""}</div>`;
        }).join("")}
      </div>`:""}
    </div>
  </div>`;
}
function pProgress(total, idx){
  return `<div class="p-progress" role="progressbar" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${Math.min(idx+1,total)}">
    ${Array.from({length:total},(_,i)=>`<i class="${i<idx?"done":i===idx?"now":""}"></i>`).join("")}
  </div>`;
}
function pChoice(labelHtml, {pressed=false, onclick}={}){
  if(onclick){
    return `<button type="button" class="p-opt" aria-pressed="${pressed}" onclick="${onclick}">
      <span class="p-tick" aria-hidden="true"></span>${labelHtml}</button>`;
  }
  return `<div class="p-opt"><span class="p-tick" aria-hidden="true"></span>${labelHtml}</div>`;
}
function pQuestionHead(q, idx, total){
  const opt = q.required ? "" : `<div class="p-step"><span class="fw-badge fw-badge--secondary">${esc(pT("optional"))}</span></div>`;
  return `${pProgress(total, idx)}${opt}
    <h1 class="t-h3${opt?" mt8":""}">${esc(pTx(q.text))}</h1>
    ${q.help?`<p class="t-body dim mt8">${esc(pTx(q.help))}</p>`:""}`;
}
function pQuestionFields(q, {interactive=false, val}={}){
  const group = interactive ? "radiogroup" : "group";
  const aria = esc(pTx(q.text));
  if(q.type==="yesno"){
    return `<div class="p-opts" role="${group}" aria-label="${aria}">
      ${[["Yes",pT("yes")],["No",pT("no")]].map(([value,label])=>pChoice(esc(label),{
        pressed: interactive && val===value,
        onclick: interactive ? `pAnswer('${q.id}','${value}',this)` : null
      })).join("")}
    </div>`;
  }
  if(q.type==="choice"){
    return `<div class="p-opts" role="${group}" aria-label="${aria}">
      ${(q.options||[]).map(o=>pChoice(esc(pTo(o)),{
        pressed: interactive && val===o,
        onclick: interactive ? `pAnswer('${q.id}',${esc(JSON.stringify(o))},this)` : null
      })).join("")}
    </div>`;
  }
  if(q.type==="scale"){
    const tag = interactive ? "button" : "div";
    return `<div class="p-scale" role="${group}" aria-label="${aria}">
      ${[1,2,3,4,5].map(n=>{
        const on = interactive && Number(val)===n;
        const attrs = interactive
          ? `type="button" aria-pressed="${on}" onclick="pAnswer('${q.id}',${n},this)"`
          : "";
        const raw = (q.labels && q.labels[n-1]) || "";
        const label = raw ? `<span>${esc(pTo(raw))}</span>` : "";
        return `<${tag} class="p-scale-btn" ${attrs}>${n}${label}</${tag}>`;
      }).join("")}
    </div>`;
  }
  return `<div class="p-fields">
    <textarea class="fw-input fw-textarea"${interactive?` id="ptext" maxlength="600" oninput="pText('${q.id}',this.value)"`:` readonly tabindex="-1"`} placeholder="${esc(pT("textPlaceholder"))}">${interactive&&val?esc(val):""}</textarea>
    ${interactive?`<p class="t-detail dim p-count">${esc(pT("charCount",{n:(val||"").length}))}</p>`:""}
  </div>`;
}

function patientPreview(){
  const qs = qList();
  const idx = previewQIndex();
  const q = idx>=0 ? qs[idx] : null;
  if(!q){
    return `<div class="patient patient--embed" lang="${esc(pLocale())}">
      <div class="p-wrap">
        ${pLangSwitch()}
        <div class="p-card">
          <p class="t-body dim">${esc(pT("previewEmpty"))}</p>
        </div>
      </div>
    </div>`;
  }
  return `<div class="patient patient--embed" lang="${esc(pLocale())}">
    <div class="p-wrap">
      ${pLangSwitch()}
      <div class="p-card">
        ${pQuestionHead(q, idx, qs.length)}
        ${pQuestionFields(q)}
      </div>
    </div>
  </div>`;
}

function viewPatient(){
  const S = state.survey, qs = qList();
  const total = qs.length;
  const agency = AGENCY.name;

  /* intro */
  if(S.step === -1 || S.step === undefined) S.step = -1;
  if(S.step === -1){
    return `<div class="patient" lang="${esc(pLocale())}"><div class="p-wrap">
      ${pDemoBar()}
      ${pLangSwitch()}
      ${pViewTag()}
        <div class="p-lock">${I.lock(12)} ${esc(pT("private",{agency}))}</div>
        <div class="p-card">
          <h1 class="t-h2">${esc(pT("introTitle",{agency}))}</h1>
          <p class="t-body dim mt16">${esc(pT("introBody",{n:total}))}</p>
          <div class="fw-alert fw-alert--info mt16">
            <span class="fw-alert__icon">${I.shield(20)}</span>
            <p class="fw-alert__desc">${esc(pT("introAlert"))}</p>
          </div>
          <div class="p-actions">
            <div class="p-cta">
              <button class="fw-btn fw-btn--primary fw-btn--lg p-next" onclick="pStart()">${esc(pT("start"))}</button>
            </div>
          </div>
        </div>
        <p class="p-foot">${esc(pT("footRef",{agency, ref:"9F3C1A"}))}</p>
      </div>
    </div></div>`;
  }

  /* demographics */
  if(S.step === total){
    return `<div class="patient" lang="${esc(pLocale())}"><div class="p-wrap">
      ${pDemoBar()}
      ${pLangSwitch()}
      ${pViewTag()}
        <div class="p-lock">${I.lock(12)} ${esc(pT("private",{agency}))}</div>
        <div class="p-card">
          ${pProgress(total, total)}
          <div class="p-step">
            <span class="fw-badge fw-badge--secondary">${esc(pT("optional"))}</span>
          </div>
          <h1 class="t-h3 mt8">${esc(pT("demoTitle"))}</h1>
          <p class="t-body dim mt8">${esc(pT("demoBody"))}</p>

          ${pSelectField("age")}
          ${pSelectField("lang")}
          ${pSelectField("eth")}

          <div class="p-actions">
            <div class="p-cta">
              <button class="fw-btn fw-btn--primary fw-btn--lg p-next" onclick="pFinish()">${esc(pT("send"))}</button>
              <button class="fw-btn fw-btn--link p-back" onclick="pBack()">${esc(pT("back"))}</button>
            </div>
          </div>
        </div>
        <p class="p-foot">${esc(pT("foot",{agency}))}</p>
      </div>
    </div></div>`;
  }

  /* done */
  if(S.step === total+1){
    const low = Object.entries(S.answers).some(([k,v])=>{
      if(k==="q1") return v==="Poor" || v==="Unacceptable";
      if(k==="q2") return v==="Not likely" || v==="Definitely not likely";
      if(k==="q3" || k==="q4") return v==="No";
      return false;
    });
    return `<div class="patient" lang="${esc(pLocale())}"><div class="p-wrap">
      ${pDemoBar()}
      ${pLangSwitch()}
      ${pViewTag()}
        <div class="p-card p-done">
          <div class="p-seal">${I.check(22)}</div>
          <h1 class="t-h2">${esc(pT("thanksTitle"))}</h1>
          <p class="t-body dim mt16">${esc(pT("thanksBody",{agency}))}</p>
          ${low?`<div class="fw-alert fw-alert--warning mt16" style="text-align:left">
            <span class="fw-alert__icon">${I.info(20)}</span>
            <p class="fw-alert__desc">${esc(pT("thanksLow"))}</p>
          </div>`:`<div class="fw-alert fw-alert--info mt16" style="text-align:left">
            <span class="fw-alert__icon">${I.info(20)}</span>
            <p class="fw-alert__desc">${esc(pT("thanksOk"))}</p>
          </div>`}
        </div>
        <p class="p-foot">${esc(pT("closePage"))}</p>
      </div>
    </div></div>`;
  }

  /* questions */
  const q = qs[S.step];
  const val = S.answers[q.id];
  const answered = val !== undefined && val !== "";

  return `<div class="patient" lang="${esc(pLocale())}"><div class="p-wrap">
    ${pDemoBar()}
    ${pLangSwitch()}
    ${pViewTag()}
      <div class="p-lock">${I.lock(12)} ${esc(pT("private",{agency}))}</div>
      <div class="p-card">
        ${pQuestionHead(q, S.step, total)}
        ${pQuestionFields(q, {interactive:true, val})}
        <div class="p-actions">
          <div class="p-cta">
            <button class="fw-btn fw-btn--primary fw-btn--lg p-next" ${q.required&&!answered?"disabled":""} onclick="pNext()">
              ${esc(S.step===total-1?pT("almostDone"):pT("next"))}</button>
            ${S.step>0?`<button class="fw-btn fw-btn--link p-back" onclick="pBack()">${esc(pT("back"))}</button>`:""}
          </div>
          ${q.required?"":`<button class="fw-btn fw-btn--ghost" onclick="pSkip()">${esc(pT("skip"))}</button>`}
        </div>
        ${q.required&&!answered?`<p class="t-body dim mt16" data-need-answer>${esc(pT("needAnswer"))}</p>`:""}
      </div>
      <p class="p-foot">${esc(pT("foot",{agency}))}</p>
    </div>
  </div></div>`;
}

</script>
<script>
/* ============================================================
   9. ACTIONS
   ============================================================ */
function go(h){ location.hash = h; }
function prefersReduce(){
  return matchMedia("(prefers-reduced-motion: reduce)").matches;
}
function drawerKey(){
  if(state.openResponse) return `r:${state.openResponse.surveyId}:${state.openResponse.id}`;
  if(state.openAlert) return `a:${state.openAlert}`;
  if(state.openTrigger) return `t:${state.openTrigger}`;
  return null;
}
function isResponsePaging(){
  const prev = state.drawerKey;
  const key = drawerKey();
  return !!(prev && key && prev.startsWith("r:") && key.startsWith("r:") &&
    prev.split(":")[1]===key.split(":")[1] && prev!==key);
}
function armDrawer(){
  const el = document.querySelector(".drawer");
  const key = drawerKey();
  if(!el || !key){
    state.drawerKey = null;
    return;
  }
  const prev = state.drawerKey;
  const same = prev === key;
  const paging = isResponsePaging();
  state.drawerKey = key;
  if(same || prefersReduce() || paging){
    el.classList.toggle("is-paging", !!paging);
    el.classList.add("is-open");
    return;
  }
  el.classList.remove("is-paging");
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const live = document.querySelector(".drawer");
      if(live) live.classList.add("is-open");
    });
  });
}
function withViewTransition(fn){
  if(typeof document.startViewTransition==="function" && !prefersReduce()){
    return document.startViewTransition(fn);
  }
  fn();
  return null;
}
function afterViewTransition(vt, fn){
  if(vt && vt.finished) vt.finished.then(fn, fn);
  else requestAnimationFrame(fn);
}
function withFlip(sel, mutate){
  if(prefersReduce()){ mutate(); return; }
  const first = new Map();
  document.querySelectorAll(sel).forEach(el=>{
    first.set(el.getAttribute("data-qid"), el.getBoundingClientRect());
  });
  mutate();
  document.querySelectorAll(sel).forEach(el=>{
    const id = el.getAttribute("data-qid");
    const prev = first.get(id);
    const last = el.getBoundingClientRect();
    if(!prev){ el.classList.add("qcard-in"); return; }
    const dy = prev.top - last.top;
    if(Math.abs(dy)<1) return;
    el.animate(
      [{transform:`translateY(${dy}px)`},{transform:"translateY(0)"}],
      {duration:180, easing:"cubic-bezier(.16,1,.3,1)"}
    );
  });
}
function dismissStale(){ state.hideStale = true; render(); }
function syncNavDom(){
  const open = !!state.navOpen;
  document.body.classList.toggle("nav-open", open);
  const drawer = document.getElementById("app-nav");
  const scrim = document.querySelector(".nav-scrim");
  const btn = document.querySelector(".nav-toggle");
  if(drawer){
    drawer.classList.toggle("is-open", open);
    drawer.setAttribute("aria-hidden", open ? "false" : "true");
    if(open) drawer.removeAttribute("inert");
    else drawer.setAttribute("inert", "");
  }
  if(scrim) scrim.classList.toggle("is-open", open);
  if(btn){
    btn.setAttribute("aria-expanded", String(open));
    btn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    btn.innerHTML = open ? I.x(20) : I.menu(20);
  }
}
function toggleNav(){
  state.navOpen = !state.navOpen;
  syncNavDom();
}
function closeNav(){
  if(!state.navOpen) return;
  state.navOpen = false;
  syncNavDom();
}
function onNavLink(h){
  const cur = location.hash || "#/";
  const same = h==="#/surveys" ? cur.startsWith("#/surveys") : cur===h;
  closeNav();
  if(same){ scrollPageTop(); return; }
}
function toggleTheme(){
  state.theme = state.theme==="light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", state.theme);
  withViewTransition(()=>render());
}
let toastTimer;
function toast(msg, alreadyRendered){
  state.toast = msg;
  if(!alreadyRendered) render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    state.toast=null;
    render();
    state.scrollPreserve = null;
  }, 2600);
}

/* Keep the Question library in view after a full re-render inserts a card above it. */
function captureLibScroll(libId){
  const el = document.querySelector(`[data-lib-id="${libId}"]`);
  const list = document.querySelector(".lib-list");
  const anchor = el || list;
  state.scrollPreserve = {
    libId,
    anchorTop: anchor ? anchor.getBoundingClientRect().top : null,
    libScroll: list ? list.scrollTop : 0
  };
}
function restoreLibScroll(){
  const sp = state.scrollPreserve;
  if(!sp || sp.anchorTop == null) return;
  const apply = ()=>{
    if(state.scrollPreserve !== sp) return;
    const el = document.querySelector(`[data-lib-id="${sp.libId}"]`) || document.querySelector(".lib-list");
    if(!el) return;
    const delta = el.getBoundingClientRect().top - sp.anchorTop;
    if(Math.abs(delta) > 0.5) window.scrollBy(0, delta);
    const list = document.querySelector(".lib-list");
    if(list) list.scrollTop = sp.libScroll;
  };
  apply();
  requestAnimationFrame(apply);
}

function blinkSend(id){
  state.blinkSent[id] = true;
  toast("Sent to Blink feed.");
}

function openAlert(id){ state.openAlert = id; render(); }
function openResponseFromAlert(surveyId, id){
  state.openAlert = null;
  state.openTrigger = null;
  openResponse(surveyId, id);
}
function closeAlert(){
  const id = state.openAlert;
  state.openAlert = null;
  render();
  requestAnimationFrame(()=>{
    const btn = id && document.querySelector(`#row-${CSS.escape(id)} .al-reason`);
    if(btn) btn.focus();
  });
}

function noteFor(id){
  const el = document.getElementById("note-"+id);
  return el ? el.value.trim() : "";
}
function logOnly(id){
  const a = state.alerts.find(x=>x.id===id);
  const t = noteFor(id);
  if(!t){ toast("Add a note first, then log it."); return; }
  a.log.unshift({ who:"You", at:NOW, text:t });
  render(); toast("Logged.");
}
function logAndResolve(id){
  const a = state.alerts.find(x=>x.id===id);
  const t = noteFor(id);
  if(!t){ toast("Add a note before closing this out."); return; }
  a.log.unshift({ who:"You", at:NOW, text:t });
  a.status = "resolved";
  if(a.assigned==="Unassigned") a.assigned = "You";
  state.openAlert = null;
  const row = document.getElementById("row-"+id);
  if(row && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    row.classList.add("resolving");
    setTimeout(()=>{ render(); toast("Marked followed up."); }, 180);
  } else { render(); toast("Marked followed up."); }
}
function claim(id){
  const a = state.alerts.find(x=>x.id===id);
  a.assigned = "You"; render(); toast("Assigned to you.");
}

function moveQTo(from, to){
  if(isSurveyLocked(currentSurvey())){ toast("This version is locked."); return; }
  const q = qList();
  if(from===to || from<0 || to<0 || from>=q.length || to>=q.length) return;
  withFlip("[data-qid]", ()=>{
    const [item] = q.splice(from, 1);
    q.splice(to, 0, item);
    state.previewQId = item.id;
    render();
  });
}
function moveQ(i,d){ moveQTo(i, i+d); }
function qClearDropHints(except){
  document.querySelectorAll(".qcard.drop-before,.qcard.drop-after").forEach(el=>{
    if(el!==except) el.classList.remove("drop-before","drop-after");
  });
}
function qDragStart(e){
  if(isSurveyLocked(currentSurvey())){ e.preventDefault(); return; }
  const card = e.currentTarget.closest(".qcard");
  if(!card){ e.preventDefault(); return; }
  const id = card.getAttribute("data-qid");
  const dt = e.dataTransfer;
  if(dt){
    dt.setData("text/plain", id);
    dt.effectAllowed = "move";
    try{ dt.setDragImage(card, 24, 24); }catch(_){}
  }
  card.classList.add("is-dragging");
  state.dragQId = id;
}
function qDragEnter(e){ e.preventDefault(); }
function qDragOver(e){
  e.preventDefault();
  if(e.dataTransfer) e.dataTransfer.dropEffect = "move";
  const over = e.currentTarget;
  qClearDropHints(over);
  if(over.getAttribute("data-qid")===state.dragQId){
    over.classList.remove("drop-before","drop-after");
    return;
  }
  const mid = over.getBoundingClientRect();
  const after = e.clientY > mid.top + mid.height/2;
  over.classList.toggle("drop-after", after);
  over.classList.toggle("drop-before", !after);
}
function qDrop(e){
  e.preventDefault();
  const fromId = (e.dataTransfer && e.dataTransfer.getData("text/plain")) || state.dragQId;
  const over = e.currentTarget;
  const q = qList();
  const from = q.findIndex(x=>x.id===fromId);
  let to = q.findIndex(x=>x.id===over.getAttribute("data-qid"));
  if(from<0 || to<0) return;
  const box = over.getBoundingClientRect();
  if(e.clientY > box.top + box.height/2) to += 1;
  if(from < to) to -= 1;
  state.suppressQClick = true;
  moveQTo(from, to);
  requestAnimationFrame(()=>{ state.suppressQClick = false; });
}
function qDragEnd(){
  state.dragQId = null;
  document.querySelectorAll(".qcard").forEach(el=>{
    el.classList.remove("is-dragging","drop-before","drop-after");
  });
}
function removeQ(id){
  if(isSurveyLocked(currentSurvey())){ toast("This version is locked."); return; }
  const apply = ()=>{
    const sid = surveyIdFromHash() || "sv_post";
    const qs = qList();
    const i = qs.findIndex(q=>q.id===id);
    if(i<0) return;
    state.surveyQuestions[sid] = qs.filter(q=>q.id!==id);
    syncQuestionCount(sid);
    if(state.previewQId===id){
      const next = qs[i+1] || qs[i-1];
      state.previewQId = next ? next.id : null;
    }
    toast("Question removed.", true);
    withFlip("[data-qid]", render);
  };
  const card = document.querySelector(`[data-qid="${id}"]`);
  if(card && !prefersReduce() && !card.classList.contains("qcard-out")){
    card.classList.add("qcard-out");
    setTimeout(apply, 180);
  } else apply();
}
let qn = 100;
function addQ(type){
  if(isSurveyLocked(currentSurvey())){ toast("This version is locked."); return; }
  const id = "q"+(++qn);
  qList().push({
    id, type, required:false, locked:false,
    text:"Untitled question",
    options: type==="choice" ? ["Option one","Option two"] : undefined,
    labels:  type==="scale"  ? ["Poor","","","","Excellent"] : undefined
  });
  state.previewQId = id;
  syncQuestionCount(surveyIdFromHash() || "sv_post");
  toast("Question added.", true);
  withFlip("[data-qid]", render);
}
function addFromLib(id){
  if(isSurveyLocked(currentSurvey())){ toast("This version is locked."); return; }
  const l = LIBRARY.find(x=>x.id===id);
  if(!l) return;
  const already = qList().some(q=>q.text.trim().toLowerCase()===l.text.trim().toLowerCase());
  if(already){ toast("That question is already in this survey."); return; }
  captureLibScroll(id);
  const qid = "q"+(++qn);
  qList().push({
    id: qid,
    text: l.text,
    type: l.type,
    required: !!l.benchmark,
    locked: !!l.benchmark,
    lockNote: l.benchmark ? "Benchmark question — shared wording across participating agencies" : undefined,
    options: l.options ? [...l.options] : undefined,
    labels: l.type==="scale" ? ["Poor","","","","Excellent"] : undefined
  });
  state.previewQId = qid;
  syncQuestionCount(surveyIdFromHash() || "sv_post");
  toast("Added from library.", true);
  withFlip("[data-qid]", render);
}
function setLibraryFilter(f){
  state.libraryFilter = f;
  render();
}

let sn = 100;
function newSurvey(){
  const id = "sv_"+ (++sn);
  state.surveys.unshift(normalizeSurvey({
    id, name:"Untitled survey", status:"Draft", triggerId:null,
    familyId:id, version:1, clonedFromId:null,
    schedule:defaultSchedule(),
    publishedAt:null, endsAt:null, stoppedAt:null,
    questions:0, responses:0, rate:0, sent:0, starred:false, updated:NOW
  }));
  state.surveyQuestions[id] = [];
  state.responses[id] = [];
  go("#/surveys/"+id);
  toast("Draft created.");
}
function nextFamilyVersion(familyId){
  return state.surveys
    .filter(s=>s.familyId===familyId)
    .reduce((max,s)=>Math.max(max, Number(s.version)||1), 0) + 1;
}
function baseSurveyName(name){
  return String(name||"Survey").replace(/\s*\(v\d+\)\s*$/i,"").replace(/\s*\(copy\)\s*$/i,"").trim() || "Survey";
}

function duplicateAndEdit(id, { silent=false, claimTrigger=null }={}){
  const s = state.surveys.find(x=>x.id===id);
  if(!s) return null;
  const nid = "sv_"+ (++sn);
  const familyId = s.familyId || s.id;
  const version = nextFamilyVersion(familyId);
  const base = baseSurveyName(s.name);
  const copy = (state.surveyQuestions[id]||[]).map(q=>({
    ...q, id:"q"+(++qn),
    options: q.options ? [...q.options] : undefined,
    labels: q.labels ? [...q.labels] : undefined
  }));
  let triggerId = null;
  if(claimTrigger && !triggerOwner(claimTrigger, nid)){
    triggerId = String(claimTrigger).replace(/^#/,"");
  }
  state.surveys.unshift(normalizeSurvey({
    id:nid,
    name:`${base} (v${version})`,
    status:"Draft",
    triggerId,
    familyId,
    version,
    clonedFromId:s.id,
    schedule:cloneSchedule(s.schedule),
    publishedAt:null,
    endsAt:null,
    stoppedAt:null,
    questions:copy.length,
    responses:0,
    rate:0,
    sent:0,
    starred:false,
    updated:NOW
  }));
  state.surveyQuestions[nid] = copy;
  state.responses[nid] = [];
  state.surveyMenu = null;
  if(!silent){
    go("#/surveys/"+nid);
    toast("Draft created from prior version.");
  }
  return nid;
}

function pTurn(dir, mutate){
  if(state.pBusy) return;
  const view = document.querySelector(".preview-stage .p-view") || document.querySelector(".p-view");
  const jump = ()=>{
    const stage = document.querySelector(".preview-stage");
    if(stage) stage.scrollTop = 0;
    else window.scrollTo(0, 0);
  };
  const apply = ()=>{
    mutate();
    state.pSlide = dir;
    state.pSelectOpen = null;
    pPaint();
    jump();
    state.pBusy = false;
  };
  if(prefersReduce() || !view){ apply(); return; }
  state.pBusy = true;
  let done = false;
  const finish = ()=>{
    if(done) return;
    done = true;
    apply();
  };
  view.classList.remove("p-view--in-fwd","p-view--in-back");
  view.classList.add(dir==="back" ? "p-view--out-back" : "p-view--out-fwd");
  view.addEventListener("animationend", e=>{ if(e.target===view) finish(); }, {once:true});
  setTimeout(finish, 220);
}

function pSelectPaint(focusKey){
  Object.keys(P_DEMO).forEach(k=>{
    const btn = document.getElementById(P_DEMO[k].id);
    const field = btn && btn.closest(".fw-field");
    if(!field) return;
    const tpl = document.createElement("template");
    tpl.innerHTML = pSelectField(k).trim();
    field.replaceWith(tpl.content.firstElementChild);
  });
  if(focusKey) document.getElementById(P_DEMO[focusKey].id)?.focus();
  if(state.pSelectOpen) document.querySelector(".fw-select__opt[data-active]")?.scrollIntoView({block:"nearest"});
}
function pSelectToggle(key, e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  state.pSelectOpen = state.pSelectOpen===key ? null : key;
  if(state.pSelectOpen){
    const values = pSelectValues(key);
    const val = state.survey.demo[key] || "";
    const i = values.indexOf(val);
    state.pSelectActive = i<0 ? 0 : i;
  }
  pSelectPaint(key);
}
function pSelectPick(key, el){
  pDemo(key, el.getAttribute("data-value") || "");
  state.pSelectOpen = null;
  pSelectPaint(key);
}
function pSelectKey(key, e){
  const open = state.pSelectOpen===key;
  const values = pSelectValues(key);
  if(e.key==="Escape"){
    if(open){ e.preventDefault(); state.pSelectOpen = null; pSelectPaint(key); }
    return;
  }
  if(e.key==="ArrowDown" || e.key==="ArrowUp"){
    e.preventDefault();
    if(!open){ pSelectToggle(key, e); return; }
    const delta = e.key==="ArrowDown" ? 1 : -1;
    state.pSelectActive = (state.pSelectActive + delta + values.length) % values.length;
    pSelectPaint(key);
    return;
  }
  if(e.key==="Home" || e.key==="End"){
    if(!open) return;
    e.preventDefault();
    state.pSelectActive = e.key==="Home" ? 0 : values.length-1;
    pSelectPaint(key);
    return;
  }
  if((e.key==="Enter" || e.key===" ") && open){
    e.preventDefault();
    pDemo(key, values[state.pSelectActive] || "");
    state.pSelectOpen = null;
    pSelectPaint(key);
  }
}

function isPatientRoute(h){ return h.startsWith("#/s/") && !h.startsWith("#/surveys"); }

function render(){
  expireDueSurveys();
  const h = location.hash || "#/";
  state.route = h;
  const root = document.getElementById("root");
  const enter = !!state.routeEnter;
  state.routeEnter = false;
  document.documentElement.classList.toggle("is-route-enter", enter);

  if(isPatientRoute(h)){
    go("#/surveys");
    return;
  }
  let body;
  if(h==="#/alerts") body = viewAlerts();
  else if(h==="#/triggers"){ go("#/"); return; }
  else if(h==="#/scorecard") body = viewScorecard();
  else if(h==="#/blink") body = viewBlink();
  else if(h==="#/surveys") body = viewSurveysIndex();
  else if(isResponsesRoute(h)) body = viewSurveyResponses();
  else if(h.startsWith("#/surveys/")) body = viewSurveys();
  else body = viewOverview();
  root.innerHTML = shell(body);
  document.body.classList.toggle("nav-open", !!state.navOpen);
  document.body.classList.toggle("drawer-open", !!(state.openAlert||state.openResponse||state.openTrigger));
  restoreLibScroll();
  armDrawer();
  if(enter) requestAnimationFrame(()=>document.documentElement.classList.remove("is-route-enter"));
}

window.addEventListener("hashchange", ()=>{
  if(!isPatientRoute(location.hash||"")){
    state.openAlert = null;
  }
  state.deleteSurvey = null;
  state.stopSurvey = null;
  state.renameSurvey = null;
  state.editingSurveyName = null;
  state.surveyMenu = null;
  state.previewSurvey = false;
  state.openResponse = null;
  state.openTrigger = null;
  state.triggerSelectOpen = false;
  state.triggerSelectQuery = "";
  state.triggerSelectShowUsed = false;
  state.scheduleDurationOpen = false;
  state.responseFilter = "all";
  state.responseLimit = RESPONSE_PAGE;
  state.navOpen = false;
  state.scrollPreserve = null;
  state.crewSelectOpen = false;
  state.routeEnter = true;
  const vt = withViewTransition(()=>render());
  /* Scroll after the transition finishes — scrolling inside the update
     callback is often undone when the browser restores the old position. */
  if(!isPatientRoute(location.hash||"")) afterViewTransition(vt, scrollPageTop);
});
window.addEventListener("keydown", e=>{
  if(state.openResponse && (e.key==="ArrowLeft" || e.key==="ArrowRight") && !e.metaKey && !e.ctrlKey && !e.altKey){
    const tag = ((e.target && e.target.tagName) || "").toLowerCase();
    if(tag!=="input" && tag!=="textarea" && tag!=="select"){
      e.preventDefault();

  if(e.key!=="Escape") return;
  if(state.triggerSelectOpen){ state.triggerSelectOpen = false; triggerSelectPaint(); return; }
  if(state.scheduleDurationOpen){ state.scheduleDurationOpen = false; scheduleDurationPaint(); return; }
  if(state.pSelectOpen){ state.pSelectOpen = null; pSelectPaint(); return; }
  if(state.crewSelectOpen){ state.crewSelectOpen = false; crewSelectPaint(); return; }
  if(state.navOpen){ closeNav(); return; }
  if(state.previewSurvey){ closeSurveyPreview(); return; }
  if(state.renameSurvey){ closeRenameSurvey(); return; }
  if(state.editQuestion){ closeEditQuestion(); return; }
  if(state.editingSurveyName){ cancelInlineRename(); return; }
  if(state.surveyMenu){ closeSurveyMenu(); return; }
  if(state.deleteSurvey){ closeDeleteSurvey(); return; }
  if(state.stopSurvey){ closeStopSurvey(); return; }
  if(state.openResponse){ closeResponse(); return; }
  if(state.openTrigger){ closeTrigger(); return; }
  if(state.openAlert){ closeAlert(); }
});
window.addEventListener("mousedown", e=>{
  if(state.surveyMenu && !e.target.closest(".menu-wrap")){
    state.surveyMenu = null;
    render();
  }
  if(state.triggerSelectOpen && !e.target.closest(".trigger-select")){
    state.triggerSelectOpen = false;
    triggerSelectPaint(false);
  }
  if(state.scheduleDurationOpen && !e.target.closest(".schedule-duration-select")){
    state.scheduleDurationOpen = false;
    scheduleDurationPaint(false);
  }
  if(state.pSelectOpen && !e.target.closest(".fw-select")){
    state.pSelectOpen = null;
    pSelectPaint();
  }
  if(state.crewSelectOpen && !e.target.closest(".score-crew-select")){
    state.crewSelectOpen = false;
    crewSelectPaint(false);
  }
});
window.matchMedia("(max-width: 1199px)").addEventListener("change", ev=>{
  if(!ev.matches) state.navOpen = false;
  if(!isPatientRoute(location.hash||"#/")) render();
});
window.matchMedia("(max-width: 1080px)").addEventListener("change", ev=>{
  if(ev.matches || !state.crewSelectOpen) return;
  state.crewSelectOpen = false;
  if((location.hash||"#/")==="#/scorecard") render();
});
history.scrollRestoration = "manual";
state.survey.step = -1;
render();
scrollPageTop();
</script>
