<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflect — FirstWatch</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="vendor/firstwatch/styles.css">
<style>

:root{
  --font:var(--font-sans);
  --r-sm:calc(var(--border-radius-sm) * 1px);
  --r-default:calc(var(--border-radius-default) * 1px);
  --r-md:var(--radius-md);
  --r-lg:var(--radius-lg);
  --r-xl:var(--radius-xl);
  --r-full:var(--radius-full);
  --dur-micro:var(--dur-fast);
  --dur-layout:var(--dur-base);
  --dur-page:var(--dur-slow);
  --ease-spring:var(--ease-out);
  --stagger:50ms;
  --status-critical:var(--semantic-destructive);
  --status-critical-wash:var(--red-50);
  --status-elevated:var(--semantic-warning);
  --status-elevated-wash:var(--amber-50);
  --status-resolved:var(--semantic-success);
  --status-resolved-wash:var(--green-50);
  --status-normal:var(--muted-foreground);
  --status-inactive:var(--neutral-400);
}
html[data-theme="dark"]{
  --status-critical:var(--destructive);
  --status-critical-wash:var(--neutral-800);
  --status-elevated:var(--semantic-warning);
  --status-elevated-wash:var(--neutral-800);
  --status-resolved:var(--semantic-success);
  --status-resolved-wash:var(--neutral-800);
  --status-normal:var(--muted-foreground);
  --status-inactive:var(--neutral-500);
}
html[data-theme="dark"] .shell,
html[data-theme="dark"] .main{
  background:var(--base-black);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-sans);
  font-size:16px;line-height:24px;
  background:var(--background);color:var(--foreground);
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
.w-medium{font-weight:500}.w-semibold{font-weight:600}.w-extrabold{font-weight:700}

button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
:focus:not(:focus-visible){outline:none}
a{color:var(--primary);text-decoration:none}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}

/* ---------- type scale ---------- */
.t-h1{font-size:36px;line-height:40px;font-weight:700;letter-spacing:-.01em}
.t-h2{font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.0075em}
.t-h3{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.006em}
.t-h4{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.005em}
.t-lead{font-size:20px;line-height:28px;font-weight:400}
.t-p{font-size:16px;line-height:28px}
.t-pui{font-size:16px;line-height:24px}
.t-body{font-size:14px;line-height:24px}
.t-subtle{font-size:14px;line-height:20px}
.t-small{font-size:14px;line-height:14px;font-weight:400}
.t-detail{font-size:12px;line-height:20px;font-weight:400;letter-spacing:.01em}
.dim{color:var(--muted-foreground)}

/* Kit cards are slot-based; this prototype uses one padded box. */
.fw-card{padding:24px}
.bento .fw-card,.grid .fw-card{box-shadow:none}
.grid .fw-card.bento-lowest,
.grid .fw-card.bento-demo{box-shadow:var(--shadow-md)}
.fw-card-tight{padding:16px}
.fw-navy{background:var(--fw-navy);color:var(--base-white)}
textarea.fw-input{height:auto;min-height:88px;padding:12px;resize:vertical;line-height:24px}
.fw-btn--ghost-destructive{background:transparent;color:var(--destructive)}
.fw-btn--ghost-destructive:hover{background:var(--status-critical-wash);color:var(--destructive-hover)}
a.fw-btn{text-decoration:none}
.fw-btn{line-height:calc(var(--font-leading-5)*1px)}
.fw-btn:not(.fw-btn--icon){height:auto}
.fw-btn:not(.fw-btn--sm):not(.fw-btn--lg):not(.fw-btn--icon){
  min-height:calc(var(--min-width-10)*1px);
  padding:calc(var(--spacing-2-5)*1px) calc(var(--spacing-4)*1px);
}
.fw-btn--sm:not(.fw-btn--icon){
  min-height:calc(var(--min-width-8)*1px);
  padding:calc(var(--spacing-1-5)*1px) calc(var(--spacing-3)*1px);
}
.fw-btn--lg:not(.fw-btn--icon){
  min-height:calc(var(--min-width-11)*1px);
  padding:calc(var(--spacing-3)*1px) calc(var(--spacing-6)*1px);
}

/* ---------- app shell ---------- */
.shell{min-height:100vh;display:flex;flex-direction:column;background:var(--muted);min-width:0}
.topbar{
  height:56px;flex:0 0 auto;display:flex;align-items:center;gap:16px;
  padding:0 24px;background:var(--fw-navy);color:var(--base-white);
  position:sticky;top:0;z-index:40;
}
.topbar :focus-visible{outline-color:var(--base-white)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;font-size:16px;color:var(--base-white)}
.brand-mark{
  width:24px;height:24px;display:block;flex:0 0 auto;
}
.brand-sub{color:color-mix(in srgb,var(--base-white) 72%,transparent);font-weight:400;font-size:14px}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{
  display:flex;align-items:center;height:32px;padding:0 12px;
  border-radius:var(--r-sm);font-size:14px;font-weight:500;
  color:color-mix(in srgb,var(--base-white) 72%,transparent);
  transition:background-color var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out);
}
.nav a:hover{background:color-mix(in srgb,var(--base-white) 12%,transparent);color:var(--base-white)}
.nav a[aria-current="page"]{background:color-mix(in srgb,var(--base-white) 16%,transparent);color:var(--base-white)}
.nav .count,
.nav-drawer-links .count{
  margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-full);
  background:var(--status-critical);color:var(--base-white);font-size:11px;line-height:18px;
  text-align:center;font-weight:700;
}
.spacer{flex:1}

/* demo-only affordance — see docs/decisions.md #1 */
.demo-switch{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--neutral-200);border-radius:var(--r-md);padding:4px;gap:2px}
.seg button{
  height:28px;padding:0 10px;border:0;background:transparent;border-radius:var(--r-sm);
  font-size:13px;font-weight:500;color:var(--muted-foreground);cursor:pointer;
  transition:all var(--dur-micro) var(--ease-out);
}
.seg button[aria-pressed="true"]{background:var(--background);color:var(--foreground);box-shadow:var(--shadow-sm)}
.topbar .seg{background:color-mix(in srgb,var(--base-white) 12%,transparent)}
.topbar .seg button{color:color-mix(in srgb,var(--base-white) 72%,transparent)}
.topbar .seg button[aria-pressed="true"]{background:var(--base-white);color:var(--fw-navy);box-shadow:none}
.topbar .iconbtn{color:color-mix(in srgb,var(--base-white) 80%,transparent)}
.topbar .iconbtn:hover{background:color-mix(in srgb,var(--base-white) 12%,transparent);color:var(--base-white)}
.iconbtn.nav-toggle{display:none}

.nav-scrim{
  position:fixed;inset:56px 0 0;z-index:80;
  background:var(--overlay);
  opacity:0;pointer-events:none;
  transition:opacity var(--dur-base) var(--ease-out);
}
.nav-scrim.is-open{opacity:1;pointer-events:auto}
.nav-drawer{
  position:fixed;top:56px;left:0;bottom:0;z-index:81;
  width:min(320px,86vw);
  display:flex;flex-direction:column;
  background:var(--card);color:var(--foreground);
  border-right:1px solid var(--border);
  box-shadow:var(--shadow-xl);
  transform:translateX(-100%);
  pointer-events:none;
  transition:transform var(--dur-slow) var(--ease-out);
}
.nav-drawer.is-open{transform:translateX(0);pointer-events:auto}
.nav-drawer-head{display:none}
.nav-drawer-links{
  display:flex;flex-direction:column;gap:4px;
  padding:12px;margin:0;flex:1;overflow:auto;
}
.nav-drawer-links a{
  display:flex;align-items:center;min-height:44px;padding:0 12px;
  border-radius:var(--r-md);font-size:16px;font-weight:600;
  color:var(--foreground);
}
.nav-drawer-links a:hover{background:var(--surface-hover);color:var(--foreground)}
.nav-drawer-links a[aria-current="page"]{
  background:var(--accent);color:var(--primary);
}
.nav-drawer-links .count{
  margin-left:auto;
}
.nav-drawer-foot{
  display:none;
  flex-direction:column;
  padding:16px;border-top:1px solid var(--border);
}
.nav-drawer-foot .brand-sub{display:block;margin-bottom:12px;color:var(--muted-foreground)}
.nav-drawer-foot .seg{width:100%}
.nav-drawer-foot .seg button{flex:1}
body.nav-open,body.drawer-open{overflow:hidden}
html[data-theme="dark"] .seg{background:var(--neutral-900)}
html[data-theme="dark"] .topbar .seg{background:color-mix(in srgb,var(--base-white) 12%,transparent)}

.main{flex:1;padding:32px 24px 96px;max-width:1280px;width:100%;margin:0 auto;background:var(--muted);overflow-x:clip;min-width:0}
.page-head{margin-bottom:24px}
.title-edit{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.survey-readonly-pill{
  flex:0 0 auto;
  background:var(--neutral-200);
  color:var(--neutral-900);
  border:1px solid var(--neutral-300);
  font-weight:500;
}
.survey-readonly-pill svg{flex:0 0 auto;color:currentColor}
.survey-title-pill{flex:0 0 auto}
.survey-title-meta{margin-top:6px}
html[data-theme="dark"] .survey-readonly-pill{
  background:var(--neutral-800);
  color:var(--neutral-100);
  border-color:var(--neutral-600);
}
.title-edit-hit{
  display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%;
  margin:0;padding:0;border:0;background:transparent;
  font:inherit;color:inherit;letter-spacing:inherit;text-align:left;cursor:pointer;
  border-radius:var(--r-sm);
}
.title-edit-pen{
  flex:0 0 auto;display:grid;place-items:center;
  width:16px;height:16px;background:transparent;
  color:var(--muted-foreground);opacity:0;
  transition:opacity var(--dur-micro) var(--ease-out);
}
.title-edit-hit:hover .title-edit-pen,
.title-edit-hit:focus-visible .title-edit-pen{opacity:1}
@media (hover:none){
  .title-edit-pen{opacity:1}
  .iconbtn,.topbar .iconbtn.nav-toggle{
    width:44px;height:44px;
  }
}
.title-edit-input{
  width:min(36rem,100%);max-width:100%;
  height:auto;min-height:40px;padding:4px 12px;
  font-size:inherit;line-height:inherit;font-weight:inherit;letter-spacing:inherit;
}
.title-edit-field{
  position:relative;flex:1 1 auto;min-width:0;width:100%;max-width:36rem;
}
.title-edit-field .title-edit-input{width:100%;max-width:none;padding-right:76px}
.title-edit-actions{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:2px;
}
.title-edit-save.iconbtn{color:var(--status-resolved)}
.title-edit-save.iconbtn:hover{background:var(--status-resolved-wash);color:var(--status-resolved)}
.title-edit-cancel.iconbtn{color:var(--muted-foreground)}
.crumbs{display:flex;gap:8px;align-items:center;font-size:14px;line-height:20px;color:var(--muted-foreground);margin-bottom:8px}
.crumbs .sep{opacity:.5}
.page-back{
  display:none;
  align-items:center;gap:4px;
  min-height:44px;margin:0 0 4px;padding:0;
  min-width:0;max-width:100%;
  font-size:14px;line-height:20px;font-weight:500;color:var(--primary);
  text-decoration:none;border-radius:var(--r-sm);
}
.page-back:hover{text-decoration:underline}
.drawer-back{
  display:none;
  align-items:center;gap:4px;
  margin:0 0 4px -8px;padding:0 8px;
  min-height:44px;border:0;background:transparent;
  font:inherit;font-size:14px;line-height:20px;font-weight:500;
  color:var(--primary);cursor:pointer;border-radius:var(--r-sm);
}
.drawer-back:hover{background:var(--surface-hover)}
.rs-filters{margin-top:16px}
.rs-filters button{white-space:nowrap}
.rs-more{padding:8px 16px 16px;text-align:center}
.rs-excerpt{
  font-size:16px;line-height:24px;font-weight:600;
  max-width:42rem;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;
  overflow:hidden;
}
a.rs-excerpt{color:var(--primary);text-decoration:none}
a.rs-excerpt:hover{text-decoration:underline}
.rs-call{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:6px;color:var(--foreground);font-weight:500;
}
.rs-meta{display:none}
.rs-flags{white-space:nowrap}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.page-head .between > div:first-child{flex:1 1 auto;min-width:0}
.page-head .title-edit{width:100%}
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.sec{margin-top:24px}

/* stale banner */
.stale{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;border:1px solid var(--border);border-radius:var(--r-lg);
  background:var(--card);color:var(--muted-foreground);
  font-size:14px;line-height:20px;margin-bottom:16px;
}
.stale-banner{
  margin-bottom:16px;padding: 8px 16px;align-items:center;
  background:color-mix(in srgb,var(--status-elevated) 10%,var(--card));
}
.stale-banner .fw-alert__icon{margin-top:0}
.stale-banner .fw-alert__desc{flex:1}
.stale-banner__close{margin-left:auto;color:var(--muted-foreground)}
.stale__action{margin-left:auto;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:var(--r-full);background:var(--status-elevated);flex:0 0 auto}

.stat-k{
  font-size:12px;line-height:16px;font-weight:500;
  color:var(--muted-foreground);margin-top:6px;
  text-transform:none;letter-spacing:0;
}
.stat-unit{color:var(--muted-foreground);font-weight:400;font-size:14px;letter-spacing:0}
.stat-flag{
  display:inline-flex;align-items:center;
  height:20px;padding:0 8px;border-radius:var(--r-full);
  font-size:12px;line-height:20px;font-weight:600;
  color:var(--status-elevated);
  background:var(--status-elevated-wash);
  border:1px solid var(--status-elevated);
}
.stat-wash-num{
  display:inline-block;
  background:var(--status-resolved-wash);
  padding:2px 8px;border-radius:var(--r-md);
}

.bento > *,
.grid > *,
.funnel-stats > *,
.spot-split > *{min-width:0}
.funnel-strip{margin:16px 0 0;overflow:hidden}
.crew-kpi-strip{margin:16px 0 0}
.crew-kpi-strip .crew-kpi-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.funnel-stats{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:0;margin-top:16px;
  border-top:1px solid var(--border);
}
.funnel-stats > div{padding:16px 16px 16px 0;min-width:0}
.funnel-stats > div + div{padding-left:16px;border-left:1px solid var(--border)}
.funnel-stats .stat-k{
  margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.funnel-stats .stat-sub{margin-top:8px}
.funnel-stats--3{grid-template-columns:repeat(3,minmax(0,1fr))}
.funnel-stats--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.funnel-stats--3 > div + div,
.funnel-stats--2 > div + div{padding-left:0;border-left:0}
.funnel-stats--3 > div:nth-child(3n+2),
.funnel-stats--3 > div:nth-child(3n){
  padding-left:16px;border-left:1px solid var(--border);
}
.funnel-stats--3 > div:nth-child(n+4){
  padding-top:16px;border-top:1px solid var(--border);
}
.funnel-stats--2 > div:nth-child(even){
  padding-left:16px;border-left:1px solid var(--border);
}
.funnel-stats--2 > div:nth-child(n+3){
  padding-top:16px;border-top:1px solid var(--border);
}
.kpi{
  display:flex;flex-direction:column;gap:8px;
  background:var(--card);
  color:var(--foreground);
  border:1px solid var(--border);border-radius:var(--r-xl);
  padding:16px 18px;
  box-shadow:var(--shadow-sm);
  min-height:0;
}
.kpi-top{display:flex;align-items:center;gap:10px}
.kpi-label{flex:1;font-size:16px;line-height:24px;font-weight:600}
.kpi-delta{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;line-height:16px;font-weight:600;color:var(--primary);
}
.kpi-delta.is-down{color:var(--status-elevated)}
.kpi-v{
  font-size:28px;line-height:32px;font-weight:600;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  min-width:0;
}
.kpi-v--lead{
  font-size:36px;line-height:40px;font-weight:700;letter-spacing:-.01em;
}
.funnel-stats .kpi-v{
  font-size:20px;line-height:28px;font-weight:600;
}
.kpi-foot{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  flex-wrap:wrap;
  padding-top:12px;border-top:1px solid var(--border);
  color:var(--muted-foreground);font-size:12px;line-height:16px;
}
.kpi-foot .row{gap:6px}
.bento{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:auto 1fr;
  gap:16px;
  align-items:stretch;
}
.kpi-spot{
  display:grid;
  grid-template-rows:subgrid;
  grid-row:span 2;
  gap:16px;
  padding:0;
}
.bento .fw-card.kpi-spot{box-shadow:var(--shadow-sm);padding:0}
.kpi-spot .kpi-top{align-items:flex-start;padding:20px 24px 0}
.kpi-head{flex:1;min-width:0}
.kpi-head .t-subtle{margin-top:4px}
.kpi-spot--good .kpi-delta{color:var(--status-resolved)}
.spot-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:end;align-self:end;min-width:0;padding:0 24px 20px}
.kpi-spot .kpi-foot{padding:12px 24px 20px}
.spot-split > div + div{border-left:1px solid var(--border);padding-left:16px}
.al-reason{font-weight:700;text-align:left}
.al-meta{display:none;margin-top:8px;color:var(--muted-foreground);font-size:13px;line-height:20px}

/* queue table */
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl thead tr{background:var(--surface-hover)}
.tbl th{
  text-align:left;padding:12px 16px;height:48px;
  font-size:14px;line-height:20px;font-weight:500;color:var(--muted-foreground);
  border-bottom:1px solid var(--border);white-space:nowrap;
  background:var(--surface-hover);
  position:sticky;top:56px;z-index:3;
}
.tbl thead tr + tr th{top:104px}
.tbl td{padding:16px;font-size:16px;line-height:24px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.clickable{cursor:pointer;transition:background-color var(--dur-micro) var(--ease-out)}
.tbl tbody tr.clickable:active{background:var(--accent)}
@media (hover:hover){
  .tbl tbody tr.clickable:hover{background:var(--accent)}
}
.tbl .fav{width:52px;padding-left:12px;padding-right:0;vertical-align:middle}
.tbl .morecol{width:52px;padding-left:8px;padding-right:12px;text-align:right;vertical-align:middle}
.tbl--surveys .sv-trigger,
.tbl--surveys .sv-status,
.tbl--surveys .sv-responses,
.tbl--surveys .sv-rate,
.tbl--surveys .sv-schedule{vertical-align:middle}
.tbl--alerts td{vertical-align:middle}
.tbl--responses td{vertical-align:middle}
.star-btn{color:var(--muted-foreground)}
.star-btn:hover{color:var(--fw-gold)}
.star-btn[aria-pressed="true"]{color:var(--fw-gold)}
.star-btn[aria-pressed="true"]:hover{color:var(--fw-gold-light)}

.menu-wrap{position:relative;display:inline-flex}
.menu-wrap.open{z-index:31}
.tbl .morecol:has(.menu-wrap.open){position:relative;z-index:31}
.menu{
  position:absolute;right:0;top:calc(100% + 4px);
  min-width:196px;padding:6px;z-index:32;
  background:var(--popover);color:var(--popover-foreground);
  border:1px solid var(--border);border-radius:var(--r-xl);
  box-shadow:var(--shadow-lg);
  animation:pop var(--dur-layout) var(--ease-out);
}
.menu button{
  display:flex;align-items:center;gap:10px;width:100%;
  height:36px;padding:0 10px;border:0;background:transparent;
  border-radius:var(--r-md);cursor:pointer;text-align:left;
  font-size:14px;line-height:20px;font-weight:400;color:inherit;
}
.menu button:hover{background:var(--muted)}
.menu button.danger{color:var(--destructive)}
.menu button.danger:hover{background:var(--status-critical-wash)}
.menu-sep{height:1px;background:var(--border);margin:6px 4px}
.tbl tbody tr.resolving{animation:resolveOut var(--dur-layout) var(--ease-out) forwards}
@keyframes resolveOut{to{opacity:0;transform:translateX(8px)}}
.snip{color:var(--muted-foreground);font-size:14px;line-height:20px;max-width:420px}
.mono{font-family:var(--font-mono);font-size:14px;font-weight:700}

.fw-card-flush{padding:0;overflow:visible}
.tbl-inset{padding:0}
.fw-card:has(table.tbl),
.fw-card-flush:has(table.tbl){overflow:visible}
.fw-card-head{
  padding:16px 24px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fw-card--dashed{border-style:dashed}
.live-tag{
  display:flex;align-items:center;gap:6px;
  font-size:13px;line-height:20px;font-weight:600;color:var(--status-resolved);
}
.live-dot{
  width:8px;height:8px;border-radius:var(--r-full);
  background:var(--status-resolved);flex:0 0 auto;
  animation:livePulse 2s var(--ease-out) infinite;
}
@keyframes livePulse{50%{opacity:.35}}
.rule{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--r-md);
  font-size:14px;line-height:20px;
  border:1px solid transparent;
}
.rule-list{display:flex;flex-direction:column;gap:6px}
.rule--in{
  background:var(--status-resolved-wash);
  border-color:color-mix(in srgb,var(--status-resolved) 22%,var(--border));
}
.rule--out{
  background:var(--status-critical-wash);
  border-color:color-mix(in srgb,var(--status-critical) 22%,var(--border));
}
.rule-ico{flex:0 0 auto;display:grid;place-items:center}
.rule--in .rule-ico{color:var(--status-resolved)}
.rule--out .rule-ico{color:var(--status-critical)}
.icon-yes{color:var(--status-resolved)}
.icon-no{color:var(--muted-foreground)}
.tbl--encounters .enc-mobile{white-space:nowrap}
.rule-head{margin-bottom:14px}
.rule-head--in{color:var(--status-resolved)}
.rule-head--out{color:var(--status-critical)}
.timing{align-items:flex-start;gap:16px}

.score-head{margin-bottom:8px}
.score-hero-dock{
  position:sticky;top:56px;z-index:6;
  background:var(--muted);
  padding-top:16px;padding-bottom:24px;
}
.score-hero-dock + .sec{margin-top:0}
.score-hero-dock:has(.is-open){z-index:8}
.score-detail .tbl-wrap,
.score-detail .fw-card:has(table.tbl){overflow:hidden}
.score-detail .tbl th,
.tbl.tbl--ops th,
.tbl.tbl--ops thead tr + tr th{
  position:static;top:auto;z-index:auto;
}
.score-hero{
  display:flex;flex-direction:row;align-items:center;gap:14px;
  padding:16px 24px;
}
.score-hero .fw-avatar{
  background:var(--accent);
  color:var(--primary);
}
.score-hero-static{
  display:flex;flex-direction:row;align-items:center;gap:14px;
  min-width:0;
}
.score-hero-copy{min-width:0}
.score-hero-name{font-size:16px;line-height:24px;font-weight:700}
.score-hero-meta{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.score-crew-select{display:none}
.stat-sub{font-size:12px;line-height:16px;color:var(--muted-foreground);margin-top:6px}
.tbl-wrap{overflow:visible}
.tbl th.group{text-align:center;background:var(--secondary);color:var(--secondary-foreground);font-weight:600}
.tbl th.group-sys{background:var(--neutral-200);color:var(--muted-foreground)}
html[data-theme="dark"] .tbl th.group-sys{background:var(--muted);color:var(--muted-foreground)}
.tbl .comp{font-weight:700}
.comp--good{color:var(--status-resolved)}
.comp--ok{color:var(--primary)}
.comp--warn{color:var(--status-elevated)}
.comp--bad{color:var(--status-critical)}
.score-split{
  display:grid;
  grid-template-columns:minmax(240px,28%) minmax(0,1fr);
  gap:24px;
  align-items:start;
}
.score-index{
  position:sticky;top:56px;z-index:2;
  min-width:0;
  padding-top:16px;
  background:var(--muted);
}
.score-detail{min-width:0}
.crew-list{margin:0;padding:8px;list-style:none}
.crew-item{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  grid-template-areas:"name unit" "meta meta";
  align-items:baseline;
  column-gap:12px;
  row-gap:4px;
  width:100%;
  margin:0;
  padding:12px;
  border:1px solid transparent;
  border-radius:var(--r-md);
  background:transparent;
  color:inherit;
  text-align:left;
  cursor:pointer;
  transition:background-color var(--dur-micro) var(--ease-out),
             border-color var(--dur-micro) var(--ease-out);
}
.crew-item:hover{background:var(--surface-hover)}
.crew-item[aria-current="true"]{
  background:var(--accent);
  border-color:var(--primary);
}
.crew-item[aria-current="true"]:hover{background:var(--accent)}
.crew-item-name{grid-area:name;font-weight:700;font-size:16px;line-height:24px}
.crew-item-unit{
  grid-area:unit;
  font-family:var(--font-mono);font-size:13px;line-height:20px;font-weight:700;
  color:var(--muted-foreground);
}
.crew-item-meta{
  grid-area:meta;
  font-size:13px;line-height:20px;
  color:var(--muted-foreground);
}
.flag-hot{color:var(--status-critical);font-weight:700}
.score-empty{padding:8px 0 4px}

.commend{border-left:3px solid var(--primary);margin-bottom:12px}
.commend:last-child{margin-bottom:0}
.commend-meta{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.commend-quote{font-size:14px;line-height:22px;margin:12px 0}
.commend-by{font-size:12px;line-height:16px;color:var(--muted-foreground);margin-bottom:12px}
.commend-actions{display:flex;flex-wrap:wrap;gap:8px}
.blink-board{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--muted)}
.blink-board-bar{
  display:flex;align-items:baseline;gap:8px;
  padding:12px 16px;background:var(--fw-navy);color:var(--base-white);
}
.blink-board-title{font-size:14px;line-height:20px;font-weight:700}
.blink-board-sub{font-size:12px;line-height:16px;color:color-mix(in srgb,var(--base-white) 72%,transparent)}
.blink-feed{padding:12px;display:flex;flex-direction:column;gap:10px}
.blink-post{
  background:var(--card);color:var(--foreground);
  border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;
}
.blink-post-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.blink-post-head > div{flex:1;min-width:0}
.blink-post-status{margin-left:auto;flex:0 0 auto}
.blink-post-name{font-size:14px;line-height:20px;font-weight:600}
.blink-post-to,.blink-post-by{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.blink-post-text{font-size:14px;line-height:22px;margin-top:4px}
.blink-empty{text-align:center;padding:32px 16px;color:var(--muted-foreground)}
.col-start{align-items:start}

.ans{padding:12px 0;border-bottom:1px solid var(--border)}
.ans:last-child{border-bottom:0}
.num-link{color:var(--primary);font-weight:700;text-decoration:none}
.num-link:hover{text-decoration:underline}
.num-link--muted{color:var(--muted-foreground);font-weight:600}
.num-link--muted:hover{color:var(--foreground)}
button.num-link{
  background:none;border:0;padding:0;margin:0;font:inherit;cursor:pointer;
  color:var(--primary);font-weight:700;
}
.sv-title{
  color:var(--primary);font-weight:700;text-decoration:none;
}
.sv-title:hover{text-decoration:underline}

.empty{padding:64px 24px;text-align:center}
.empty .t{font-size:20px;line-height:28px;font-weight:700}
.empty .s{color:var(--muted-foreground);margin-top:8px}

/* drawer */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:90;
  animation:fade var(--dur-layout) var(--ease-out);
}
@keyframes fade{from{opacity:0}}
.drawer{
  position:fixed;top:0;right:0;bottom:0;left:auto;
  width:min(560px,100%);max-width:100%;z-index:91;
  display:flex;flex-direction:column;
  background:var(--card);border-left:1px solid var(--border);
  box-shadow:var(--shadow-xl);overflow:hidden;
  transform:translate3d(100%,0,0);
  transition:transform var(--dur-page) var(--ease-out);
}
.drawer.is-open{transform:translate3d(0,0,0)}
.drawer--trigger{width:min(420px,100%)}
.drawer.is-paging{transition:none}
.drawer.is-paging .drawer-head,
.drawer.is-paging .drawer-body > *{animation:none}
.drawer-head{
  position:relative;z-index:2;flex:0 0 auto;
  background:var(--card);border-bottom:1px solid var(--border);
  padding:20px 24px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;
  animation:drawerDataIn var(--dur-page) var(--ease-out) both;
  animation-delay:40ms;
}
.drawer-foot{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:12px 24px;
  border-top:1px solid var(--border);background:var(--card);
}
.drawer-foot .fw-btn{flex:1}
.drawer-foot--alert{flex-wrap:wrap}
.drawer-foot--alert .fw-btn{flex:1 1 auto}
.drawer-pos{
  flex:0 0 auto;min-width:4.5rem;text-align:center;
  font-size:13px;line-height:20px;color:var(--muted-foreground);
}
.drawer-body{
  flex:1 1 auto;min-height:0;padding:24px;
  overflow-x:hidden;overflow-y:auto;
}
.drawer-body > :first-child{margin-top:0}
.drawer-body > *{
  animation:drawerDataIn var(--dur-page) var(--ease-out) both;
  animation-delay:calc(70ms + (var(--i,0) * 40ms));
}
.drawer-body > *:nth-child(1){--i:0}
.drawer-body > *:nth-child(2){--i:1}
.drawer-body > *:nth-child(3){--i:2}
.drawer-body > *:nth-child(4){--i:3}
.drawer-body > *:nth-child(5){--i:4}
.drawer-body > *:nth-child(6){--i:5}
.drawer-body > *:nth-child(7){--i:6}
@keyframes drawerDataIn{from{opacity:0;transform:translate3d(24px,0,0)}}

.dialog-wrap{
  position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:24px;
}
.dialog{
  width:min(440px,100%);
  background:var(--card);color:var(--card-foreground);
  border:1px solid var(--border);border-radius:var(--r-xl);
  box-shadow:var(--shadow-xl);padding:24px;
  animation:rise var(--dur-layout) var(--ease-out);
}
.dialog-icon{
  width:40px;height:40px;border-radius:var(--r-lg);
  display:grid;place-items:center;
  background:var(--status-critical-wash);color:var(--destructive);
  margin-bottom:16px;
}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;flex-wrap:wrap}
.dialog-actions--split{
  justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
}
.dialog-actions__end{
  display:flex;align-items:center;justify-content:flex-end;gap:8px;
  flex:1 1 auto;min-width:0;flex-wrap:wrap;
}
.dialog-actions--split > .fw-btn--ghost{flex:0 1 auto}
.dialog--stop{width:min(520px,100%)}
@media (max-width:480px){
  .dialog-actions--split .fw-btn--ghost{order:3;width:100%}
  .dialog-actions__end{width:100%;justify-content:stretch}
  .dialog-actions__end .fw-btn{flex:1;min-width:0}
}
.dialog--edit-q{width:min(520px,100%)}
.edit-q-switch{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-top:16px;padding:12px 14px;
  border:1px solid var(--border);border-radius:var(--r-lg);
  background:var(--muted);
}
.edit-q-switch .t-subtle{margin:0}
.edit-q-field{margin-top:16px}
.edit-q-field label{font-weight:700;display:block;margin-bottom:8px}
.kv{display:grid;grid-template-columns:132px 1fr;gap:8px 16px;font-size:14px;line-height:20px}
.kv dt{color:var(--muted-foreground)}
.kv dd{margin:0}
.drawer--trigger .drawer-head{
  padding:16px 18px;
  gap:12px;
}
.drawer--trigger .drawer-head .t-h4{
  font-size:16px;line-height:22px;
}
.drawer--trigger .drawer-head .t-subtle{
  font-size:12px;line-height:18px;
}
.drawer--trigger .drawer-head .fw-badge{
  font-size:11px;line-height:16px;padding:2px 7px;
}
.drawer--trigger .drawer-body{
  display:flex;flex-direction:column;gap:14px;
  padding:16px 18px;
  font-size:13px;line-height:18px;
}
.drawer--trigger .drawer-body .t-p{
  font-size:13px;line-height:18px;
}
.drawer--trigger .trigger-id-line{
  display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;
}
.drawer--trigger .kv{
  grid-template-columns:minmax(0,76px) minmax(0,1fr);
  gap:6px 10px;
  font-size:13px;line-height:18px;
  word-break:break-word;
}
.drawer--trigger .trigger-rules{
  display:flex;flex-direction:column;gap:0;
  min-width:0;
}
.drawer--trigger .trigger-rules .fw-tablist{
  display:flex;width:100%;
}
.drawer--trigger .trigger-rules .fw-tab{
  flex:1;justify-content:center;
  font-size:12px;line-height:16px;padding:6px 8px;
  white-space:nowrap;
}
.drawer--trigger .trigger-rules .fw-tablist,
.drawer--trigger .trigger-rules .fw-tab{
  transition:none !important;
  animation:none !important;
}
.drawer--trigger .trigger-rules .fw-tabpanel{
  padding-top:10px;
  animation:none;
  transition:none;
}
.drawer--trigger .trigger-rules .trigger-rules-data{
  animation:none;
  transition:none;
}
.drawer--trigger .trigger-rules .rule-list{gap:6px}
.drawer--trigger .trigger-rules .rule{
  align-items:flex-start;
  gap:8px;
  padding:8px 10px;
  font-size:13px;line-height:18px;
}
.drawer--trigger .trigger-rules .t-detail{
  margin-top:8px;
  font-size:11px;line-height:16px;
}
.quote{
  border-left:3px solid var(--primary);padding:4px 0 4px 16px;margin:0 0 16px;
  font-size:16px;line-height:28px;
}
.al-survey-name{display:block;font-weight:700;font-size:14px;line-height:20px}
.alert-source{margin-bottom:20px}
.alert-source dd{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.log{border-top:1px solid var(--border);margin-top:24px;padding-top:16px}
.log li{padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;line-height:20px}
.log li:last-child{border-bottom:0}

/* builder */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:24px;align-items:start}
.preview-col{align-self:stretch}
.preview-sticky{
  position:sticky;top:72px;z-index:20;
  background:transparent;
}
.trigger-assoc .fw-select{margin-top:0}
.publish-setup-grid{gap:20px 24px;align-items:start}
.publish-setup-label{
  margin:0 0 8px;font-size:14px;line-height:20px;font-weight:500;color:var(--foreground);
}
.publish-setup .seg{margin-top:0;width:100%}
.publish-setup .seg button{
  flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;
  padding-left:6px;padding-right:6px;
}
.publish-setup .schedule-fields{margin-top:12px}
.publish-setup .trigger-summary{margin-top:8px}
.publish-setup-col > .fw-field > .fw-label{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
.trigger-select .fw-select__trigger{
  text-align:left;justify-content:flex-start;padding-right:36px;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.trigger-select .fw-select__menu{max-height:min(360px,50vh);padding-top:0;overflow:hidden;display:flex;flex-direction:column}
.trigger-select-search{
  position:sticky;top:0;z-index:1;padding:8px;background:var(--card);
  border-bottom:1px solid var(--border);flex:0 0 auto;
}
.trigger-select-search .fw-input{width:100%}
.trigger-select-list{overflow:auto;padding:6px;flex:1 1 auto}
.trigger-select-hint{
  flex:0 0 auto;padding:6px 14px 0;font-size:12px;line-height:16px;color:var(--muted-foreground);
}
.trigger-select-foot{
  flex:0 0 auto;border-top:1px solid var(--border);padding:6px;background:var(--card);
}
.trigger-select-foot-btn{
  width:100%;border:0;background:transparent;cursor:pointer;text-align:left;
  padding:8px 10px;border-radius:var(--r-sm);font-size:13px;line-height:18px;
  font-weight:600;color:var(--primary);
}
.trigger-select-foot-btn:hover{background:var(--surface-hover)}
.trigger-select-section{
  padding:8px 10px 4px;font-size:11px;line-height:16px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;color:var(--muted-foreground);
}
.trigger-select-opt{align-items:flex-start}
.trigger-select-opt.is-disabled{
  opacity:.55;cursor:default;
}
.trigger-select-opt.is-disabled:hover,
.trigger-select-opt.is-disabled[data-active]{
  background:var(--surface-hover);
}
.trigger-select-opt-copy{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.trigger-select-opt-id{font-family:var(--font-mono, ui-monospace, monospace);font-size:12px;line-height:16px;color:var(--muted-foreground)}
.trigger-select-opt-name{font-size:14px;line-height:20px}
.trigger-select-opt-used{
  display:inline;padding:0;border:0;background:transparent;cursor:pointer;
  font-size:12px;line-height:16px;font-weight:600;color:var(--primary);text-align:left;
}
.trigger-select-opt-used:hover{text-decoration:underline}
.trigger-select-empty{padding:12px 10px;color:var(--muted-foreground);font-size:13px;line-height:20px}
.trigger-summary{
  margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
}
.trigger-assoc:not(.publish-setup) .trigger-assoc-head{margin-bottom:6px}
.trigger-assoc:not(.publish-setup) .trigger-summary{margin-top:0}
.trigger-assoc-head{
  display:flex;align-items:center;flex-wrap:wrap;gap:8px;
}
.trigger-assoc-head .t-h4{margin:0}
.trigger-summary-line{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0;flex:1 1 auto;
}
.trigger-summary-line .trigger-summary-name{
  font-size:13px;line-height:18px;font-weight:600;color:var(--foreground);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
}
.trigger-summary-line .trigger-summary-name.dim{font-weight:500;color:var(--muted-foreground)}
.trigger-summary-actions{display:flex;flex-wrap:wrap;gap:4px;align-items:center;flex:0 0 auto}
.trigger-summary-warn{flex:1 1 100%;font-size:13px;line-height:20px;color:var(--muted-foreground);margin:0}
.survey-lock-banner{margin-bottom:24px}
.survey-lock-banner .fw-alert__actions{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;
}
.schedule-card .seg{margin-top:12px}
.schedule-fields{display:grid;gap:12px;margin-top:16px}
.schedule-fields .fw-field{min-width:0}
.schedule-fields--2{grid-template-columns:1fr 1fr}
@media (max-width:720px){
  .schedule-fields--2{grid-template-columns:1fr}
}
.schedule-duration-select .fw-select__trigger{
  height:40px;padding:0 36px 0 12px;font-size:14px;line-height:20px;
}
.schedule-duration-select .fw-select__chevron{
  color:var(--muted-foreground);
  transition:transform var(--dur-micro) var(--ease-out);
}
.schedule-duration-select.is-open .fw-select__chevron{
  transform:translateY(-50%) rotate(180deg);
}
.schedule-duration-select .fw-select__menu{z-index:40}
.schedule-fields input[type="date"].fw-input{
  height:40px;min-height:40px;padding:0 12px;font-size:14px;line-height:20px;
  color:var(--foreground);background:var(--card);
  border:1px solid var(--border);border-radius:var(--r-md);
  font-family:var(--font-sans);
}
.schedule-fields input[type="date"].fw-input:hover{border-color:var(--muted-foreground)}
.schedule-fields input[type="date"].fw-input:focus,
.schedule-fields input[type="date"].fw-input:focus-visible{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent);
}
.schedule-readonly{
  margin-top:12px;padding:12px 14px;border:1px solid var(--border);
  border-radius:var(--r-md);background:var(--muted);
}
.qcard{
  border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);
  color:var(--card-foreground);
  padding:16px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;
  transition:border-color var(--dur-micro) var(--ease-out),
             box-shadow var(--dur-micro) var(--ease-out),
             background-color var(--dur-micro) var(--ease-out);
}
.qcard-out{animation:qcardOut var(--dur-layout) var(--ease-out) forwards;pointer-events:none}
.qcard-in{animation:rise var(--dur-layout) var(--ease-out) both}
@keyframes qcardOut{to{opacity:0;transform:translateY(-6px)}}
.qcard:hover{border-color:var(--muted-foreground);box-shadow:var(--shadow-sm)}
.qcard.locked{background:var(--muted)}
.qcard-select{cursor:pointer}
.qcard-select.selected{
  border-color:var(--primary);
  box-shadow:0 0 0 1px var(--primary);
  background:var(--accent);
}
.qcard-select.locked.selected{
  background:color-mix(in srgb,var(--accent) 55%,var(--muted));
}
.qcard.added{background:var(--muted);opacity:.7}
.qcard.added:hover{border-color:var(--border);box-shadow:none}
.lib-filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.questions-lib{
  margin-top:24px;padding-top:24px;
  border-top:1px solid var(--border);
}
.questions-lib__heading{
  margin:0;font-size:16px;line-height:24px;font-weight:700;
  letter-spacing:-.01em;color:var(--foreground);
}
.questions-lib .lib-filters{margin-top:12px}
.questions-lib .lib-list{margin-top:12px}
.lib-chip{
  display:inline-flex;align-items:center;justify-content:center;
  height:28px;padding:0 12px;border-radius:var(--r-full);
  border:1px solid var(--border);background:var(--card);
  font-size:12px;line-height:1;font-weight:600;
  color:var(--muted-foreground);cursor:pointer;
  transition:background-color var(--dur-micro) var(--ease-out),
             color var(--dur-micro) var(--ease-out),
             border-color var(--dur-micro) var(--ease-out);
}
.lib-chip:hover{background:var(--accent);color:var(--accent-foreground)}
.lib-chip[aria-pressed="true"]{
  background:var(--primary);color:var(--primary-foreground);border-color:var(--primary);
}
.lib-chip[aria-pressed="true"]:hover{background:var(--primary-hover);color:var(--primary-foreground)}
.lib-list{margin-top:16px;max-height:360px;overflow-y:auto}
.grip{
  color:var(--muted-foreground);cursor:grab;line-height:1;
  padding:4px 2px;margin:-4px 0;flex-shrink:0;user-select:none;
}
.grip:active{cursor:grabbing}
.qcard.is-dragging{opacity:.45}
.qcard.drop-before,.qcard.drop-after{position:relative}
.qcard.drop-before::before,
.qcard.drop-after::after{
  content:"";position:absolute;left:8px;right:8px;height:2px;
  background:var(--primary);border-radius:1px;pointer-events:none;z-index:1;
}
.qcard.drop-before::before{top:-5px}
.qcard.drop-after::after{bottom:-5px}
.qmeta{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.qcard-body{flex:1;min-width:0}
.qbtns{display:flex;gap:4px;margin-left:auto}
.iconbtn{
  width:32px;height:32px;border:0;background:transparent;border-radius:var(--r-sm);
  color:var(--muted-foreground);cursor:pointer;display:grid;place-items:center;
  transition:background-color var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out);
}
.iconbtn svg{pointer-events:none}
.iconbtn:hover{background:var(--accent);color:var(--accent-foreground)}
.iconbtn[disabled]{opacity:.5;cursor:not-allowed}
.phone-frame{
  border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden;
  background:var(--muted);
}
.phone-frame .cap{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;font-size:12px;line-height:20px;color:var(--muted-foreground);
  border-bottom:1px solid var(--border);background:var(--card);
}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.preview-overlay{
  position:fixed;inset:0;z-index:56;
  display:flex;flex-direction:column;
  background:var(--muted);
}
.preview-overlay.is-enter{animation:fade var(--dur-layout) var(--ease-out)}
.preview-bar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:10px 16px;background:var(--card);color:var(--card-foreground);
  border-bottom:1px solid var(--border);
}
.preview-bar .t{font-size:14px;line-height:20px;font-weight:700}
.preview-bar .s{font-size:13px;line-height:20px;font-weight:400;color:var(--muted-foreground)}
.preview-stage{flex:1;overflow-y:auto}
.preview-stage .patient{min-height:100%;padding-top:32px}
.preview-stage .p-view{will-change:opacity,transform}

/* leadership */
.bars{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.bar-row{display:grid;grid-template-columns:180px 1fr 56px;gap:12px;align-items:center;font-size:14px;line-height:20px}
.bar{height:8px;border-radius:var(--r-full);background:var(--muted);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--r-full);background:var(--primary);
  transform-origin:0 50%}
html.is-route-enter .bar i{animation:grow var(--dur-page) var(--ease-out) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.gap-flag{color:var(--status-elevated);font-weight:700}

/* stagger entrance */
.stagger>*{animation:rise var(--dur-page) var(--ease-out) both;animation-delay:calc(var(--i,0)*var(--stagger))}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}

.fw-toaster{z-index:200}

.topbar{view-transition-name:fw-topbar}
.main{view-transition-name:fw-main}
::view-transition-old(fw-main){animation:vtOut var(--dur-page) var(--ease-out) both}
::view-transition-new(fw-main){animation:vtIn var(--dur-page) var(--ease-out) both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(6px)}}

/* Patient survey — letter surface. --p-* stays scoped here. */
.patient{
  --p-paper:var(--neutral-50);
  --p-ink:var(--foreground);
  --p-ink-muted:var(--muted-foreground);
  --p-rule:var(--border);
  min-height:100vh;background:var(--p-paper);color:var(--p-ink);
  display:flex;flex-direction:column;align-items:center;
  padding:32px 24px 64px;
}
html[data-theme="dark"] .patient{
  --p-paper:var(--neutral-900);
}
.patient--embed{min-height:0;padding:20px 16px 28px}
.patient--embed .p-opt,
.patient--embed .p-scale-btn{pointer-events:none}
.p-wrap{width:100%;max-width:520px}
.p-lock{
  display:flex;align-items:center;gap:8px;justify-content:center;
  color:var(--p-ink-muted);font-size:12px;line-height:20px;margin-bottom:24px;
}
.p-card{padding:0;background:transparent;border:0;box-shadow:none;border-radius:0}
.p-card.p-done{text-align:center}
.p-progress{display:flex;gap:6px;margin-bottom:20px}
.p-progress i{
  height:4px;flex:1;border-radius:var(--r-full);background:var(--p-rule);
  transition:background-color var(--dur-layout) var(--ease-out);
}
.p-progress i.done{background:var(--primary)}
.p-progress i.now{background:var(--foreground)}
.p-step{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.patient .dim{color:var(--p-ink-muted)}

.p-opts{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.p-opt{
  display:flex;align-items:center;gap:12px;width:100%;min-height:48px;
  padding:12px 16px;text-align:left;cursor:pointer;appearance:none;
  background:var(--p-paper);border:1px solid var(--p-rule);border-radius:var(--r-md);
  font-size:16px;line-height:24px;color:inherit;
  transition:border-color var(--dur-micro) var(--ease-out),
             background-color var(--dur-micro) var(--ease-out),
             box-shadow var(--dur-micro) var(--ease-out);
}
.p-opt:hover{background:var(--accent);border-color:var(--muted-foreground)}
.p-opt[aria-pressed="true"]{
  border-color:var(--primary);background:var(--accent);
  box-shadow:0 0 0 1px var(--primary);font-weight:600;
}
.p-tick{
  width:18px;height:18px;border-radius:var(--r-full);flex:0 0 auto;
  border:1px solid var(--border-strong);background:var(--surface);
  display:grid;place-items:center;
  transition:border-color var(--dur-micro) var(--ease-out);
}
.p-opt[aria-pressed="true"] .p-tick{border-color:var(--primary)}
.p-opt[aria-pressed="true"] .p-tick::after{
  content:"";width:10px;height:10px;border-radius:var(--r-full);background:var(--primary);
}

.p-scale{display:flex;gap:8px;margin-top:20px}
.p-scale-btn{
  flex:1;min-height:56px;border-radius:var(--r-md);cursor:pointer;appearance:none;
  border:1px solid var(--p-rule);background:var(--p-paper);color:inherit;
  font-size:16px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:border-color var(--dur-micro) var(--ease-out),
             background-color var(--dur-micro) var(--ease-out),
             color var(--dur-micro) var(--ease-out);
}
.p-scale-btn span{font-size:11px;font-weight:500;color:var(--muted-foreground)}
.p-scale-btn:hover{background:var(--accent);border-color:var(--muted-foreground)}
.p-scale-btn[aria-pressed="true"]{
  background:var(--primary);border-color:var(--primary);color:var(--primary-foreground);
}
.p-scale-btn[aria-pressed="true"] span{color:color-mix(in srgb,var(--primary-foreground) 85%,transparent)}

.p-fields{margin-top:20px}
.p-fields .fw-textarea{min-height:120px}
.p-count{margin-top:8px;text-align:right}

.p-actions{display:flex;gap:12px;align-items:flex-start;margin-top:24px;width:100%}
.p-cta{flex:1;display:flex;flex-direction:column;align-items:stretch;min-width:0}
.p-cta .p-next,.p-actions > .p-next{align-self:stretch;width:100%}
.p-back{margin-top:12px;min-height:0;height:auto;padding:0}
.p-fieldset{border:0;padding:0;margin:16px 0 0}
.patient .fw-select__trigger{
  min-height:48px;height:48px;padding:0 40px 0 12px;
  background:var(--p-paper);color:inherit;
}
.patient .fw-select__trigger:focus,
.patient .fw-select__trigger:focus-visible{
  box-shadow:none;
  outline:2px solid var(--ring);
  outline-offset:2px;
}
.patient .fw-select__chevron{
  right:12px;color:var(--p-ink-muted);
  transition:transform var(--dur-micro) var(--ease-out);
}
.patient .fw-select.is-open .fw-select__chevron{
  transform:translateY(-50%) rotate(180deg);
}
.patient .fw-select__opt{
  min-height:44px;padding:10px 12px;font-size:16px;line-height:24px;
}
.patient .fw-select__menu{max-height:min(360px,60vh)}
.p-foot{
  margin-top:32px;text-align:center;color:var(--p-ink-muted);
  font-size:12px;line-height:20px;
}
.p-demo{
  width:100%;max-width:520px;margin:0 0 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 12px;
  border:1px dashed var(--border);border-radius:var(--r-md);
  background:var(--card);color:var(--muted-foreground);
  font-size:13px;line-height:20px;
}
.p-lang{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:0 0 20px;flex-wrap:wrap;
  color:var(--p-ink-muted);
}
.p-lang-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.p-lang-btn{
  appearance:none;cursor:pointer;
  min-height:36px;padding:6px 12px;
  border:1px solid var(--p-rule);border-radius:var(--r-md);
  background:var(--p-paper);color:inherit;
  font-size:13px;line-height:20px;font-weight:500;
  transition:border-color var(--dur-micro) var(--ease-out),
             background-color var(--dur-micro) var(--ease-out),
             box-shadow var(--dur-micro) var(--ease-out);
}
.p-lang-btn:hover{background:var(--accent);border-color:var(--muted-foreground)}
.p-lang-btn[aria-pressed="true"]{
  border-color:var(--primary);background:var(--accent);
  box-shadow:0 0 0 1px var(--primary);font-weight:600;color:var(--p-ink);
}
.patient--embed .p-lang{margin-bottom:16px}
.patient--embed .p-lang-btn{pointer-events:auto}
/* Opacity lives only in keyframes + fill-mode. A static opacity:0 here
   left the preview blank on mobile when the entrance animation never ran. */
.p-view--in-fwd{animation:pInFwd var(--dur-slow) var(--ease-out) both}
.p-view--in-back{animation:pInBack var(--dur-slow) var(--ease-out) both}
.p-view--out-fwd,.p-view--out-back{pointer-events:none}
.p-view--out-fwd{animation:pOutFwd var(--dur-base) var(--ease-out) both}
.p-view--out-back{animation:pOutBack var(--dur-base) var(--ease-out) both}
@keyframes pInFwd{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes pInBack{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
@keyframes pOutFwd{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-16px)}}
@keyframes pOutBack{from{opacity:1;transform:none}to{opacity:0;transform:translateX(16px)}}
.p-seal{
  width:48px;height:48px;border-radius:var(--r-full);margin:0 auto 16px;
  display:grid;place-items:center;background:var(--accent);color:var(--primary);
  border:1px solid var(--border);
  animation:seal var(--dur-page) var(--ease-out) both;
}
@keyframes seal{from{opacity:0;transform:scale(.96)}}

/* utility */
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .kpi-spot .kpi-top{flex-wrap:wrap}

const GATE_HASH = "8c04d88f20cf01cb9d8e48dc75ef6e1d36d810d2b74dbe690603f9cefe370c6e";
async function gateHash(s){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function unlockGate(){
  document.body.classList.remove("is-locked");
  const gate = document.getElementById("gate");

}

  e.preventDefault();
  const err = document.getElementById("gate-err");
  err.textContent = "";
  const ok = await gateHash(document.getElementById("gate-pass").value) === GATE_HASH;
  if(!ok){ err.textContent = "That password doesn't match."; return; }
  sessionStorage.setItem(GATE_KEY, "ok");
  unlockGate();
});

const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const openCount = () => state.alerts.filter(a=>a.status!=="resolved").length;

function surveyPeriod(){
  return `${day(mins(43200))} – ${day(NOW)}`;
}
function liveSurveyStats(){
  const live = state.surveys.filter(s=>s.status==="Live");
  const completed = live.reduce((n,s)=>n+s.responses,0);
  const invited = live.reduce((n,s)=>n+s.sent,0);
  const rate = invited ? Math.round(completed/invited*100) : 0;
  return { live, completed, invited, rate };
}
function oldestOpenWait(){
  const open = state.alerts.filter(a=>a.status!=="resolved");
  if(!open.length) return "—";
  const oldest = open.reduce((a,b)=>a.at<b.at?a:b);
  return ago(oldest.at).replace(" ago","");
}
function cardFunnel(){
  const period = surveyPeriod();
  const { live, completed, invited, rate } = liveSurveyStats();
  const near = rate < 30;
  const low = rate < 25;
  const rateLabel = low ? "Low" : near ? "Near target" : "On target";
  return `
  <section class="fw-card funnel-strip" aria-labelledby="funnel-heading">
    <h2 class="t-h4" id="funnel-heading">Survey response</h2>
    <p class="t-subtle dim mt8">${live.length} live surveys · ${period}</p>
    <div class="funnel-stats">
      <div>
        <div class="stat-k">Invited</div>
        <div class="kpi-v">${invited.toLocaleString("en-US")}</div>
        <p class="stat-sub">Invitations sent</p>
      </div>
      <div>
        <div class="stat-k">Completed</div>
        <div class="kpi-v">${completed.toLocaleString("en-US")}</div>
        <p class="stat-sub">Of ${invited.toLocaleString("en-US")} invited</p>
      </div>
      <div>
        <div class="stat-k">Response rate</div>
        <div class="kpi-v">${rate}%</div>
        <p class="stat-sub"><span class="kpi-delta${near?" is-down":""}">${near?I.trendDown(14):I.trendUp(14)} ${rateLabel}</span> · Target 30%</p>
      </div>
      <div>
        <div class="stat-k">Avg time</div>
        <div class="kpi-v">10 min</div>
        <p class="stat-sub">Per completed survey</p>
      </div>
    </div>
  </section>`;
}
function cardCallback({lead=false}={}){

function crewScoreAggregate(){
  const crew = SCORECARD_CREW;
  const surveys = crew.reduce((n,c)=>n+c.surveys,0);
  const weight = surveys || 1;
  const wavg = key => crew.reduce((n,c)=>n+(Number(c[key])||0)*c.surveys,0)/weight;
  return {
    surveys,
    crewCount: crew.length,
    q1: wavg("q1"),
    rec: Math.round(wavg("rec")),
    listen: Math.round(wavg("listen")),
    care: Math.round(wavg("care")),
    commend: crew.reduce((n,c)=>n+c.commend,0),
    flags: crew.reduce((n,c)=>n+c.flags,0)
  };
}
function kpiMetricGrid(rows, cols){
  return `<div class="funnel-stats funnel-stats--${cols}">
    ${rows.map(h=>`
      <div>
        <div class="stat-k">${esc(h.k)}</div>
        <div class="kpi-v">${esc(h.v)}</div>
        <p class="stat-sub">${h.sub}</p>
      </div>`).join("")}
  </div>`;
}
function kpiTargetLine(ok, target, highIsBad){
  const label = esc(`Target ${target}`);
  if(ok) return `On target · ${label}`;
  const word = highIsBad ? "Above target" : "Below target";
  return `<span class="kpi-delta is-down">${word}</span> · ${label}`;
}
function kpiCompareLine(ok, detail, highIsBad){
  const text = esc(detail);
  if(ok) return text;
  const word = highIsBad ? "Above target" : "Below target";
  return `<span class="kpi-delta is-down">${word}</span> · ${text}`;
}
function cardCrewScorecard(){
  const a = crewScoreAggregate();
  const flagCap = 3 * a.crewCount;
  const rows = [
    { k:"Avg care rating (Q1)", v:`${a.q1.toFixed(1)} / 5`,
      sub: kpiTargetLine(a.q1>=4.0, "4.0 / 5") },
    { k:"Likelihood to recommend (Q2)", v:`${a.rec}%`,
      sub: kpiTargetLine(a.rec>=65, "65%") },
    { k:"Felt listened to (Q3)", v:`${a.listen}% yes`,
      sub: kpiTargetLine(a.listen>=80, "80%") },
    { k:"Felt cared for (Q4)", v:`${a.care}% yes`,
      sub: kpiTargetLine(a.care>=80, "80%") },
    { k:"Commendations", v:String(a.commend),
      sub: "Total across all crew" },
    { k:"Flagged responses", v:String(a.flags),
      sub: kpiTargetLine(a.flags<=flagCap, `≤ ${flagCap}`, true) }
  ];
  return `
  <section class="fw-card crew-kpi-strip" aria-labelledby="crew-kpi-heading">
    <div class="crew-kpi-head">
      <div>
        <h2 class="t-h4" id="crew-kpi-heading">Key metrics</h2>
        <p class="t-subtle dim mt8">Last 30 days · ${a.surveys.toLocaleString("en-US")} responses · ${a.crewCount} crew</p>
      </div>
    </div>
    ${kpiMetricGrid(rows, 3)}
  </section>`;
}

function viewOverview(){

`;
}

function scorecardSurveyRows(c){
  const rows = [
    { k:"Avg care rating (Q1)", v:`${c.q1.toFixed(1)} / 5`,
      sub: kpiCompareLine(c.q1>=4.0, "Agency avg: 4.2 / 5") },
    { k:"Likelihood to recommend (Q2)", v:`${c.rec}%`,
      sub: kpiCompareLine(c.rec>=65, "Agency avg: 69%") }
  ];
  if(c.listen!=null){
    rows.push({ k:"Felt listened to (Q3)", v:`${c.listen}% yes`,
      sub: kpiCompareLine(c.listen>=80, "Agency avg: 79%") });
  }
  if(c.care!=null){
    rows.push({ k:"Felt cared for (Q4)", v:`${c.care}% yes`,
      sub: kpiCompareLine(c.care>=80, "Agency avg: 81%") });
  }
  rows.push(
    { k:"Commendations", v:String(c.commend),
      sub: kpiCompareLine(true, "Agency avg: 6.4 per crew") },
    { k:"Flagged responses", v:String(c.flags),
      sub: kpiCompareLine(c.flags<=3, "Agency avg: 3.8 · lower is better", true) }
  );
  return rows;
}

function scoreCrewSelect(selected){
  const open = !!state.crewSelectOpen;

          </span>

        </div>`;
      }).join("")}

function crewSelectPaint(focus){
  const wrap = document.querySelector(".score-crew-select");
  if(!wrap) return;
  const selected = SCORECARD_CREW[state.scorecardCrew] || SCORECARD_CREW[0];
  const tpl = document.createElement("template");
  tpl.innerHTML = scoreCrewSelect(selected).trim();
  wrap.replaceWith(tpl.content.firstElementChild);
  if(focus!==false) document.getElementById("score-crew-trigger")?.focus();
  if(state.crewSelectOpen) document.querySelector(".score-crew-opt[data-active]")?.scrollIntoView({block:"nearest"});
}
function crewSelectToggle(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  state.crewSelectOpen = !state.crewSelectOpen;
  if(state.crewSelectOpen) state.crewSelectActive = state.scorecardCrew;
  crewSelectPaint();
}
function crewSelectPick(i){
  state.crewSelectOpen = false;
  selectScorecardCrew(i);
}
function crewSelectKey(e){
  const open = !!state.crewSelectOpen;
  const n = SCORECARD_CREW.length;
  if(e.key==="Escape"){
    if(open){ e.preventDefault(); state.crewSelectOpen = false; crewSelectPaint(); }
    return;
  }
  if(e.key==="ArrowDown" || e.key==="ArrowUp"){
    e.preventDefault();
    if(!open){ crewSelectToggle(e); return; }
    const delta = e.key==="ArrowDown" ? 1 : -1;
    state.crewSelectActive = (state.crewSelectActive + delta + n) % n;
    crewSelectPaint();
    return;
  }
  if(e.key==="Home" || e.key==="End"){
    if(!open) return;
    e.preventDefault();
    state.crewSelectActive = e.key==="Home" ? 0 : n-1;
    crewSelectPaint();
    return;
  }
  if((e.key==="Enter" || e.key===" ") && open){
    e.preventDefault();
    crewSelectPick(state.crewSelectActive);
  }
}
function selectScorecardCrew(i){
  const idx = Number(i);
  if(!Number.isInteger(idx) || idx<0 || idx>=SCORECARD_CREW.length) return;
  const changed = state.scorecardCrew !== idx;
  state.scorecardCrew = idx;
  state.crewSelectOpen = false;
  render();
  requestAnimationFrame(()=>{
    if(changed) scrollPageTop();
    if(!window.matchMedia("(max-width: 1080px)").matches) return;
    document.getElementById("score-crew-trigger")?.focus();
  });
}

function triggerRulesTabs(){

        aria-selected="${!inclusion}" ${!inclusion?"data-active":""}

    ${triggerRulesPanel(tab)}

}

function setTriggerRulesTab(tab){
  const next = tab==="exclusion" ? "exclusion" : "inclusion";
  if(state.triggerRulesTab===next) return;
  state.triggerRulesTab = next;
  const host = document.querySelector(".drawer--trigger .trigger-rules");
  if(!host || !state.openTrigger){
    render();
    return;
  }
  const inclBtn = host.querySelector("#trigger-tab-inclusion");
  const exclBtn = host.querySelector("#trigger-tab-exclusion");
  const inclusion = next==="inclusion";
  if(inclBtn){
    inclBtn.setAttribute("aria-selected", inclusion ? "true" : "false");
    if(inclusion) inclBtn.setAttribute("data-active", "");
    else inclBtn.removeAttribute("data-active");
  }
  if(exclBtn){
    exclBtn.setAttribute("aria-selected", inclusion ? "false" : "true");
    if(!inclusion) exclBtn.setAttribute("data-active", "");
    else exclBtn.removeAttribute("data-active");
  }
  const panel = host.querySelector(".fw-tabpanel");
  const wrap = document.createElement("div");
  wrap.innerHTML = triggerRulesPanel(next).trim();
  const nextPanel = wrap.firstElementChild;
  if(!nextPanel){ render(); return; }
  if(panel) panel.replaceWith(nextPanel);
  else host.appendChild(nextPanel);
  (inclusion ? inclBtn : exclBtn)?.focus();
}

function findTriggerDef(id){
  const n = String(id||"").replace(/^#/,"");
  if(!n) return null;
  return TRIGGER_DEFS.find(t=>t.id===n) || null;
}
function formatTriggerId(id){
  const n = String(id||"").replace(/^#/,"");
  return n ? `#${n}` : "";
}
function formatTriggerLabel(t){
  if(!t) return "";
  return `[#${t.id}] ${t.name}`;
}
function surveyActiveTriggerId(s){
  const n = String(s?.triggerId||"").replace(/^#/,"");
  return n || null;
}
function surveyPriorTriggerId(s){
  const n = String(s?.priorTriggerId||"").replace(/^#/,"");
  return n || null;
}
/** Active hold, else released history for ended versions. */
function surveyDisplayTriggerId(s){
  return surveyActiveTriggerId(s) || surveyPriorTriggerId(s);
}
function surveyTriggerReleased(s){
  return !!s && !surveyActiveTriggerId(s) && !!surveyPriorTriggerId(s);
}
/** Clears the live hold but keeps priorTriggerId for display. @returns {string|null} freed id */
function releaseSurveyTrigger(s){
  if(!s) return null;
  const freed = surveyActiveTriggerId(s);
  if(freed) s.priorTriggerId = freed;
  s.triggerId = null;
  return freed;
}
function patientTriggerDefs(){
  return TRIGGER_DEFS.filter(t=>t.patientSurvey!==false);
}
function surveysUsingTrigger(id, exceptId){
  const n = String(id||"").replace(/^#/,"");
  return state.surveys.filter(s=>String(s.triggerId||"").replace(/^#/,"")===n && s.id!==exceptId);
}
function triggerOwner(id, exceptId){
  return surveysUsingTrigger(id, exceptId)[0] || null;
}
function triggerMatchesQuery(t, q){
  if(!q) return true;
  const id = t.id.toLowerCase();
  const name = t.name.toLowerCase();
  return id.includes(q) || name.includes(q) || (`#${id}`).includes(q) || (`[#${id}]`).includes(q);
}
/* Available by default; in-use only when expanded or when search matches them. */
function triggerSelectModel(surveyId){
  const q = (state.triggerSelectQuery||"").trim().toLowerCase();
  const sid = surveyId || currentSurvey()?.id;
  const all = patientTriggerDefs();
  const available = [];
  const inUseAll = [];
  all.forEach(t=>{
    if(triggerOwner(t.id, sid)) inUseAll.push(t);
    else available.push(t);
  });
  const availableShown = available.filter(t=>triggerMatchesQuery(t, q));
  const inUseMatched = inUseAll.filter(t=>triggerMatchesQuery(t, q));
  const includeInUse = !!state.triggerSelectShowUsed || !!q;
  const inUseShown = includeInUse ? inUseMatched : [];
  return {
    q,
    available: availableShown,
    inUse: inUseShown,
    inUseTotal: inUseAll.length,
    inUseMatched: inUseMatched.length,
    includeInUse,
    rows: availableShown.concat(inUseShown)
  };
}
function triggerSelectFiltered(){
  return triggerSelectModel().rows;
}

function triggerDrawer(callId){
  const t = findTriggerDef(callId);

function alertSource(alertId){
  const responses = state.responses || {};
  for(const surveyId of Object.keys(responses)){
    const row = (responses[surveyId]||[]).find(r=>r.alert===alertId);
    if(!row) continue;
    return {
      surveyId,
      responseId: row.id,
      survey: state.surveys.find(s=>s.id===surveyId) || null
    };
  }
  return null;
}
function alertSurveyCell(a){
  const src = alertSource(a.id);
  if(!src?.survey) return `<td class="al-survey dim">—</td>`;
  const trig = surveyDisplayTriggerId(src.survey);
  return `<td class="al-survey">

    ${trig?`<div class="t-subtle">${surveyTriggerCell(src.survey)}</div>`:""}
  </td>`;
}
function alertSourceBlock(a){
  const src = alertSource(a.id);
  if(!src?.survey) return "";
  const id = surveyDisplayTriggerId(src.survey);

  const trigger = id
    ? `${surveyTriggerCell(src.survey)}${t?`<span>${esc(t.name)}</span>`:""}`

<script>
/* ============================================================
   6. SURVEY BUILDER
   ============================================================ */
const TYPE_LABEL = { yesno:"Yes / no", scale:"Rating 1–5", choice:"Multiple choice", text:"Written answer" };

function surveyIdFromHash(){
  const m = (location.hash||"").match(/^#\/surveys\/([^/]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}
function currentSurvey(){ return state.surveys.find(s=>s.id===surveyIdFromHash())||null; }
function qList(){
  const patient = location.hash.startsWith("#/s/") && !location.hash.startsWith("#/surveys");
  const id = patient ? "sv_post" : (surveyIdFromHash() || "sv_post");
  if(!state.surveyQuestions[id]) state.surveyQuestions[id] = [];
  return state.surveyQuestions[id];
}
function syncQuestionCount(id){
  const s = state.surveys.find(x=>x.id===id);
  if(s) s.questions = (state.surveyQuestions[id]||[]).length;
}
function previewQIndex(){
  const qs = qList();
  if(!qs.length) return -1;
  const i = qs.findIndex(q=>q.id===state.previewQId);
  return i>=0 ? i : 0;
}
function selectPreviewQ(id){
  if(state.suppressQClick || state.dragQId) return;
  if(state.previewQId===id) return;
  state.previewQId = id;
  render();
}
function previewQKey(e,id){
  if(e.target!==e.currentTarget) return;
  if(e.key!=="Enter" && e.key!==" ") return;
  e.preventDefault();
  selectPreviewQ(id);
}

function surveyStatusBadge(s){
  if(s.status==="Live") return `<span class="fw-badge fw-badge--success">${I.checkCircle(12)}Live</span>`;
  if(s.status==="Stopped") return `<span class="fw-badge fw-badge--destructive">${I.octagon(12)}Stopped</span>`;
  if(s.status==="Completed") return `<span class="fw-badge fw-badge--secondary">${I.check(12)}Completed</span>`;
  return `<span class="fw-badge fw-badge--secondary">${I.pencil(12)}Draft</span>`;
}
function surveyTriggerCell(s){
  const id = surveyDisplayTriggerId(s);
  if(!id) return `<span class="dim">—</span>`;
  const t = findTriggerDef(id);
  const label = `Open trigger ${formatTriggerId(id)}${t?`, ${t.name}`:""}`;
  return `<button type="button" class="num-link" onclick="openTrigger('${esc(id)}')" aria-label="${esc(label)}">${esc(formatTriggerId(id))}</button>`;
}
function surveyTriggerMeta(s){
  const id = surveyDisplayTriggerId(s);
  if(!id) return "";
  const t = findTriggerDef(id);
  const label = `Open trigger ${formatTriggerId(id)}${t?`, ${t.name}`:""}`;
  return ` · <button type="button" class="num-link" onclick="openTrigger('${esc(id)}')" aria-label="${esc(label)}">${esc(formatTriggerId(id))}</button>`;
}
function surveyTitleMeta(s){
  const qs = (state.surveyQuestions[s.id]||[]).length;
  const n = Number(s.responses)||0;
  const resp = n===1 ? "1 response" : `${n} responses`;
  const trig = surveyTriggerMeta(s);
  if(s.status==="Live"){
    const parts = [];
    if(s.publishedAt) parts.push(`Published ${day(s.publishedAt)}`);
    parts.push(s.endsAt ? `Ends ${day(s.endsAt)}` : "Ongoing");
    parts.push(resp);
    if(s.version>1) parts.push(`v${s.version}`);
    return parts.map(esc).join(" · ")+trig;
  }
  if(s.status==="Draft"){
    const q = qs===1 ? "1 question" : `${qs} questions`;
    return `${q} · Not published${trig}`;
  }
  if(s.status==="Stopped"){
    const parts = [];
    if(s.publishedAt) parts.push(`Published ${day(s.publishedAt)}`);
    parts.push(s.stoppedAt ? `Stopped ${day(s.stoppedAt)}` : "Stopped");
    parts.push(resp);
    if(s.version>1) parts.push(`v${s.version}`);
    return parts.map(esc).join(" · ")+trig;
  }
  if(s.status==="Completed"){
    const parts = [];
    if(s.publishedAt) parts.push(`Published ${day(s.publishedAt)}`);
    parts.push(s.endsAt ? `Ended ${day(s.endsAt)}` : "Completed");
    parts.push(resp);
    if(s.version>1) parts.push(`v${s.version}`);
    return parts.map(esc).join(" · ")+trig;
  }
  return "";
}
function responseCountLink(s){
  if(s.status!=="Live" && s.status!=="Stopped" && s.status!=="Completed") return `<span class="dim">—</span>`;
  const n = s.responses;
  const label = n===1 ? "1 response" : n+" responses";
  return `<a class="num-link" href="#/surveys/${s.id}/responses" aria-label="${label}">${n}</a>`;
}
function responsesFor(id){ return state.responses[id] || []; }
function isResponsesRoute(h){ return /^#\/surveys\/[^/]+\/responses/.test(h || location.hash || ""); }

function triggerSelectOptHtml(model, selected, active, surveyId){
  const { available, inUse, q, inUseTotal, includeInUse } = model;
  if(!available.length && !inUse.length){
    if(q){
      return `<div class="trigger-select-empty">No triggers match that search.</div>`;
    }
    if(inUseTotal){
      return `<div class="trigger-select-empty">All triggers are linked to other surveys. Show in-use triggers to review them.</div>`;
    }
    return `<div class="trigger-select-empty">No triggers available.</div>`;
  }
  let idx = 0;
  const renderRow = (t)=>{
    const i = idx++;
    const on = selected && selected.id===t.id;
    const owner = triggerOwner(t.id, surveyId);
    const taken = !!owner;
    if(taken){
      return `<div class="fw-select__opt trigger-select-opt is-disabled" role="option" id="trigger-select-opt-${i}"
        aria-selected="false" aria-disabled="true"${i===active?" data-active":""}
        onmousedown="event.preventDefault()"
        onclick="triggerSelectTaken('${t.id}')">
        <span class="trigger-select-opt-copy">
          <span class="trigger-select-opt-id">[#${esc(t.id)}]</span>
          <span class="trigger-select-opt-name">${esc(t.name)}</span>
          <button type="button" class="trigger-select-opt-used"
            onmousedown="event.preventDefault()"
            onclick="event.stopPropagation();goToTriggerOwner('${owner.id}')">In use · ${esc(owner.name)}</button>
        </span>
        <span class="fw-badge fw-badge--secondary">In use</span>
      </div>`;
    }
    return `<div class="fw-select__opt trigger-select-opt" role="option" id="trigger-select-opt-${i}"
      aria-selected="${on}"${i===active?" data-active":""}
      onmousedown="event.preventDefault()"
      onclick="triggerSelectPick('${t.id}')">
      <span class="trigger-select-opt-copy">
        <span class="trigger-select-opt-id">[#${esc(t.id)}]</span>
        <span class="trigger-select-opt-name">${esc(t.name)}</span>
      </span>
      ${on?I.check(16):""}
    </div>`;
  };
  let html = available.map(renderRow).join("");
  if(inUse.length){
    html += `<div class="trigger-select-section" aria-hidden="true">In use</div>`;
    html += inUse.map(renderRow).join("");
  }
  return html;
}
function triggerSelectHintHtml(model){
  if(!model.q || state.triggerSelectShowUsed || !model.inUseMatched) return "";
  const n = model.inUseMatched;
  return `<div class="trigger-select-hint" id="trigger-select-hint">${n} match${n===1?"":"es"} in use — shown below.</div>`;
}
function triggerSelectFootHtml(model){
  if(model.q || !model.inUseTotal) return "";
  const n = model.inUseTotal;
  const label = state.triggerSelectShowUsed
    ? "Hide in-use triggers"
    : `Show ${n} in-use trigger${n===1?"":"s"}`;
  return `<div class="trigger-select-foot">
    <button type="button" class="trigger-select-foot-btn" id="trigger-select-foot-btn"
      onmousedown="event.preventDefault()"
      onclick="toggleTriggerSelectShowUsed()">${esc(label)}</button>
  </div>`;
}
function triggerSelect(s){

  const model = triggerSelectModel(s.id);
  const rows = model.rows;
  const active = Math.min(Math.max(0, rows.length-1), Math.max(0, state.triggerSelectActive|0));
  const selected = findTriggerDef(s.triggerId);
  const shown = selected ? formatTriggerLabel(selected) : "Select a trigger to associate with this survey…";
  return `<div class="fw-field">
    <label class="fw-label" id="trigger-select-label" for="trigger-select-trigger">
      Base trigger <span class="fw-label__req" aria-hidden="true">*</span>
    </label>
    <div class="fw-select trigger-select${open?" is-open":""}">
      <button type="button" class="fw-select__trigger" id="trigger-select-trigger"
        aria-haspopup="listbox" aria-expanded="${open}"
        aria-labelledby="trigger-select-label trigger-select-trigger"
        aria-controls="trigger-select-options"
        ${!selected?`data-placeholder`:""}
        ${open && rows.length?`aria-activedescendant="trigger-select-opt-${active}"`:""}
        onclick="triggerSelectToggle(event)"
        onkeydown="triggerSelectKey(event)">${esc(shown)}</button>
      <span class="fw-select__chevron" aria-hidden="true">${I.down(16)}</span>
      ${open?`<div class="fw-select__menu">
        <div class="trigger-select-search">
          <input class="fw-input" id="trigger-select-search" type="search"
            placeholder="Search by ID or name" autocomplete="off"
            value="${esc(state.triggerSelectQuery||"")}"
            aria-label="Filter triggers"
            onkeydown="triggerSelectSearchKey(event)"
            oninput="onTriggerSelectInput(this.value)">
        </div>
        ${triggerSelectHintHtml(model)}
        <div class="trigger-select-list" id="trigger-select-options" role="listbox" aria-labelledby="trigger-select-label">
          ${triggerSelectOptHtml(model, selected, active, s.id)}
        </div>
        ${triggerSelectFootHtml(model)}
      </div>`:""}
    </div>
  </div>`;
}
