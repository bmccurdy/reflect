<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflect — FirstWatch</title>
<link rel="stylesheet" href="vendor/firstwatch/styles.css">
<style>

:root{
  --font:var(--font-sans);
  --r-sm:calc(var(--border-radius-sm) * 1px);
  --r-default:calc(var(--border-radius-default) * 1px);
  --r-md:var(--radius-md);
  --r-lg:var(--radius-lg);
  --r-xl:var(--radius-xl);
  --r-full:var(--radius-full);
  --dur-micro:var(--dur-fast);
  --dur-layout:var(--dur-base);
  --dur-page:var(--dur-slow);
  --ease-spring:var(--ease-out);
  --stagger:50ms;
  --status-critical:var(--semantic-destructive);
  --status-critical-wash:var(--red-50);
  --status-elevated:var(--semantic-warning);
  --status-elevated-wash:var(--amber-50);
  --status-resolved:var(--semantic-success);
  --status-resolved-wash:var(--green-50);
  --status-normal:var(--muted-foreground);
  --status-inactive:var(--neutral-400);
}
html[data-theme="dark"]{
  --status-critical:var(--destructive);
  --status-critical-wash:var(--neutral-800);
  --status-elevated:var(--semantic-warning);
  --status-elevated-wash:var(--neutral-800);
  --status-resolved:var(--semantic-success);
  --status-resolved-wash:var(--neutral-800);
  --status-normal:var(--muted-foreground);
  --status-inactive:var(--neutral-500);
}
html[data-theme="dark"] .shell,
html[data-theme="dark"] .main{
  background:var(--base-black);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-sans);
  font-size:16px;line-height:24px;
  background:var(--background);color:var(--foreground);
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
.w-medium{font-weight:500}.w-semibold{font-weight:600}.w-extrabold{font-weight:700}

button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
:focus:not(:focus-visible){outline:none}
a{color:var(--primary);text-decoration:none}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}

/* ---------- type scale ---------- */
.t-h1{font-size:36px;line-height:40px;font-weight:700;letter-spacing:-.01em}
.t-h2{font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.0075em}
.t-h3{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.006em}
.t-h4{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.005em}
.t-lead{font-size:20px;line-height:28px;font-weight:400}
.t-p{font-size:16px;line-height:28px}
.t-pui{font-size:16px;line-height:24px}
.t-body{font-size:14px;line-height:24px}
.t-subtle{font-size:14px;line-height:20px}
.t-small{font-size:14px;line-height:14px;font-weight:400}
.t-detail{font-size:12px;line-height:20px;font-weight:400;letter-spacing:.01em}
.dim{color:var(--muted-foreground)}

/* Kit cards are slot-based; this prototype uses one padded box. */
.fw-card{padding:24px}
.bento .fw-card,.grid .fw-card{box-shadow:none}
.fw-card-tight{padding:16px}
.fw-navy{background:var(--fw-navy);color:var(--base-white)}
textarea.fw-input{height:auto;min-height:88px;padding:12px;resize:vertical;line-height:24px}
.fw-btn--ghost-destructive{background:transparent;color:var(--destructive)}
.fw-btn--ghost-destructive:hover{background:var(--status-critical-wash);color:var(--destructive-hover)}
a.fw-btn{text-decoration:none}
.fw-btn{line-height:calc(var(--font-leading-5)*1px)}
.fw-btn:not(.fw-btn--icon){height:auto}
.fw-btn:not(.fw-btn--sm):not(.fw-btn--lg):not(.fw-btn--icon){
  min-height:calc(var(--min-width-10)*1px);
  padding:calc(var(--spacing-2-5)*1px) calc(var(--spacing-4)*1px);
}
.fw-btn--sm:not(.fw-btn--icon){
  min-height:calc(var(--min-width-8)*1px);
  padding:calc(var(--spacing-1-5)*1px) calc(var(--spacing-3)*1px);
}
.fw-btn--lg:not(.fw-btn--icon){
  min-height:calc(var(--min-width-11)*1px);
  padding:calc(var(--spacing-3)*1px) calc(var(--spacing-6)*1px);
}

/* ---------- app shell ---------- */
.shell{min-height:100vh;display:flex;flex-direction:column;background:var(--muted);min-width:0}
.topbar{
  height:56px;flex:0 0 auto;display:flex;align-items:center;gap:16px;
  padding:0 24px;background:var(--fw-navy);color:var(--base-white);
  position:sticky;top:0;z-index:40;
}
.topbar :focus-visible{outline-color:var(--base-white)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;font-size:16px;color:var(--base-white)}
.brand-mark{
  width:24px;height:24px;display:block;flex:0 0 auto;
}
.brand-sub{color:color-mix(in srgb,var(--base-white) 72%,transparent);font-weight:400;font-size:14px}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{
  display:flex;align-items:center;height:32px;padding:0 12px;
  border-radius:var(--r-sm);font-size:14px;font-weight:500;
  color:color-mix(in srgb,var(--base-white) 72%,transparent);
  transition:background-color var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out);
}
.nav a:hover{background:color-mix(in srgb,var(--base-white) 12%,transparent);color:var(--base-white)}
.nav a[aria-current="page"]{background:color-mix(in srgb,var(--base-white) 16%,transparent);color:var(--base-white)}
.nav .count,
.nav-drawer-links .count{
  margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-full);
  background:var(--status-critical);color:var(--base-white);font-size:11px;line-height:18px;
  text-align:center;font-weight:700;
}
.spacer{flex:1}

/* demo-only affordance — see docs/decisions.md #1 */
.demo-switch{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--neutral-200);border-radius:var(--r-md);padding:4px;gap:2px}
.seg button{
  height:28px;padding:0 10px;border:0;background:transparent;border-radius:var(--r-sm);
  font-size:13px;font-weight:500;color:var(--muted-foreground);cursor:pointer;
  transition:all var(--dur-micro) var(--ease-out);
}
.seg button[aria-pressed="true"]{background:var(--background);color:var(--foreground);box-shadow:var(--shadow-sm)}
.topbar .seg{background:color-mix(in srgb,var(--base-white) 12%,transparent)}
.topbar .seg button{color:color-mix(in srgb,var(--base-white) 72%,transparent)}
.topbar .seg button[aria-pressed="true"]{background:var(--base-white);color:var(--fw-navy);box-shadow:none}
.topbar .iconbtn{color:color-mix(in srgb,var(--base-white) 80%,transparent)}
.topbar .iconbtn:hover{background:color-mix(in srgb,var(--base-white) 12%,transparent);color:var(--base-white)}
.iconbtn.nav-toggle{display:none}

.nav-scrim{
  position:fixed;inset:56px 0 0;z-index:80;
  background:var(--overlay);
  opacity:0;pointer-events:none;
  transition:opacity var(--dur-base) var(--ease-out);
}
.nav-scrim.is-open{opacity:1;pointer-events:auto}
.nav-drawer{
  position:fixed;top:56px;left:0;bottom:0;z-index:81;
  width:min(320px,86vw);
  display:flex;flex-direction:column;
  background:var(--card);color:var(--foreground);
  border-right:1px solid var(--border);
  box-shadow:var(--shadow-xl);
  transform:translateX(-100%);
  pointer-events:none;
  transition:transform var(--dur-slow) var(--ease-out);
}
.nav-drawer.is-open{transform:translateX(0);pointer-events:auto}
.nav-drawer-head{display:none}
.nav-drawer-links{
  display:flex;flex-direction:column;gap:4px;
  padding:12px;margin:0;flex:1;overflow:auto;
}
.nav-drawer-links a{
  display:flex;align-items:center;min-height:44px;padding:0 12px;
  border-radius:var(--r-md);font-size:16px;font-weight:600;
  color:var(--foreground);
}
.nav-drawer-links a:hover{background:var(--surface-hover);color:var(--foreground)}
.nav-drawer-links a[aria-current="page"]{
  background:var(--accent);color:var(--primary);
}
.nav-drawer-links .count{
  margin-left:auto;
}
.nav-drawer-foot{
  display:none;
  flex-direction:column;
  padding:16px;border-top:1px solid var(--border);
}
.nav-drawer-foot .brand-sub{display:block;margin-bottom:12px;color:var(--muted-foreground)}
.nav-drawer-foot .seg{width:100%}
.nav-drawer-foot .seg button{flex:1}
body.nav-open,body.drawer-open{overflow:hidden}
html[data-theme="dark"] .seg{background:var(--neutral-900)}
html[data-theme="dark"] .topbar .seg{background:color-mix(in srgb,var(--base-white) 12%,transparent)}

.main{flex:1;padding:32px 24px 96px;max-width:1280px;width:100%;margin:0 auto;background:var(--muted);overflow-x:clip;min-width:0}
.page-head{margin-bottom:24px}
.title-edit{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.title-edit-hit{
  display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%;
  margin:0;padding:0;border:0;background:transparent;
  font:inherit;color:inherit;letter-spacing:inherit;text-align:left;cursor:pointer;
  border-radius:var(--r-sm);
}
.title-edit-pen{
  flex:0 0 auto;display:grid;place-items:center;
  width:16px;height:16px;background:transparent;
  color:var(--muted-foreground);opacity:0;
  transition:opacity var(--dur-micro) var(--ease-out);
}
.title-edit-hit:hover .title-edit-pen,
.title-edit-hit:focus-visible .title-edit-pen{opacity:1}
@media (hover:none){
  .title-edit-pen{opacity:1}
  .iconbtn,.topbar .iconbtn.nav-toggle{
    width:44px;height:44px;
  }
}
.title-edit-input{
  width:min(36rem,100%);max-width:100%;
  height:auto;min-height:40px;padding:4px 12px;
  font-size:inherit;line-height:inherit;font-weight:inherit;letter-spacing:inherit;
}
.title-edit-field{
  position:relative;flex:1 1 auto;min-width:0;width:100%;max-width:36rem;
}
.title-edit-field .title-edit-input{width:100%;max-width:none;padding-right:76px}
.title-edit-actions{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:2px;
}
.title-edit-save.iconbtn{color:var(--status-resolved)}
.title-edit-save.iconbtn:hover{background:var(--status-resolved-wash);color:var(--status-resolved)}
.title-edit-cancel.iconbtn{color:var(--muted-foreground)}
.crumbs{display:flex;gap:8px;align-items:center;font-size:14px;line-height:20px;color:var(--muted-foreground);margin-bottom:8px}
.crumbs .sep{opacity:.5}
.page-back{
  display:none;
  align-items:center;gap:4px;
  min-height:44px;margin:0 0 4px;padding:0;
  min-width:0;max-width:100%;
  font-size:14px;line-height:20px;font-weight:500;color:var(--primary);
  text-decoration:none;border-radius:var(--r-sm);
}
.page-back:hover{text-decoration:underline}
.drawer-back{
  display:none;
  align-items:center;gap:4px;
  margin:0 0 4px -8px;padding:0 8px;
  min-height:44px;border:0;background:transparent;
  font:inherit;font-size:14px;line-height:20px;font-weight:500;
  color:var(--primary);cursor:pointer;border-radius:var(--r-sm);
}
.drawer-back:hover{background:var(--surface-hover)}
.rs-filters{margin-top:16px}
.rs-filters button{white-space:nowrap}
.rs-more{padding:8px 16px 16px;text-align:center}
.rs-excerpt{
  color:var(--foreground);font-size:16px;line-height:24px;font-weight:600;
  max-width:42rem;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;
  overflow:hidden;
}
.rs-call{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:6px;color:var(--foreground);font-weight:500;
}
.rs-go{width:40px;text-align:right;vertical-align:middle;color:var(--muted-foreground)}
.rs-meta{display:none}
.rs-flags{white-space:nowrap}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.page-head .between > div:first-child{flex:1 1 auto;min-width:0}
.page-head .title-edit{width:100%}
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.sec{margin-top:24px}

/* stale banner */
.stale{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;border:1px solid var(--border);border-radius:var(--r-lg);
  background:var(--card);color:var(--muted-foreground);
  font-size:14px;line-height:20px;margin-bottom:16px;
}
.stale-banner{
  margin-bottom:16px;padding: 8px 16px;align-items:center;
  background:color-mix(in srgb,var(--status-elevated) 10%,var(--card));
}
.stale-banner .fw-alert__icon{margin-top:0}
.stale-banner .fw-alert__desc{flex:1}
.stale-banner__close{margin-left:auto;color:var(--muted-foreground)}
.stale__action{margin-left:auto;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:var(--r-full);background:var(--status-elevated);flex:0 0 auto}

.stat-cell{
  background:var(--card);color:var(--foreground);
  border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px;min-height:0;
  display:flex;flex-direction:column;justify-content:center;
  text-align:left;
}
.stat-v{
  font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.02em;
  color:var(--foreground);
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
}
.stat-k{
  font-size:12px;line-height:16px;font-weight:500;
  color:var(--muted-foreground);margin-top:6px;
  text-transform:none;letter-spacing:0;
}
.stat-v.muted{color:var(--muted-foreground)}
.stat-v.good{color:var(--status-resolved)}
.stat-v.elevated{color:var(--status-elevated)}
.stat-unit{color:var(--muted-foreground);font-weight:400;font-size:14px;letter-spacing:0}
.stat-flag{
  display:inline-flex;align-items:center;
  height:20px;padding:0 8px;border-radius:var(--r-full);
  font-size:12px;line-height:20px;font-weight:600;
  color:var(--status-elevated);
  background:var(--status-elevated-wash);
  border:1px solid var(--status-elevated);
}
.stat-wash-num{
  display:inline-block;
  background:var(--status-resolved-wash);
  padding:2px 8px;border-radius:var(--r-md);
}

.bento > *,
.grid > *,
.funnel-stats > *,
.spot-split > *{min-width:0}
.funnel-strip{margin:16px 0 0;overflow:hidden}
.funnel-stats{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:0;margin-top:16px;
  border-top:1px solid var(--border);
}
.funnel-stats > div{padding:16px 16px 16px 0;min-width:0}
.funnel-stats > div + div{padding-left:16px;border-left:1px solid var(--border)}
.funnel-stats .stat-k{
  margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.funnel-stats .stat-sub{margin-top:8px}
.kpi{
  display:flex;flex-direction:column;gap:8px;
  background:var(--card);
  color:var(--foreground);
  border:1px solid var(--border);border-radius:var(--r-xl);
  padding:16px 18px;
  box-shadow:var(--shadow-sm);
  min-height:0;
}
.kpi-top{display:flex;align-items:center;gap:10px}
.kpi-label{flex:1;font-size:16px;line-height:24px;font-weight:600}
.kpi-delta{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;line-height:16px;font-weight:600;color:var(--primary);
}
.kpi-delta.is-down{color:var(--status-elevated)}
.kpi-v{
  font-size:28px;line-height:32px;font-weight:600;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  min-width:0;
}
.kpi-v--lead{
  font-size:36px;line-height:40px;font-weight:700;letter-spacing:-.01em;
}
.funnel-stats .kpi-v{
  font-size:20px;line-height:28px;font-weight:600;
}
.kpi-foot{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  flex-wrap:wrap;
  padding-top:12px;border-top:1px solid var(--border);
  color:var(--muted-foreground);font-size:12px;line-height:16px;
}
.kpi-foot .row{gap:6px}
.bento{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:auto 1fr auto;
  gap:16px;
  align-items:stretch;
}
.kpi-spot{
  display:grid;
  grid-template-rows:subgrid;
  grid-row:span 3;
  gap:16px;
  padding:0;
}
.bento .fw-card.kpi-spot{box-shadow:var(--shadow-sm);padding:0}
.kpi-spot .kpi-top{align-items:flex-start;padding:20px 24px 0}
.kpi-head{flex:1;min-width:0}
.kpi-head .t-subtle{margin-top:4px}
.kpi-spot--good .kpi-delta{color:var(--status-resolved)}
.spot-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:end;align-self:end;min-width:0;padding:0 24px}
.kpi-spot .kpi-foot{padding:12px 24px 20px}
.spot-split > div + div{border-left:1px solid var(--border);padding-left:16px}
.al-reason{font-weight:700}
.al-meta{display:none;margin-top:8px;color:var(--muted-foreground);font-size:13px;line-height:20px}

/* queue table */
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl thead tr{background:var(--surface-hover)}
.tbl th{
  text-align:left;padding:12px 16px;height:48px;
  font-size:14px;line-height:20px;font-weight:500;color:var(--muted-foreground);
  border-bottom:1px solid var(--border);white-space:nowrap;
  background:var(--surface-hover);
  position:sticky;top:56px;z-index:3;
}
.tbl thead tr + tr th{top:104px}
.tbl td{padding:16px;font-size:16px;line-height:24px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.clickable{cursor:pointer;transition:background-color var(--dur-micro) var(--ease-out)}
.tbl tbody tr.clickable:active{background:var(--accent)}
@media (hover:hover){
  .tbl tbody tr.clickable:hover{background:var(--accent)}
}
.tbl .fav{width:52px;padding-left:12px;padding-right:0;vertical-align:middle}
.tbl .morecol{width:52px;padding-left:8px;padding-right:12px;text-align:right;vertical-align:middle}
.star-btn{color:var(--muted-foreground)}
.star-btn:hover{color:var(--primary)}
.star-btn[aria-pressed="true"]{color:var(--primary)}

.menu-catch{position:fixed;inset:0;z-index:28}
.menu-wrap{position:relative;display:inline-flex}
.menu-wrap.open{z-index:31}
.tbl .morecol:has(.menu-wrap.open){position:relative;z-index:31}
.menu{
  position:absolute;right:0;top:calc(100% + 4px);
  min-width:196px;padding:6px;z-index:32;
  background:var(--popover);color:var(--popover-foreground);
  border:1px solid var(--border);border-radius:var(--r-xl);
  box-shadow:var(--shadow-lg);
  animation:pop var(--dur-layout) var(--ease-out);
}
.menu button{
  display:flex;align-items:center;gap:10px;width:100%;
  height:36px;padding:0 10px;border:0;background:transparent;
  border-radius:var(--r-md);cursor:pointer;text-align:left;
  font-size:14px;line-height:20px;font-weight:400;color:inherit;
}
.menu button:hover{background:var(--muted)}
.menu button.danger{color:var(--destructive)}
.menu button.danger:hover{background:var(--status-critical-wash)}
.menu-sep{height:1px;background:var(--border);margin:6px 4px}
.tbl tbody tr.resolving{animation:resolveOut var(--dur-layout) var(--ease-out) forwards}
@keyframes resolveOut{to{opacity:0;transform:translateX(8px)}}
.snip{color:var(--muted-foreground);font-size:14px;line-height:20px;max-width:420px}
.mono{font-family:var(--font-mono);font-size:14px;font-weight:700}

.fw-card-flush{padding:0;overflow:visible}
.tbl-inset{padding:0}
.fw-card:has(table.tbl),
.fw-card-flush:has(table.tbl){overflow:visible}
.fw-card-head{
  padding:16px 24px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fw-card--dashed{border-style:dashed}
.live-tag{
  display:flex;align-items:center;gap:6px;
  font-size:13px;line-height:20px;font-weight:600;color:var(--status-resolved);
}
.live-dot{
  width:8px;height:8px;border-radius:var(--r-full);
  background:var(--status-resolved);flex:0 0 auto;
  animation:livePulse 2s var(--ease-out) infinite;
}
@keyframes livePulse{50%{opacity:.35}}
.rule{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--r-md);
  font-size:14px;line-height:20px;
  border:1px solid transparent;
}
.rule-list{display:flex;flex-direction:column;gap:6px}
.rule--in{
  background:var(--status-resolved-wash);
  border-color:color-mix(in srgb,var(--status-resolved) 22%,var(--border));
}
.rule--out{
  background:var(--status-critical-wash);
  border-color:color-mix(in srgb,var(--status-critical) 22%,var(--border));
}
.rule-ico{flex:0 0 auto;display:grid;place-items:center}
.rule--in .rule-ico{color:var(--status-resolved)}
.rule--out .rule-ico{color:var(--status-critical)}
.icon-yes{color:var(--status-resolved)}
.icon-no{color:var(--muted-foreground)}
.tbl--encounters .enc-mobile{white-space:nowrap}
.rule-head{margin-bottom:14px}
.rule-head--in{color:var(--status-resolved)}
.rule-head--out{color:var(--status-critical)}
.timing{align-items:flex-start;gap:16px}

.score-hero{
  display:flex;align-items:center;gap:14px;
  padding:16px 24px;
  background:var(--card);
  border-bottom:1px solid var(--border);
}
.score-hero .fw-avatar{
  background:var(--accent);
  color:var(--primary);
}
.score-hero-name{font-size:16px;line-height:24px;font-weight:700}
.score-hero-meta{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.stat-cell--accent{border-top:3px solid var(--stat-accent,var(--primary))}
.stat-cell--accent .stat-k{margin-top:0;margin-bottom:4px}
.stat-sub{font-size:12px;line-height:16px;color:var(--muted-foreground);margin-top:6px}
.tbl-wrap{overflow:visible}
.tbl th.group{text-align:center;background:var(--secondary);color:var(--secondary-foreground);font-weight:600}
.tbl th.group-sys{background:var(--neutral-200);color:var(--muted-foreground)}
html[data-theme="dark"] .tbl th.group-sys{background:var(--muted);color:var(--muted-foreground)}
.tbl .comp{font-weight:700}
.comp--good{color:var(--status-resolved)}
.comp--ok{color:var(--primary)}
.comp--warn{color:var(--status-elevated)}
.comp--bad{color:var(--status-critical)}
.score-meter{height:5px;margin:8px 0}
.score-split{
  display:grid;
  grid-template-columns:minmax(240px,28%) minmax(0,1fr);
  gap:24px;
  align-items:start;
}
.score-index{
  position:sticky;top:72px;z-index:2;
  min-width:0;
}
.score-detail{min-width:0}
.crew-list{margin:0;padding:8px;list-style:none}
.crew-item{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  grid-template-areas:"name unit" "meta meta";
  align-items:baseline;
  column-gap:12px;
  row-gap:4px;
  width:100%;
  margin:0;
  padding:12px;
  border:1px solid transparent;
  border-radius:var(--r-md);
  background:transparent;
  color:inherit;
  text-align:left;
  cursor:pointer;
  transition:background-color var(--dur-micro) var(--ease-out),
             border-color var(--dur-micro) var(--ease-out);
}
.crew-item:hover{background:var(--surface-hover)}
.crew-item[aria-current="true"]{
  background:var(--accent);
  border-color:var(--primary);
}
.crew-item[aria-current="true"]:hover{background:var(--accent)}
.crew-item-name{grid-area:name;font-weight:700;font-size:16px;line-height:24px}
.crew-item-unit{
  grid-area:unit;
  font-family:var(--font-mono);font-size:13px;line-height:20px;font-weight:700;
  color:var(--muted-foreground);
}
.crew-item-meta{
  grid-area:meta;
  font-size:13px;line-height:20px;
  color:var(--muted-foreground);
}
.flag-hot{color:var(--status-critical);font-weight:700}
.score-empty{padding:8px 0 4px}

.commend{border-left:3px solid var(--primary);margin-bottom:12px}
.commend:last-child{margin-bottom:0}
.commend-meta{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.commend-quote{font-size:14px;line-height:22px;margin:12px 0}
.commend-by{font-size:12px;line-height:16px;color:var(--muted-foreground);margin-bottom:12px}
.commend-actions{display:flex;flex-wrap:wrap;gap:8px}
.blink-board{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--muted)}
.blink-board-bar{
  display:flex;align-items:baseline;gap:8px;
  padding:12px 16px;background:var(--fw-navy);color:var(--base-white);
}
.blink-board-title{font-size:14px;line-height:20px;font-weight:700}
.blink-board-sub{font-size:12px;line-height:16px;color:color-mix(in srgb,var(--base-white) 72%,transparent)}
.blink-feed{padding:12px;display:flex;flex-direction:column;gap:10px}
.blink-post{
  background:var(--card);color:var(--foreground);
  border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;
}
.blink-post-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.blink-post-head > div{flex:1;min-width:0}
.blink-post-status{margin-left:auto;flex:0 0 auto}
.blink-post-name{font-size:14px;line-height:20px;font-weight:600}
.blink-post-to,.blink-post-by{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.blink-post-text{font-size:14px;line-height:22px;margin-top:4px}
.blink-empty{text-align:center;padding:32px 16px;color:var(--muted-foreground)}
.col-start{align-items:start}

.ans{padding:12px 0;border-bottom:1px solid var(--border)}
.ans:last-child{border-bottom:0}
.num-link{color:var(--primary);font-weight:700;text-decoration:none}
.num-link:hover{text-decoration:underline}

.empty{padding:64px 24px;text-align:center}
.empty .t{font-size:20px;line-height:28px;font-weight:700}
.empty .s{color:var(--muted-foreground);margin-top:8px}

/* drawer */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:90;
  animation:fade var(--dur-layout) var(--ease-out);
}
@keyframes fade{from{opacity:0}}
.drawer{
  position:fixed;top:0;right:0;bottom:0;left:auto;
  width:min(560px,100%);max-width:100%;z-index:91;
  display:flex;flex-direction:column;
  background:var(--card);border-left:1px solid var(--border);
  box-shadow:var(--shadow-xl);overflow:hidden;
  transform:translate3d(100%,0,0);
  transition:transform var(--dur-page) var(--ease-out);
}
.drawer.is-open{transform:translate3d(0,0,0)}
.drawer.is-paging{transition:none}
.drawer.is-paging .drawer-head,
.drawer.is-paging .drawer-body > *{animation:none}
.drawer-head{
  position:relative;z-index:2;flex:0 0 auto;
  background:var(--card);border-bottom:1px solid var(--border);
  padding:20px 24px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;
  animation:drawerDataIn var(--dur-page) var(--ease-out) both;
  animation-delay:40ms;
}
.drawer-foot{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:12px 24px;
  border-top:1px solid var(--border);background:var(--card);
}
.drawer-foot .fw-btn{flex:1}
.drawer-foot--alert{flex-wrap:wrap}
.drawer-foot--alert .fw-btn{flex:1 1 auto}
.drawer-pos{
  flex:0 0 auto;min-width:4.5rem;text-align:center;
  font-size:13px;line-height:20px;color:var(--muted-foreground);
}
.drawer-body{
  flex:1 1 auto;min-height:0;padding:24px;
  overflow-x:hidden;overflow-y:auto;
}
.drawer-body > :first-child{margin-top:0}
.drawer-body > *{
  animation:drawerDataIn var(--dur-page) var(--ease-out) both;
  animation-delay:calc(70ms + (var(--i,0) * 40ms));
}
.drawer-body > *:nth-child(1){--i:0}
.drawer-body > *:nth-child(2){--i:1}
.drawer-body > *:nth-child(3){--i:2}
.drawer-body > *:nth-child(4){--i:3}
.drawer-body > *:nth-child(5){--i:4}
.drawer-body > *:nth-child(6){--i:5}
.drawer-body > *:nth-child(7){--i:6}
@keyframes drawerDataIn{from{opacity:0;transform:translate3d(24px,0,0)}}

.dialog-wrap{
  position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:24px;
}
.dialog{
  width:min(440px,100%);
  background:var(--card);color:var(--card-foreground);
  border:1px solid var(--border);border-radius:var(--r-xl);
  box-shadow:var(--shadow-xl);padding:24px;
  animation:rise var(--dur-layout) var(--ease-out);
}
.dialog-icon{
  width:40px;height:40px;border-radius:var(--r-lg);
  display:grid;place-items:center;
  background:var(--status-critical-wash);color:var(--destructive);
  margin-bottom:16px;
}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:132px 1fr;gap:8px 16px;font-size:14px;line-height:20px}
.kv dt{color:var(--muted-foreground)}
.kv dd{margin:0}
.quote{
  border-left:3px solid var(--primary);padding:4px 0 4px 16px;margin:0 0 16px;
  font-size:16px;line-height:28px;
}
.log{border-top:1px solid var(--border);margin-top:24px;padding-top:16px}
.log li{padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;line-height:20px}
.log li:last-child{border-bottom:0}

/* builder */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:24px;align-items:start}
.preview-col{align-self:stretch}
.preview-sticky{
  position:sticky;top:72px;z-index:20;
  background:transparent;
}
.qcard{
  border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);
  color:var(--card-foreground);
  padding:16px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;
  transition:border-color var(--dur-micro) var(--ease-out),
             box-shadow var(--dur-micro) var(--ease-out),
             background-color var(--dur-micro) var(--ease-out);
}
.qcard-out{animation:qcardOut var(--dur-layout) var(--ease-out) forwards;pointer-events:none}
.qcard-in{animation:rise var(--dur-layout) var(--ease-out) both}
@keyframes qcardOut{to{opacity:0;transform:translateY(-6px)}}
.qcard:hover{border-color:var(--muted-foreground);box-shadow:var(--shadow-sm)}
.qcard.locked{background:var(--muted)}
.qcard-select{cursor:pointer}
.qcard-select.selected{
  border-color:var(--primary);
  box-shadow:0 0 0 1px var(--primary);
  background:var(--accent);
}
.qcard-select.locked.selected{
  background:color-mix(in srgb,var(--accent) 55%,var(--muted));
}
.qcard.added{background:var(--muted);opacity:.7}
.qcard.added:hover{border-color:var(--border);box-shadow:none}
.lib-filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.lib-chip{
  display:inline-flex;align-items:center;justify-content:center;
  height:28px;padding:0 12px;border-radius:var(--r-full);
  border:1px solid var(--border);background:var(--card);
  font-size:12px;line-height:1;font-weight:600;
  color:var(--muted-foreground);cursor:pointer;
  transition:background-color var(--dur-micro) var(--ease-out),
             color var(--dur-micro) var(--ease-out),
             border-color var(--dur-micro) var(--ease-out);
}
.lib-chip:hover{background:var(--accent);color:var(--accent-foreground)}
.lib-chip[aria-pressed="true"]{
  background:var(--primary);color:var(--primary-foreground);border-color:var(--primary);
}
.lib-chip[aria-pressed="true"]:hover{background:var(--primary-hover);color:var(--primary-foreground)}
.lib-list{margin-top:16px;max-height:360px;overflow-y:auto}
.grip{
  color:var(--muted-foreground);cursor:grab;line-height:1;
  padding:4px 2px;margin:-4px 0;flex-shrink:0;user-select:none;
}
.grip:active{cursor:grabbing}
.qcard.is-dragging{opacity:.45}
.qcard.drop-before,.qcard.drop-after{position:relative}
.qcard.drop-before::before,
.qcard.drop-after::after{
  content:"";position:absolute;left:8px;right:8px;height:2px;
  background:var(--primary);border-radius:1px;pointer-events:none;z-index:1;
}
.qcard.drop-before::before{top:-5px}
.qcard.drop-after::after{bottom:-5px}
.qmeta{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.qcard-body{flex:1;min-width:0}
.qbtns{display:flex;gap:4px;margin-left:auto}
.iconbtn{
  width:32px;height:32px;border:0;background:transparent;border-radius:var(--r-sm);
  color:var(--muted-foreground);cursor:pointer;display:grid;place-items:center;
  transition:background-color var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out);
}
.iconbtn svg{pointer-events:none}
.iconbtn:hover{background:var(--accent);color:var(--accent-foreground)}
.iconbtn[disabled]{opacity:.5;cursor:not-allowed}
.phone-frame{
  border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden;
  background:var(--muted);
}
.phone-frame .cap{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;font-size:12px;line-height:20px;color:var(--muted-foreground);
  border-bottom:1px solid var(--border);background:var(--card);
}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.preview-overlay{
  position:fixed;inset:0;z-index:56;
  display:flex;flex-direction:column;
  background:var(--muted);
  animation:fade var(--dur-layout) var(--ease-out);
}
.preview-bar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:10px 16px;background:var(--card);color:var(--card-foreground);
  border-bottom:1px solid var(--border);
}
.preview-bar .t{font-size:14px;line-height:20px;font-weight:700}
.preview-bar .s{font-size:13px;line-height:20px;font-weight:400;color:var(--muted-foreground)}
.preview-stage{flex:1;overflow-y:auto}
.preview-stage .patient{min-height:100%;padding-top:32px}

/* leadership */
.bars{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.bar-row{display:grid;grid-template-columns:180px 1fr 56px;gap:12px;align-items:center;font-size:14px;line-height:20px}
.bar{height:8px;border-radius:var(--r-full);background:var(--muted);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--r-full);background:var(--primary);
  transform-origin:0 50%}
html.is-route-enter .bar i{animation:grow var(--dur-page) var(--ease-out) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.gap-flag{color:var(--status-elevated);font-weight:700}

/* stagger entrance */
.stagger>*{animation:rise var(--dur-page) var(--ease-out) both;animation-delay:calc(var(--i,0)*var(--stagger))}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}

.fw-toaster{z-index:200}

.topbar{view-transition-name:fw-topbar}
.main{view-transition-name:fw-main}
::view-transition-old(fw-main){animation:vtOut var(--dur-page) var(--ease-out) both}
::view-transition-new(fw-main){animation:vtIn var(--dur-page) var(--ease-out) both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(6px)}}

/* Patient survey — letter surface. --p-* stays scoped here. */
.patient{
  --p-paper:var(--neutral-50);
  --p-ink:var(--foreground);
  --p-ink-muted:var(--muted-foreground);
  --p-rule:var(--border);
  min-height:100vh;background:var(--p-paper);color:var(--p-ink);
  display:flex;flex-direction:column;align-items:center;
  padding:32px 24px 64px;
}
html[data-theme="dark"] .patient{
  --p-paper:var(--neutral-900);
}
.patient--embed{min-height:0;padding:20px 16px 28px}
.patient--embed .p-opt,
.patient--embed .p-scale-btn{pointer-events:none}
.p-wrap{width:100%;max-width:520px}
.p-lock{
  display:flex;align-items:center;gap:8px;justify-content:center;
  color:var(--p-ink-muted);font-size:12px;line-height:20px;margin-bottom:24px;
}
.p-card{padding:0;background:transparent;border:0;box-shadow:none;border-radius:0}
.p-card.p-done{text-align:center}
.p-progress{display:flex;gap:6px;margin-bottom:20px}
.p-progress i{
  height:4px;flex:1;border-radius:var(--r-full);background:var(--p-rule);
  transition:background-color var(--dur-layout) var(--ease-out);
}
.p-progress i.done{background:var(--primary)}
.p-progress i.now{background:var(--foreground)}
.p-step{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.patient .dim{color:var(--p-ink-muted)}

.p-opts{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.p-opt{
  display:flex;align-items:center;gap:12px;width:100%;min-height:48px;
  padding:12px 16px;text-align:left;cursor:pointer;appearance:none;
  background:var(--p-paper);border:1px solid var(--p-rule);border-radius:var(--r-md);
  font-size:16px;line-height:24px;color:inherit;
  transition:border-color var(--dur-micro) var(--ease-out),
             background-color var(--dur-micro) var(--ease-out),
             box-shadow var(--dur-micro) var(--ease-out);
}
.p-opt:hover{background:var(--accent);border-color:var(--muted-foreground)}
.p-opt[aria-pressed="true"]{
  border-color:var(--primary);background:var(--accent);
  box-shadow:0 0 0 1px var(--primary);font-weight:600;
}
.p-tick{
  width:18px;height:18px;border-radius:var(--r-full);flex:0 0 auto;
  border:1px solid var(--border-strong);background:var(--surface);
  display:grid;place-items:center;
  transition:border-color var(--dur-micro) var(--ease-out);
}
.p-opt[aria-pressed="true"] .p-tick{border-color:var(--primary)}
.p-opt[aria-pressed="true"] .p-tick::after{
  content:"";width:10px;height:10px;border-radius:var(--r-full);background:var(--primary);
}

.p-scale{display:flex;gap:8px;margin-top:20px}
.p-scale-btn{
  flex:1;min-height:56px;border-radius:var(--r-md);cursor:pointer;appearance:none;
  border:1px solid var(--p-rule);background:var(--p-paper);color:inherit;
  font-size:16px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:border-color var(--dur-micro) var(--ease-out),
             background-color var(--dur-micro) var(--ease-out),
             color var(--dur-micro) var(--ease-out);
}
.p-scale-btn span{font-size:11px;font-weight:500;color:var(--muted-foreground)}
.p-scale-btn:hover{background:var(--accent);border-color:var(--muted-foreground)}
.p-scale-btn[aria-pressed="true"]{
  background:var(--primary);border-color:var(--primary);color:var(--primary-foreground);
}
.p-scale-btn[aria-pressed="true"] span{color:color-mix(in srgb,var(--primary-foreground) 85%,transparent)}

.p-fields{margin-top:20px}
.p-fields .fw-textarea{min-height:120px}
.p-count{margin-top:8px;text-align:right}

.p-actions{display:flex;gap:12px;align-items:flex-start;margin-top:24px;width:100%}
.p-cta{flex:1;display:flex;flex-direction:column;align-items:stretch;min-width:0}
.p-cta .p-next,.p-actions > .p-next{align-self:stretch;width:100%}
.p-back{margin-top:12px;min-height:0;height:auto;padding:0}
.p-fieldset{border:0;padding:0;margin:16px 0 0}
.patient .fw-select__trigger{
  min-height:48px;height:48px;padding:0 40px 0 12px;
  background:var(--p-paper);color:inherit;
}
.patient .fw-select__trigger:focus,
.patient .fw-select__trigger:focus-visible{
  box-shadow:none;
  outline:2px solid var(--ring);
  outline-offset:2px;
}
.patient .fw-select__chevron{
  right:12px;color:var(--p-ink-muted);
  transition:transform var(--dur-micro) var(--ease-out);
}
.patient .fw-select.is-open .fw-select__chevron{
  transform:translateY(-50%) rotate(180deg);
}
.patient .fw-select__opt{
  min-height:44px;padding:10px 12px;font-size:16px;line-height:24px;
}
.patient .fw-select__menu{max-height:min(360px,60vh)}
.p-foot{
  margin-top:32px;text-align:center;color:var(--p-ink-muted);
  font-size:12px;line-height:20px;
}
.p-demo{
  width:100%;max-width:520px;margin:0 0 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 12px;
  border:1px dashed var(--border);border-radius:var(--r-md);
  background:var(--card);color:var(--muted-foreground);
  font-size:13px;line-height:20px;
}
.p-view--in-fwd,.p-view--in-back{opacity:0}
.p-view--in-fwd{animation:pInFwd var(--dur-slow) var(--ease-out) both}
.p-view--in-back{animation:pInBack var(--dur-slow) var(--ease-out) both}
.p-view--out-fwd,.p-view--out-back{pointer-events:none}
.p-view--out-fwd{animation:pOutFwd var(--dur-base) var(--ease-out) both}

const GATE_KEY = "reflect-gate";
const GATE_HASH = "8c04d88f20cf01cb9d8e48dc75ef6e1d36d810d2b74dbe690603f9cefe370c6e";
async function gateHash(s){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function unlockGate(){
  document.body.classList.remove("is-locked");
  const gate = document.getElementById("gate");
  if(gate) gate.remove();
}
if(sessionStorage.getItem(GATE_KEY)==="ok") unlockGate();
document.getElementById("gate-form").addEventListener("submit", async e=>{
  e.preventDefault();
  const err = document.getElementById("gate-err");
  err.textContent = "";
  const ok = await gateHash(document.getElementById("gate-pass").value) === GATE_HASH;
  if(!ok){ err.textContent = "That password doesn't match."; return; }
  sessionStorage.setItem(GATE_KEY, "ok");
  unlockGate();
});
</script>

const STATUS = {
  critical:{ label:"Critical", cls:"fw-badge fw-badge--destructive", icon:I.alert,        color:"var(--status-critical)" },
  elevated:{ label:"Elevated", cls:"fw-badge fw-badge--warning",     icon:I.flag,         color:"var(--status-elevated)" },
  resolved:{ label:"Followed up", cls:"fw-badge fw-badge--success",  icon:I.checkCircle, color:"var(--status-resolved)" },
  normal:{   label:"Normal",   cls:"fw-badge fw-badge--secondary",   icon:I.minus,        color:"var(--status-normal)" }
};
const statusBadge = k => {
  const s = STATUS[k];
  return `<span class="${s.cls}">${s.icon(12)}${s.label}</span>`;
};
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const openCount = () => state.alerts.filter(a=>a.status!=="resolved").length;
const critCount = () => state.alerts.filter(a=>a.status==="critical").length;

function shell(body){

  <div class="fw-alert fw-alert--warning stale-banner" role="status">

            onclick="dismissStale()" aria-label="Dismiss">

/* ============================================================
   4. OVERVIEW (landing)
   ============================================================ */
function surveyPeriod(){
  return `${day(mins(43200))} – ${day(NOW)}`;
}
function liveSurveyStats(){
  const live = state.surveys.filter(s=>s.status==="Live");
  const completed = live.reduce((n,s)=>n+s.responses,0);
  const invited = live.reduce((n,s)=>n+s.sent,0);
  const rate = invited ? Math.round(completed/invited*100) : 0;
  return { live, completed, invited, rate };
}
function oldestOpenWait(){
  const open = state.alerts.filter(a=>a.status!=="resolved");
  if(!open.length) return "—";
  const oldest = open.reduce((a,b)=>a.at<b.at?a:b);
  return ago(oldest.at).replace(" ago","");
}
function cardFunnel(){
  const period = surveyPeriod();
  const { live, completed, invited, rate } = liveSurveyStats();
  const near = rate < 30;
  const low = rate < 25;
  const rateLabel = low ? "Low" : near ? "Near target" : "On target";
  return `
  <section class="fw-card funnel-strip" aria-labelledby="funnel-heading">
    <h2 class="t-h4" id="funnel-heading">Survey response</h2>
    <p class="t-subtle dim mt8">${live.length} live surveys · ${period}</p>
    <div class="funnel-stats">
      <div>
        <div class="stat-k">Invited</div>
        <div class="kpi-v">${invited.toLocaleString("en-US")}</div>
        <p class="stat-sub">Invitations sent</p>
      </div>
      <div>
        <div class="stat-k">Completed</div>
        <div class="kpi-v">${completed.toLocaleString("en-US")}</div>
        <p class="stat-sub">Of ${invited.toLocaleString("en-US")} invited</p>
      </div>
      <div>
        <div class="stat-k">Response rate</div>
        <div class="kpi-v">${rate}%</div>
        <p class="stat-sub"><span class="kpi-delta${near?" is-down":""}">${near?I.trendDown(14):I.trendUp(14)} ${rateLabel}</span> · Target 30%</p>
      </div>
      <div>
        <div class="stat-k">Avg time</div>
        <div class="kpi-v">10 min</div>
        <p class="stat-sub">Per completed survey</p>
      </div>
    </div>
  </section>`;
}
function cardCallback({lead=false}={}){
  const open = openCount();

  return `

}

function scorecardSurveyRows(c){
  const q1Tone = c.q1>=4.0?"var(--primary)":"var(--status-elevated)";
  const recTone = c.rec>=65?"var(--primary)":"var(--status-elevated)";
  const listenTone = (c.listen??0)>=80?"var(--primary)":"var(--status-elevated)";
  const careTone = (c.care??0)>=80?"var(--primary)":"var(--status-elevated)";
  const flagTone = c.flags<=3?"var(--primary)":"var(--status-elevated)";
  const rows = [
    { k:"Avg care rating (Q1)", v:`${c.q1.toFixed(1)} / 5`, sub:"Agency avg: 4.2 / 5",
      pct:Math.round(c.q1/5*100), accent:q1Tone, meter:true },
    { k:"Likelihood to recommend (Q2)", v:`${c.rec}%`, sub:"Agency avg: 69%",
      pct:c.rec, accent:recTone, meter:true }
  ];
  if(c.listen!=null){
    rows.push({ k:"Felt listened to (Q3)", v:`${c.listen}% yes`, sub:"Agency avg: 79%",
      pct:c.listen, accent:listenTone, meter:true });
  }
  if(c.care!=null){
    rows.push({ k:"Felt cared for (Q4)", v:`${c.care}% yes`, sub:"Agency avg: 81%",
      pct:c.care, accent:careTone, meter:true });
  }
  rows.push(
    { k:"Commendations", v:String(c.commend), sub:"Agency avg: 6.4 per crew",
      accent:"var(--primary)", meter:false },
    { k:"Flagged responses", v:String(c.flags), sub:"Agency avg: 3.8 · lower is better",
      accent:flagTone, meter:false }
  );
  return rows;
}

function selectScorecardCrew(i){
  const idx = Number(i);
  if(!Number.isInteger(idx) || idx<0 || idx>=SCORECARD_CREW.length) return;
  state.scorecardCrew = idx;
  render();
  requestAnimationFrame(()=>{
    if(!window.matchMedia("(max-width: 1080px)").matches) return;
    document.getElementById("score-hero")?.scrollIntoView({
      behavior: prefersReduce()?"auto":"smooth", block:"start"
    });
  });
}

/* ============================================================
   5. ALERT QUEUE + DETAIL
   ============================================================ */
let queueFilter = "open";
function setFilter(f){ queueFilter = f; render(); }
function alertRowKey(e,id){
  if(e.key!=="Enter" && e.key!==" ") return;
  e.preventDefault();
  openAlert(id);
}

function viewAlerts(){
  const all = state.alerts;
  const list = queueFilter==="all" ? all
    : queueFilter==="resolved" ? all.filter(a=>a.status==="resolved")
    : all.filter(a=>a.status!=="resolved");
  const o = openCount();

  const tabs = [["open","Open",o],["resolved","Followed up",all.filter(a=>a.status==="resolved").length],["all","All",all.length]];

  return `
  <div class="page-head">
    <div class="crumbs"><a href="#/">Overview</a><span class="sep">/</span><span>Alerts</span></div>
    <div class="between">
      <div>
        <h1 class="t-h2">Alerts</h1>
        <p class="t-p dim">Survey answers that need a person to follow up.</p>
      </div>
      <div class="seg" role="group" aria-label="Filter alerts">
        ${tabs.map(([k,l,n])=>`<button aria-pressed="${queueFilter===k}" onclick="setFilter('${k}')">${l} (${n})</button>`).join("")}
      </div>
    </div>
  </div>
  ${staleBanner()}
  <div class="fw-card sec" style="padding:0">
    ${list.length?`
    <div class="tbl-inset">
    <table class="tbl tbl--stack tbl--alerts">
      <thead><tr>
        <th style="width:132px">Status</th><th>Why it opened</th>
        <th style="width:96px">Unit</th><th style="width:132px">Assigned</th><th style="width:104px">Opened</th>
      </tr></thead>
      <tbody aria-live="polite">
        ${list.map(a=>`
          <tr class="clickable" id="row-${a.id}" tabindex="0"
            aria-label="${esc(a.reason)}"
            onclick="openAlert('${a.id}')"
            onkeydown="alertRowKey(event,'${a.id}')">
            <td class="al-status">${statusBadge(a.status)}</td>
            <td class="al-why">
              <div class="al-reason">${esc(a.reason)}</div>
              <div class="snip">${esc(a.quote)}</div>
              <div class="al-meta">${a.unit} · ${esc(a.assigned)} · ${ago(a.at)}</div>
            </td>
            <td class="al-unit"><span class="mono">${a.unit}</span><div class="t-subtle dim">${esc(a.call)}</div></td>
            <td class="al-assigned${a.assigned==="Unassigned"?" dim":""}">${esc(a.assigned)}</td>
            <td class="dim al-opened">${ago(a.at)}</td>
          </tr>`).join("")}
      </tbody>
    </table>
    </div>`:`
    <div class="empty">
      <div class="dim" style="display:flex;justify-content:center;margin-bottom:12px">${I.inbox(32)}</div>
      <div class="t">Nothing needs a callback right now.</div>
      <div class="s t-p">New alerts show up here as responses come in.</div>
    </div>`}
  </div>`;
}

function drawer(id){
  const a = state.alerts.find(x=>x.id===id);
  if(!a) return "";
  const sc = (k,v) => `
    <div class="row" style="gap:8px">
      <span style="width:76px" class="dim t-subtle">${k}</span>
      <span class="row" style="gap:3px">${[1,2,3,4,5].map(n=>`
        <span style="width:14px;height:14px;border-radius:var(--r-sm);
          background:${n<=v?(v<=2?"var(--status-critical)":v===3?"var(--status-elevated)":"var(--primary)"):"var(--muted)"}"></span>`).join("")}</span>
      <span class="t-subtle" style="font-weight:700">${v} of 5</span>
    </div>`;
  return `
  <div class="scrim" onclick="closeAlert()"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Alert ${a.id}">
    <div class="drawer-head">
      <div>
        ${statusBadge(a.status)}
        <h2 class="t-h4 mt8">${esc(a.reason)}</h2>
        <p class="t-subtle dim">Alert <span class="mono">${a.id}</span> · opened ${ago(a.at)} · ${clock(a.at)}</p>
      </div>
      <button class="iconbtn" onclick="closeAlert()" aria-label="Close">${I.x(18)}</button>
    </div>
    <div class="drawer-body">
      <div class="quote">“${esc(a.quote)}”</div>
      <div class="mt24" style="display:flex;flex-direction:column;gap:8px">
        ${sc("Respect",a.scores.respect)}${sc("Listening",a.scores.listening)}${sc("Comfort",a.scores.comfort)}
      </div>
      <dl class="kv mt24">
        <dt>Unit / crew</dt><dd><span class="mono">${a.unit}</span> — ${esc(a.crew)}</dd>
        <dt>Call type</dt><dd>${esc(a.call)}</dd>
        <dt>Area</dt><dd>${esc(a.zone)}</dd>
        <dt>Age band</dt><dd>${a.band}</dd>
        <dt>Language</dt><dd>${a.lang}</dd>
        <dt>Assigned</dt><dd>${esc(a.assigned)}</dd>
      </dl>
      ${a.lang!=="English"?`<div class="stale mt16" style="margin-bottom:0">
        ${I.users(16)} Patient prefers ${a.lang}. Use the interpreter line for the callback.</div>`:""}

      ${a.status!=="resolved"?`
      <div class="mt24">
        <label class="t-subtle" style="font-weight:700;display:block;margin-bottom:8px" for="note-${a.id}">
          What happened on the callback?</label>
        <textarea class="fw-input" id="note-${a.id}"
          placeholder="Who you reached, what they said, anything you changed."></textarea>
      </div>`:`
      <div class="stale mt24" style="background:var(--status-resolved-wash);color:var(--status-resolved);
           border-color:currentColor;margin-bottom:0">
        ${I.checkCircle(16)} Followed up by ${esc(a.assigned)}.
      </div>`}

      <div class="log">
        <h3 class="t-subtle" style="font-weight:700;margin-bottom:4px">Activity</h3>
        ${a.log.length?`<ul>${a.log.map(l=>`<li>
            <div style="font-weight:700">${esc(l.who)} <span class="dim" style="font-weight:400">· ${ago(l.at)}</span></div>
            <div class="dim">${esc(l.text)}</div></li>`).join("")}</ul>`
          :`<p class="t-subtle dim">Nothing logged yet.</p>`}
      </div>
    </div>
    ${a.status!=="resolved"?`<div class="drawer-foot drawer-foot--alert">
      <button class="fw-btn fw-btn--primary" onclick="logAndResolve('${a.id}')">
        ${I.checkCircle(16)} Log and mark followed up</button>
      <button class="fw-btn fw-btn--outline" onclick="logOnly('${a.id}')">Log without closing</button>
      <button class="fw-btn fw-btn--ghost" onclick="claim('${a.id}')"
        ${a.assigned!=="Unassigned"?"disabled":""}>${I.userPlus(16)} Assign to me</button>
    </div>`:""}
  </aside>`;
}
</script>
<script>
/* ============================================================
   6. SURVEY BUILDER
   ============================================================ */
const TYPE_LABEL = { yesno:"Yes / no", scale:"Rating 1–5", choice:"Multiple choice", text:"Written answer" };

function surveyIdFromHash(){
  const m = (location.hash||"").match(/^#\/surveys\/([^/]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}
function currentSurvey(){ return state.surveys.find(s=>s.id===surveyIdFromHash())||null; }
function qList(){
  const patient = location.hash.startsWith("#/s/") && !location.hash.startsWith("#/surveys");
  const id = patient ? "sv_post" : (surveyIdFromHash() || "sv_post");
  if(!state.surveyQuestions[id]) state.surveyQuestions[id] = [];
  return state.surveyQuestions[id];
}
function syncQuestionCount(id){
  const s = state.surveys.find(x=>x.id===id);
  if(s) s.questions = (state.surveyQuestions[id]||[]).length;
}
function previewQIndex(){
  const qs = qList();
  if(!qs.length) return -1;
  const i = qs.findIndex(q=>q.id===state.previewQId);
  return i>=0 ? i : 0;
}
function selectPreviewQ(id){
  if(state.suppressQClick || state.dragQId) return;
  if(state.previewQId===id) return;
  state.previewQId = id;
  render();
}
function previewQKey(e,id){
  if(e.target!==e.currentTarget) return;
  if(e.key!=="Enter" && e.key!==" ") return;
  e.preventDefault();
  selectPreviewQ(id);
}

function surveyStatusBadge(s){
  return `<span class="fw-badge ${s.status==="Live"?"fw-badge--success":"fw-badge--secondary"}">${
    s.status==="Live"?I.checkCircle(12):I.pencil(12)}${s.status}</span>`;
}
function responseCountLink(s){
  if(s.status!=="Live") return `<span class="dim">—</span>`;
  const n = s.responses;
  const label = n===1 ? "1 response" : n+" responses";
  return `<a class="num-link" href="#/surveys/${s.id}/responses" aria-label="${label}">${n}</a>`;
}
function responsesFor(id){ return state.responses[id] || []; }
function isResponsesRoute(h){ return /^#\/surveys\/[^/]+\/responses/.test(h || location.hash || ""); }

function viewSurveysIndex(){
  const live = state.surveys.filter(s=>s.status==="Live").length;
  const drafts = state.surveys.filter(s=>s.status==="Draft").length;
  return `
  <div class="page-head">
    <div class="crumbs"><a href="#/">Overview</a><span class="sep">/</span><span>Surveys</span></div>
    <div class="between">
      <div>
        <h1 class="t-h2">Surveys</h1>
        <p class="t-p dim">${live} live · ${drafts} draft</p>
      </div>
      <button class="fw-btn fw-btn--primary" onclick="newSurvey()">${I.plus(16)} New survey</button>
    </div>
  </div>
  ${state.surveys.length?`<div class="fw-card" style="padding:0">
    <div class="tbl-inset">
    <table class="tbl tbl--stack tbl--surveys">
      <thead><tr>
        <th class="fav"><span class="sr">Favorite</span></th>
        <th>Survey</th><th>Status</th><th>Responses</th><th>Rate</th><th>Updated</th>
        <th class="morecol"><span class="sr">Actions</span></th>
      </tr></thead>
      <tbody>
        ${state.surveys.map(s=>`
          <tr class="clickable" onclick="go('#/surveys/${s.id}')">
            <td class="fav sv-fav" onclick="event.stopPropagation()">
              <button class="iconbtn star-btn" aria-pressed="${!!s.starred}"
                aria-label="${s.starred?"Remove from favorites":"Add to favorites"}"
                onclick="toggleStar('${s.id}')">${s.starred?I.starFill(18):I.star(18)}</button>
            </td>
            <td class="sv-name" style="font-weight:700">${esc(s.name)}<div class="t-subtle dim">${s.questions} questions</div></td>
            <td class="sv-status">${surveyStatusBadge(s)}</td>
            <td class="sv-responses" data-live="${s.status==="Live"?"yes":"no"}" onclick="event.stopPropagation()">${responseCountLink(s)}</td>
            <td class="sv-rate" data-empty="${s.rate?"no":"yes"}">${s.rate?s.rate+"%":"—"}</td>
            <td class="dim sv-updated">${ago(s.updated)}</td>
            <td class="morecol sv-more">${surveyRowMenu(s)}</td>
          </tr>`).join("")}
      </tbody>
    </table>
    </div>
  </div>`:`
    <div class="fw-card empty">
      <div class="dim" style="display:flex;justify-content:center;margin-bottom:12px">${I.inbox(32)}</div>
      <div class="t">No surveys yet.</div>
      <div class="s t-p">Create one to start collecting feedback.</div>
    </div>`}`;
}

function viewSurveys(){
  const s = currentSurvey();
  if(!s) return viewSurveysIndex();
  const qs = qList();
  const locked = qs.filter(q=>q.locked).length;
  const previewIdx = previewQIndex();
  const meta = s.status==="Live"
    ? `${qs.length} questions · live · ${s.responses} responses so far`
    : `${qs.length} questions · draft · not sent yet`;
  return `
  <div class="page-head">
    <div class="crumbs"><a href="#/">Overview</a><span class="sep">/</span><a href="#/surveys">Surveys</a>
      <span class="sep">/</span><span>${esc(s.name)}</span></div>
    <a class="page-back" href="#/surveys">${I.chevronLeft(16)} Surveys</a>
    <div class="between">
      <div>
        ${state.editingSurveyName===s.id?`
        <h1 class="t-h2 title-edit">
          <label class="sr" for="survey-name-input">Survey name</label>
          <div class="title-edit-field">
            <input class="fw-input title-edit-input" id="survey-name-input" value="${esc(s.name)}"
              maxlength="80" autocomplete="off"
              onkeydown="surveyNameKey(event)" onblur="onSurveyNameBlur()">
            <div class="title-edit-actions">
              <button type="button" class="iconbtn title-edit-save" aria-label="Save name"
                onmousedown="event.preventDefault()" onclick="confirmInlineRename()">${I.check(18)}</button>
              <button type="button" class="iconbtn title-edit-cancel" aria-label="Cancel rename"
                onmousedown="event.preventDefault()" onclick="cancelInlineRename()">${I.x(18)}</button>
            </div>
          </div>
        </h1>`:`
        <h1 class="t-h2 title-edit">
          <button type="button" class="title-edit-hit" title="Rename survey" onclick="startInlineRename('${s.id}')">
            <span>${esc(s.name)}</span>
            <span class="title-edit-pen" aria-hidden="true">${I.pencil(16)}</span>
          </button>
        </h1>`}
        <p class="t-p dim">${meta}</p>
      </div>
      <div class="row page-actions" style="gap:8px">
        ${s.status==="Live"?`<a class="fw-btn fw-btn--outline" href="#/surveys/${s.id}/responses">${I.inbox(16)} Responses</a>`:""}
        <button class="fw-btn fw-btn--outline" onclick="openSurveyPreview()">
          ${I.eye(16)} Preview</button>
        <button class="fw-btn fw-btn--primary" onclick="toast('${s.status==="Live"?"Published. New invitations use this version.":"Published. This survey is now live."}')">${s.status==="Live"?"Publish changes":"Publish"}</button>
      </div>
    </div>
  </div>
  <div class="split">
    <div>
      <div class="fw-card">
        <div class="between between--inline" style="margin-bottom:16px">
          <div>
            <h2 class="t-h4">Questions</h2>
            <p class="t-subtle dim mt8">Drag to reorder. Benchmark questions can't be edited.</p>
          </div>
          <span class="fw-badge fw-badge--outline">${qs.filter(q=>q.required).length} required</span>
        </div>
        ${qs.length?qs.map((q,i)=>`
          <div class="qcard qcard-select ${q.locked?"locked":""} ${i===previewIdx?"selected":""}"
            data-qid="${q.id}" tabindex="0" aria-current="${i===previewIdx?"true":"false"}"
            onclick="selectPreviewQ('${q.id}')" onkeydown="previewQKey(event,'${q.id}')"
            ondragover="qDragOver(event)" ondragenter="qDragEnter(event)" ondrop="qDrop(event)">
            <span class="grip" draggable="true" aria-hidden="true"
              ondragstart="qDragStart(event)" ondragend="qDragEnd()">${q.locked?I.lock(16):I.grip(16)}</span>
            <div class="qcard-body">
              <div class="t-pui" style="font-weight:700">${esc(q.text)}</div>
              <div class="qmeta">
                <span class="fw-badge fw-badge--secondary">${TYPE_LABEL[q.type]}</span>
                ${q.required?`<span class="fw-badge fw-badge--outline">Required</span>`:`<span class="t-detail dim">Optional</span>`}
                ${q.locked?`<span class="fw-badge fw-badge--outline">${I.lock(12)}Benchmark</span>`:""}
              </div>
              ${q.locked?`<p class="t-subtle dim mt8">${esc(q.lockNote)}</p>`:""}
              ${q.help?`<p class="t-subtle dim mt8">${esc(q.help)}</p>`:""}
            </div>
            <div class="qbtns" onclick="event.stopPropagation()">
              <button class="iconbtn" aria-label="Move up"   ${i===0?"disabled":""} onclick="moveQ(${i},-1)">${I.up(16)}</button>
              <button class="iconbtn" aria-label="Move down" ${i===qs.length-1?"disabled":""} onclick="moveQ(${i},1)">${I.down(16)}</button>
              <button class="iconbtn" aria-label="Edit" title="${q.locked?"Benchmark questions can't be edited":"Not in this prototype"}" disabled>${I.pencil(16)}</button>
              <button class="iconbtn" aria-label="Remove" ${q.locked?"disabled title=\"Benchmark questions can't be removed\"":"onclick=\"removeQ('"+q.id+"')\""}>${I.trash(16)}</button>
            </div>
          </div>`).join("") : `<p class="t-subtle dim" style="margin-bottom:16px">No questions yet. Add one, or pick from the library.</p>`}
        <div class="addrow">
          <button class="fw-btn fw-btn--outline fw-btn--sm" onclick="addQ('yesno')">${I.plus(16)} Yes / no</button>
          <button class="fw-btn fw-btn--outline fw-btn--sm" onclick="addQ('scale')">${I.plus(16)} Rating</button>
          <button class="fw-btn fw-btn--outline fw-btn--sm" onclick="addQ('choice')">${I.plus(16)} Multiple choice</button>
          <button class="fw-btn fw-btn--outline fw-btn--sm" onclick="addQ('text')">${I.plus(16)} Written answer</button>
        </div>
      </div>

      <div class="fw-card sec">
        <h2 class="t-h4">Question library</h2>
        <p class="t-subtle dim mt8">Wording other agencies have already tested.</p>
        <div class="lib-filters" role="group" aria-label="Filter library">
          ${LIB_FILTERS.map(([id,label])=>`
            <button type="button" class="lib-chip" aria-pressed="${state.libraryFilter===id}"
              onclick="setLibraryFilter('${id}')">${label}</button>`).join("")}
        </div>
        <div class="lib-list">
          ${(() => {
            const filter = state.libraryFilter;
            const rows = filter==="all" ? LIBRARY
              : filter==="benchmark" ? LIBRARY.filter(l=>l.benchmark)
              : LIBRARY.filter(l=>l.category===filter);
            const added = new Set(qs.map(q=>q.text.trim().toLowerCase()));
            if(!rows.length) return `<p class="t-subtle dim">No questions in this category.</p>`;
            return rows.map(l=>{
              const already = added.has(l.text.trim().toLowerCase());
              return `
            <div class="qcard${already?" added":""}" data-lib-id="${l.id}">
              <div class="qcard-body">
                <div class="t-pui">${esc(l.text)}</div>

const RESPONSE_PAGE = 11;

function questionLabel(q){
  const t = q.text || "";
  if(/call you/i.test(t)) return "Wants a call";
  if(/recommend/i.test(t)) return "Recommend us";
  if(/how well did we do/i.test(t)) return "Care quality";
  if(/listen(?:ed)? to why you didn/i.test(t)) return "Listened about staying";
  if(/feel listened/i.test(t)) return "Felt listened to";
  if(/cared for/i.test(t)) return "Felt cared for";
  if(/do well|did well/i.test(t)) return "What we did well";
  if(/done better|do better/i.test(t)) return "What we could do better";
  if(/if you stayed/i.test(t)) return "Explained staying risks";
  if(/how safe/i.test(t)) return "Feel safe calling 911";
  if(/trust our crews/i.test(t)) return "Trust crews to be respectful";
  if(/when to call 911/i.test(t)) return "Know when to call 911";
  if(/used our service/i.test(t)) return "Used us in the last year";
  if(/language a barrier/i.test(t)) return "Language is a barrier";
  if(/community'?s EMS do well/i.test(t)) return "What EMS does well";
  if(/should we do better/i.test(t)) return "What we should do better";
  if(t.length<=56) return t;
  const cut = t.lastIndexOf(" ", 53);
  return t.slice(0, cut>20?cut:53) + "…";
}
function responseWantsCall(r, qs){
  const q = qs.find(x=>x.type==="yesno" && /call you/i.test(x.text));
  return !!(q && String(r.answers[q.id]||"").toLowerCase()==="yes");
}
function isNegativeAnswer(q, v){
  if(v===undefined || v==="") return false;
  const s = String(v).toLowerCase();
  if(q.type==="yesno"){
    if(/call you/i.test(q.text)) return false;
    if(/barrier|unsafe/i.test(q.text)) return s==="yes";
    return s==="no";
  }
  if(q.type==="choice"){
    const opts = q.options || [];
    const idx = opts.findIndex(o=>o===v);
    if(idx<0) return /poor|unacceptable|not likely|definitely not|unsafe/i.test(s);
    if(opts.length>=5) return idx>=opts.length-2;
    if(opts.length>=4) return idx>=opts.length-1;
    return false;
  }
  return false;
}
function responseQuote(r, qs){
  const texts = qs.filter(q=>q.type==="text" && r.answers[q.id]);
  const better = texts.find(q=>/better/i.test(q.text));
  if(better) return String(r.answers[better.id]);
  const other = texts.find(q=>!/do well|did well/i.test(q.text));
  if(other) return String(r.answers[other.id]);
  return texts[0] ? String(r.answers[texts[0].id]) : "";
}
function responseExcerpt(r, qs){
  const quote = responseQuote(r, qs);
  if(quote) return quote;
  const negatives = qs.filter(q=>isNegativeAnswer(q, r.answers[q.id]));
  if(negatives.length){
    return negatives.map(q=>`${questionLabel(q)}: ${r.answers[q.id]}`).join(" · ");
  }
  if(responseWantsCall(r, qs)) return "Asked for a call";
  const first = qs.find(q=>r.answers[q.id]);
  if(first) return `${questionLabel(first)}: ${r.answers[first.id]}`;
  return "No answers";
}
function responseTitle(r, qs, alert){
  if(alert) return alert.reason;
  if(responseWantsCall(r, qs)) return "Asked for a call";
  return "Survey response";
}
function loadedResponses(id){
  return responsesFor(id).slice().sort((a,b)=>b.at-a.at);
}
function filteredResponses(id, qs){
  const loaded = loadedResponses(id);
  if(state.responseFilter==="flagged") return loaded.filter(r=>r.alert);
  if(state.responseFilter==="callback") return loaded.filter(r=>responseWantsCall(r, qs));
  return loaded;
}
function setResponseFilter(f){
  state.responseFilter = f;
  state.responseLimit = RESPONSE_PAGE;
  render();
}
function showOlderResponses(){
  state.responseLimit += RESPONSE_PAGE;
  render();
}
function responseRowKey(e, surveyId, id){
  if(e.key!=="Enter" && e.key!==" ") return;
  e.preventDefault();
  openResponse(surveyId, id);
}
function responseNeighbors(ref){
  const qs = state.surveyQuestions[ref.surveyId] || [];
  const list = filteredResponses(ref.surveyId, qs).slice(0, state.responseLimit);
  const i = list.findIndex(x=>x.id===ref.id);
  return {
    prev: i>0 ? list[i-1] : null,
    next: i>=0 && i<list.length-1 ? list[i+1] : null,
    index: i,
    total: list.length
  };
}
function focusResponseDrawer(){
  const drawer = document.querySelector(".drawer--response");
  if(!drawer) return;
  const back = drawer.querySelector(".drawer-back");
  const close = drawer.querySelector(".drawer-x");
  if(back && getComputedStyle(back).display!=="none") back.focus();
  else if(close) close.focus();
}

  ${visible.length?`<div class="fw-card fw-card-flush">

      <thead><tr><th>What they said</th><th>Status</th><th>When</th><th>Area</th><th>Language</th><th></th></tr></thead>
      <tbody>

function responseDrawer(ref){
  const s = state.surveys.find(x=>x.id===ref.surveyId);
  const r = responsesFor(ref.surveyId).find(x=>x.id===ref.id);
  if(!s || !r) return "";
  const qs = state.surveyQuestions[ref.surveyId] || [];
  const alert = r.alert && state.alerts.find(a=>a.id===r.alert);
  const call = responseWantsCall(r, qs);
  const quote = responseQuote(r, qs);
  const title = responseTitle(r, qs, alert);
  const meta = [ago(r.at), r.zone, r.band, r.lang].filter(Boolean).join(" · ");
  const badge = alert
    ? statusBadge(alert.status)
    : (call
      ? `<span class="fw-badge fw-badge--outline">${I.phone(12)} Asked for a call</span>`
      : `<span class="fw-badge fw-badge--outline">Response</span>`);
  const nav = responseNeighbors(ref);
  return `
  <div class="scrim" onclick="closeResponse()"></div>
  <aside class="drawer drawer--response${isResponsePaging()?" is-open is-paging":""}" role="dialog" aria-modal="true" aria-labelledby="response-title">
    <div class="drawer-head">
      <div>
        <button type="button" class="drawer-back" onclick="closeResponse()">${I.chevronLeft(16)} Responses</button>
        ${badge}
        <h2 class="t-h4 mt8" id="response-title">${esc(title)}</h2>
        <p class="t-subtle dim">${esc(meta)}</p>
      </div>
      <button class="iconbtn drawer-x" onclick="closeResponse()" aria-label="Close">${I.x(18)}</button>
    </div>
    <div class="drawer-body">
      ${alert?`<div class="stale">
        ${I.flag(16)} Flagged as ${alert.status==="resolved"?"followed up":alert.status}.${call?" They asked for a call.":""}
        <button class="fw-btn fw-btn--primary fw-btn--sm stale__action" type="button" onclick="openAlertFromResponse('${alert.id}')">Open alert</button>
      </div>`: call?`<div class="stale">${I.phone(16)} They asked for a call.</div>`:""}
      ${quote?`<div class="quote">“${esc(quote)}”</div>`:""}
      <div class="${quote||alert||call?"mt24":""}">
        ${qs.filter(q=>!(quote && String(r.answers[q.id]||"")===quote)).map(q=>{
          const v = r.answers[q.id];
          const empty = v===undefined || v==="";
          return `<div class="ans">
            <div class="t-subtle dim">${esc(questionLabel(q))}</div>
            <div class="t-pui" style="font-weight:700;margin-top:4px">${empty?`<span class="dim">Skipped</span>`:esc(String(v))}</div>
          </div>`;
        }).join("")}
      </div>
    </div>
    ${nav.total>1?`<div class="drawer-foot">
      <button class="fw-btn fw-btn--outline drawer-prev" type="button" ${nav.prev?"":"disabled"}
        onclick="openResponseNeighbor('prev')">${I.chevronLeft(16)} Previous</button>
      <span class="drawer-pos" aria-live="polite">${nav.index+1} of ${nav.total}</span>
      <button class="fw-btn fw-btn--outline drawer-next" type="button" ${nav.next?"":"disabled"}
        onclick="openResponseNeighbor('next')">Next ${I.chevronRight(16)}</button>
    </div>`:""}
  </aside>`;
}
function openResponse(surveyId, id){
  state.openResponse = { surveyId, id };
  render();
  requestAnimationFrame(focusResponseDrawer);
}
function openResponseNeighbor(dir){
  const ref = state.openResponse;
  if(!ref) return;
  const nav = responseNeighbors(ref);
  const target = dir==="next" ? nav.next : nav.prev;
  if(!target) return;
  state.openResponse = { surveyId: ref.surveyId, id: target.id };
  render();
  requestAnimationFrame(()=>{
    const body = document.querySelector(".drawer--response .drawer-body");
    if(body) body.scrollTop = 0;
    const sel = dir==="next" ? ".drawer-next" : ".drawer-prev";
    const btn = document.querySelector(sel);
    if(btn && !btn.disabled) btn.focus();
    else focusResponseDrawer();
  });
}
function closeResponse(){
  const id = state.openResponse && state.openResponse.id;
  state.openResponse = null;
  render();
  requestAnimationFrame(()=>{
    const row = id && document.getElementById("row-"+id);
    if(row) row.focus();
  });
}
function openAlertFromResponse(id){
  state.openResponse = null;
  state.openAlert = id;
  render();
}

function pQuestionFields(q, {interactive=false, val}={}){
  const group = interactive ? "radiogroup" : "group";
  if(q.type==="yesno"){
    return `<div class="p-opts" role="${group}" aria-label="${esc(q.text)}">
      ${["Yes","No"].map(o=>pChoice(o,{
        pressed: interactive && val===o,
        onclick: interactive ? `pAnswer('${q.id}','${o}',this)` : null
      })).join("")}

  }
  if(q.type==="choice"){
    return `<div class="p-opts" role="${group}" aria-label="${esc(q.text)}">
      ${(q.options||[]).map(o=>pChoice(esc(o),{
        pressed: interactive && val===o,
        onclick: interactive ? `pAnswer('${q.id}',${esc(JSON.stringify(o))},this)` : null
      })).join("")}

  }
  if(q.type==="scale"){
    const tag = interactive ? "button" : "div";
    return `<div class="p-scale" role="${group}" aria-label="${esc(q.text)}">
      ${[1,2,3,4,5].map(n=>{
        const on = interactive && Number(val)===n;
